    function touchList() { var out = []; for (var k in touches) if (Object.prototype.hasOwnProperty.call(touches, k)) out.push(touches[k]); return out; }

          return;
        }

      }

    }

    document.addEventListener('pointerdown', onDown);
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
    document.addEventListener('wheel', onWheel, { passive: false });

    controls.update = function () { return step(false) || false; };
    controls.dispose = function () {

      document.removeEventListener('pointermove', onMove);

      document.removeEventListener('contextmenu', onMenu);
    };

    // already the orbit's view (OrbitControls does the same in its constructor's update()).
    step(true);

    return controls;
  }

  function makeApi(kind) {
    var canvas = root.querySelector('canvas');
    if (canvas) fitCanvas(canvas);
    return {
      kind: kind,
      root: root,
      canvas: canvas,
      params: params,
      size: sized ? { w: sized.w, h: sized.h } : { w: root.clientWidth || 640, h: root.clientHeight || 480 },
      live: liveMode,

  function startP5(value) {

    else if (typeof window.setup === 'function' || typeof window.draw === 'function') made = new window.p5(undefined, root);
    if (made) sketches.push(made);
  }

  // Re-create each inline <script> of a live page so it runs, in document order. A failing one is
  // reported like any runtime error and does not stop the next.
  function wakeScripts() {
    var list = root.querySelectorAll('script');
    for (var i = 0; i < list.length; i++) {
      var old = list[i];
      if (old.src) continue;                        // the CSP refuses it anyway; say nothing new
      var type = String(old.type || '').toLowerCase();

      var s = document.createElement('script');
      s.text = old.textContent || '';
      try { old.parentNode.replaceChild(s, old); } catch (e) { report('runtime', e); }
    }
  }

  function doRun(msg) {
    reset();
    var my = runSeq;
    var t0 = Date.now();
    var size = sizeOf(msg.size);
    applySize(size);
    whenSized(size, function () {
      if (my === runSeq) runNow(msg, t0);
    });
  }

  function runNow(msg, t0) {
    var kind = RUN_KINDS.indexOf(String(msg.kind || '')) >= 0 ? String(msg.kind) : 'dom';
    try {
      // The guest MAY innerHTML: it is the containment boundary. `params.source` is the shape the
      // Render part uses for markdown/SVG it has already turned into HTML.
      var html = msg.html;

      root.innerHTML = html ? String(html) : defaultHtml(kind);
      styleEl.textContent = String(msg.css || '');

      // first frame (flushing it would only draw one frame twice).

        value = fn(api);

      // them inert). The CSP still decides what they may do — no network, nothing from disk.
      if (liveMode && kind === 'dom') wakeScripts();

      queued = null;
      if (first) flushFirstFrame(first);

    } catch (e) {
      queued = null;
      send('ran', { id: msg.id, ok: false, ms: Date.now() - t0, error: errOf(e, 'run') });
    }
  }

  function doCompute(msg) {
    var t0 = Date.now();
    var done = function (ok, json, error) {
      send('computed', { id: msg.id, ok: ok, ms: Date.now() - t0, json: json, error: error });
    };
    try {
      var fn = new Function('inputs', 'lol', '"use strict";\n' + String(msg.code || ''));
      var out = fn(msg.inputs || {}, { log: function () { console.log.apply(console, arguments); } });
      Promise.resolve(out).then(function (value) {
        var json = null;
        try { json = value === undefined ? null : JSON.stringify(value); }
        catch (e) { done(false, null, errOf(new Error('the result cannot be turned into JSON'), 'compute')); return; }
        if (json !== null && json.length > limits.resultBytes) {
          done(false, null, errOf(new Error('the result is too large'), 'compute'));
          return;
        }
        done(true, json === undefined ? null : json, null);
      }, function (e) { done(false, null, errOf(e, 'compute')); });
    } catch (e) {
      done(false, null, errOf(e, 'compute'));
    }
  }

  // ---- snapshot --------------------------------------------------------------------------------
  function scaled(w, h, maxPx) {
    var longest = Math.max(w, h);
    if (!longest) return { w: 1, h: 1 };
    var k = longest > maxPx ? maxPx / longest : 1;
    return { w: Math.max(1, Math.round(w * k)), h: Math.max(1, Math.round(h * k)) };
  }

  function sendFrame(id, source, w, h, maxPx) {
    var to = scaled(w, h, maxPx);

    out.width = to.w; out.height = to.h;

  // A WebGL canvas (three.js) is only readable if it still holds its drawing buffer: the host asks

      return;

        + '<foreignObject width="100%" height="100%">'
        + '<style xmlns="http://www.w3.org/1999/xhtml">' + String(styleEl.textContent || '').replace(/[<&]/g, ' ') + '</style>'
        + body + '</foreignObject></svg>';
