<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>lol · farm admin</title>
<style>
  :root {
    --bg: #09090b; --surface: #18181b; --surface2: #1f1f23; --border: #27272a;
    --text: #fafafa; --muted: #a1a1aa; --accent: #52525b; --accent2: #71717a;
    --ok: #22c55e; --warn: #eab308; --err: #ef4444; --off: #3f3f46;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 20px 64px; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  h1 .lol { color: var(--muted); font-weight: 500; }
  a.plan { color: var(--muted); font-size: 12.5px; text-decoration: none; border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
  a.plan:hover { color: var(--text); border-color: var(--accent2); }
  .hint a.plan { border: 0; padding: 0; text-decoration: underline; }
  .sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 18px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .health { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 12.5px; color: var(--muted); }
  .health b { color: var(--text); font-weight: 600; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
  .row:first-of-type { border-top: none; }
  /* What the row is keeps room to be read; a long select (vLLM's memory, the context list) is cut to the space left,
     its options still whole once it opens. */
  .row > span:nth-child(2) { flex: 1 1 260px; min-width: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); flex: 0 0 auto; }
  .dot.served { background: var(--ok); }
  .dot.loaded { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  .mname { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  .badges { display: flex; gap: 6px; margin-left: auto; align-items: center; min-width: 0; }
  .badges select { max-width: 100%; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge.on { color: var(--text); border-color: var(--accent2); }
  .badge.star { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--border)); }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); padding: 5px 12px; min-width: 74px; }
  select { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); padding: 5px 8px; }
  button:hover { border-color: var(--accent2); }
  button:disabled { opacity: .5; cursor: default; }
  button.start { border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); }
  button.stop  { border-color: color-mix(in srgb, var(--err) 40%, var(--border)); }
  .plug { display: inline-flex; align-items: center; gap: 6px; margin-right: 16px; font-size: 12.5px; color: var(--muted); }
  .plug .dot { width: 7px; height: 7px; }
  .plug .dot.up { background: var(--ok); } .plug .dot.down { background: var(--off); }
  .token-panel { max-width: 420px; margin: 40px auto; text-align: center; }
  .token-panel input { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; margin: 12px 0; }
  .token-panel .hint { color: var(--muted); font-size: 12.5px; }
  .token-panel .err { color: var(--err); }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  #toast.show { opacity: 1; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  details summary { cursor: pointer; user-select: none; color: var(--muted); }
  details summary h2 { display: inline-block; margin: 0; }
  details[open] summary { margin-bottom: 10px; }
  /* The backend headline: the answer to "what am I serving, on what engine". */
  .hero { padding: 2px 0 12px; }
  .hero-name { font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  .hero-meta { color: var(--muted); font-size: 12.5px; }
  .hero-meta b { color: var(--text); }
  /* The engine sections: one per engine, opened and closed by its summary line, which says its state. */
  details.eng > summary { list-style: none; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; border-radius: 8px; }
  details.eng > summary::-webkit-details-marker { display: none; }
  details.eng > summary::before { content: '▸'; display: inline-block; width: 12px; color: var(--muted); transition: transform .15s; }
  details.eng[open] > summary::before { transform: rotate(90deg); }
  details.eng > summary:focus-visible { outline: 2px solid var(--accent2); outline-offset: 4px; }
  details.eng > summary:hover .ename { color: var(--text); }
  details.eng[open] > summary { margin-bottom: 12px; }
  h2.ename { display: inline; margin: 0; font-size: 16px; text-transform: none; letter-spacing: 0; color: var(--text); }
  .estate { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); min-width: 0; }
  .estate .dot { align-self: center; }
  .dot.busy { background: var(--warn); }
  .dot.bad { background: var(--err); }
  .subsec { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 12px; }
  .ebody > .subsec:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
  @media (prefers-reduced-motion: reduce) { details.eng > summary::before { transition: none; } }
  .hint { color: var(--muted); font-size: 12px; padding: 2px 0 8px; }
  .hint b { color: var(--text); font-weight: 600; }
  input[type=text], input[type=password] { font: inherit; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); padding: 5px 9px; min-width: 190px; }
  input[type=text]:focus, input[type=password]:focus { outline: none; border-color: var(--accent2); }
  .badges input[type=text], .badges input[type=password] { min-width: 220px; }
  .badges button { white-space: nowrap; }
  /* Long jobs (a model download is minutes) need to look like progress, not a hang.
     Sticky, because the operator is usually scrolled down at the card whose button
     STARTED the job (the model library) — a bar that renders off-screen at the top
     of the page reads as "nothing happened". */
  .jobbar { position: sticky; top: 10px; z-index: 30; background: var(--surface); border: 1px solid color-mix(in srgb, var(--accent2) 45%, var(--border)); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; box-shadow: 0 8px 24px color-mix(in srgb, var(--bg) 70%, transparent); }
  .jobbar.done { border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); }
  .jobbar.failed { border-color: color-mix(in srgb, var(--err) 45%, var(--border)); }
  .jobtop { display: flex; justify-content: space-between; gap: 14px; font-size: 12.5px; }
  .jobmeta { margin-top: 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .jobtop span { color: var(--muted); text-align: right; }
  .bar { height: 5px; border-radius: 999px; background: var(--surface2); overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--accent2); transition: width .3s; }
  .bar > i.indet { animation: sweep 1.4s ease-in-out infinite; transform-origin: left; }
  @keyframes sweep { 0% { transform: scaleX(.15); } 50% { transform: scaleX(.6); } 100% { transform: scaleX(.15); } }
  /* Performance card: recent tok/s as a tiny bar history. */
  .perfnum { font-size: 26px; font-weight: 650; letter-spacing: -.01em; }
  .perfnum small { font-size: 13px; color: var(--muted); font-weight: 500; }
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 38px; margin: 8px 0 2px; }
  .spark i { flex: 1; min-width: 3px; background: var(--accent2); border-radius: 2px 2px 0 0; }
  .spark i.z { background: var(--surface2); }
  .warnline { color: var(--warn); font-size: 12.5px; padding: 4px 0; }
  .warnline b { color: var(--warn); }
  /* Presets: one row each, the one in use marked; the review (the dry run) opens under the row looked at. */
  .needline { color: var(--warn); font-size: 12px; }
  .preview { margin: 0 0 4px 20px; }
  .preview h2 { margin: 6px 0 2px; }
  .preview ul { margin: 2px 0 8px; padding-left: 18px; font-size: 12.5px; color: var(--muted); }
  .preview li { margin: 2px 0; }
  .preview li b, .preview .hint b { color: var(--text); }
  /* A phone: a row's controls go under its text. */
  @media (max-width: 620px) {
    .row { flex-wrap: wrap; }
    .row > span:nth-child(2) { flex-basis: calc(100% - 20px); }
    .badges { flex: 1 1 calc(100% - 20px); flex-wrap: wrap; justify-content: flex-start; margin-left: 20px; }
    .badges input[type=text], .badges input[type=password] { min-width: 0; flex: 1 1 180px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
</div>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const app = $('#app');
let token = localStorage.getItem('lolAdminToken') || '';
let busy = false;      // an action (start/stop) is in flight — pause polling + block clicks
let lastState = null;
// The Clients section is collapsible; the 5s poll rebuilds the DOM, so its
// open/closed state lives here (and in localStorage) instead of in the element.
let clientsOpen = localStorage.getItem('lolClientsOpen') === '1';
// The engine sections (owner, 2026-10-12): Ollama, llama.cpp, vLLM (and External only while configured), each holding
// everything about its engine. Same reason: what the person opened or closed lives here (and in localStorage); a section
// nobody touched is open while its engine serves. The check of this computer runs once per page when vLLM's opens,
// never per poll; vLLM's log is shown until hidden.
let engOpen = {};          // { ollama: true|false, … }: what the person chose; absent = the default
let servingSeen = null;    // the engine that served at the last render: when it changes, the new one opens
try { engOpen = JSON.parse(localStorage.getItem('lolEngineOpen') || '{}') || {}; servingSeen = localStorage.getItem('lolServingSeen'); } catch { /* private window */ }
let vllmChecking = false;
let vllmAutoChecked = false;
let vllmLogLines = null;
// Model storage (owner, 2026-10-12): what is typed in its folder fields (kept across the 5 s re-render), the last look
// in a folder ("Use the models in this folder": each engine's section shows its part) and what is ticked there.
let stDir = null;          // "Keep everything here" (null = the farm's folder, as it is)
let stScanDir = '';        // "Use the models in this folder"
let wslDest = '';          // WSL's Linux disk: where to move it
let scanResult = null;     // { dir, found: { gguf, vllm, ollama }, truncated }
const scanPicked = new Set();   // 'gguf:<path>' | 'vllm:<path>'
let storageChecked = false;

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}
function gb(bytes) { return bytes ? (bytes / 1e9).toFixed(1) + ' GB' : ''; }
// Downloads span a 600 MB projector and a 70 GB model, so the unit has to follow
// the number - '0.6 GB' hides progress that 600 MB shows.
function sizeOf(bytes) {
  if (!bytes && bytes !== 0) return '';
  if (bytes < 1e9) return Math.round(bytes / 1e6) + ' MB';
  return (bytes / 1e9).toFixed(1) + ' GB';
}
function rateOf(bps) {
  if (!bps) return '';
  return bps < 1e9 ? Math.round(bps / 1e6) + ' MB/s' : (bps / 1e9).toFixed(1) + ' GB/s';
}
// 'about 6 min left' beats '361s': the operator is deciding whether to wait or
// go do something else, and that decision needs a rounded number, not precision.
function etaOf(sec) {
  if (sec == null || sec < 0) return '';
  // Bands chosen so the words are never a worse estimate than the number: 42 s
  // read as 'a few seconds left' during testing, which is simply untrue.
  if (sec < 15) return 'a few seconds left';
  if (sec < 45) return 'less than a minute left';
  if (sec < 90) return 'about a minute left';
  if (sec < 3600) return 'about ' + Math.round(sec / 60) + ' min left';
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return 'about ' + h + 'h' + (m ? ' ' + m + 'm' : '') + ' left';
}
function dur(sec) {
  if (sec == null) return '';
  if (sec < 60) return sec + 's';
  if (sec < 3600) return Math.floor(sec / 60) + 'm';
  return Math.floor(sec / 3600) + 'h ' + Math.floor((sec % 3600) / 60) + 'm';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

async function api(path, opts = {}) {
  const headers = { 'Authorization': 'Bearer ' + token };
  if (opts.body) headers['content-type'] = 'application/json';
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401) { const e = new Error('unauthorized'); e.unauthorized = true; throw e; }
  return res.json();
}

function tokenPanel(errMsg) {
  app.innerHTML =
    '<div class="token-panel"><h1>lol <span class="lol">farm admin</span></h1>'
    + '<p class="hint">Enter the admin token. In the Farm app: Settings ▸ Panel access token (Copy). For a farm started from a terminal: the token printed when it started.</p>'
    + (errMsg ? '<p class="err">' + esc(errMsg) + '</p>' : '')
    + '<input id="tok" type="password" placeholder="admin token" autocomplete="off" />'
    + '<button id="tok-go">Unlock</button>'
    + '<p class="hint" style="margin-top:18px">No token needed to <a class="plan" href="/lol/capacity" target="_blank" rel="noopener">plan capacity ↗</a>: which hardware and model serve how many people.</p></div>';
  const go = () => { const v = $('#tok').value.trim(); if (!v) return; token = v; localStorage.setItem('lolAdminToken', v); refresh(); };
  $('#tok-go').onclick = go;
  $('#tok').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  $('#tok').focus();
}

function render(s) {
  lastState = s;
  const h = s.health || {};
  const gpu = h.gpu || {};
  const host = h.host || {};
  const be = s.backend || {};
  const lc = s.llamacpp || {};
  const cap = s.capacity || {};
  const job = s.job || null;
  const jobRunning = !!(job && !job.done);

  // --- the running job, and the download -----------------------------------------
  // Switching backend or model means downloading and reloading gigabytes; without
  // this the panel looked frozen for ten minutes and an operator would reasonably
  // conclude the farm had hung and restart it mid-download.
  // Two bars (docs/VLLM_MANAGED_PLAN.md §7.3): the JOB (a switch, a start, an Apply,
  // an Ollama pull) and the DOWNLOAD (installing vLLM, a vLLM model), which runs
  // while the farm keeps serving. Each gets Stop when it can be stopped halfway.
  const jobBar = barOf(job, 'job') + barOf(s.download, 'download');

  // --- what serves ----------------------------------------------------------------
  // The headline answers the two questions the panel never used to: what is users'
  // model actually called, and which engine is behind it.
  const engineName = ENGINE_LABEL[be.engine] || 'Ollama';
  const v = s.vllm || {};
  const isV = be.engine === 'vllm';
  const serving = SECTION_OF[be.engine] || 'ollama';
  noteServing(serving);
  // A server this farm does not run (set up by a developer): its model, context and
  // people at once are its own, so none of the controls below apply to it (§7.7).
  const externalRow = be.engine === 'external'
    ? `<div class="warnline">Serving through a server this farm does not run, at <b>${esc(be.baseUrl || '')}</b>. `
      + `Its model, context and people at once are set where that server runs. `
      + `To serve from this farm instead, press Serve with in the Ollama, llama.cpp or vLLM section below.</div>`
    : '';
  const perSlot = be.contextPerSlot || be.contextLength || 0;
  const slotLine = isV
    ? `${be.slots} people at once · ${fmtK(be.contextLength)} of context each`
    : be.slots > 1
    ? (be.kvUnified
        ? `${be.slots} people at once · up to ${fmtK(be.contextLength)} of context (shared pool, ${fmtK(perSlot)} guaranteed)`
        : `${be.slots} people at once · ${fmtK(perSlot)} of context each`)
    : `1 person at a time · ${fmtK(perSlot)} of context`;

  // The engine can have FALLEN BACK at boot (weights failed to fetch, platform
  // unsupported): the farm serves with Ollama and this is the only place the
  // operator learns why — the run itself looks healthy.
  const bootErr = s.llamacppBootError
    ? `<div class="warnline">llama.cpp could not start — ${esc(s.llamacppBootError)}</div>`
    : '';
  // A GPU latched at a low clock under load (perf.js makeClockWatch): on a DGX Spark only a full
  // power-off clears it, and nothing else here would say why every reply got slow.
  const clockErr = gpu.stuckMhz
    ? `<div class="warnline">The GPU is stuck at a low clock (${esc(String(gpu.stuckMhz))} MHz): fully power the box off (unplug it for a minute), then start it again.</div>`
    : '';
  const heroCard =
    `<div class="card">`
    + `<h2>Serving</h2>`
    + bootErr
    + clockErr
    + externalRow
    + vllmStatusLine(s)
    + `<div class="hero"><div class="hero-name">${esc(be.alias || '—')}</div>`
    + `<div class="hero-meta">${esc(engineName)} · ${esc(be.model || '—')}</div>`
    + `<div class="hero-meta">${esc(slotLine)}${cap.clients != null ? ` · <b>${cap.clients}</b> connected now` : ''}</div></div>`
    + `</div>`;

  // --- the serving engine's people and context -------------------------------------
  // In the section of the engine that serves: Apply writes them to that engine. The
  // knob that decides whether a workshop works. Hidden under an external server: its
  // concurrency and window are its own.
  // On Ollama the setting is PER BOX (ollama.numParallel) while be.slots is the
  // farm total (x reachable hosts) — showing the total and writing it back as the
  // per-box value made "2 hosts x 2" read "4", and picking 8 gave 16.
  const capacity = `<div class="subsec"><h2>People and context</h2>`
    + (be.engine === 'external' ? '' : isV ? vllmSlotsRow(v) : (() => {
        const cur = be.engine === 'ollama' ? ((s.ollama && s.ollama.numParallel) || be.slots) : be.slots;
        const opts = [1, 2, 3, 4, 6, 8];
        if (cur && !opts.includes(cur)) opts.push(cur);
        opts.sort((a, b) => a - b);
        const manyHosts = !!(s.ollama && (s.ollama.hosts || []).length > 1);
        return `<div class="row"><span></span><span><div class="mname">People served at once${be.engine === 'ollama' ? ', per box' : ''}</div>`
          + `<div class="meta">${be.engine === 'llama.cpp'
              ? (be.kvUnified
                  ? 'slots share one context pool — a person alone gets the whole window, people arriving share it'
                  : 'llama.cpp splits its context window across slots, so more slots means less context each')
              : `requests each Ollama box runs in parallel${manyHosts ? ` (${be.slots} across the farm now)` : ''} — applies after a farm restart`}</div></span>`
          + `<span class="badges"><select id="slots-sel" data-orig="${cur}">${
              opts.map((n) => `<option value="${n}"${n === cur ? ' selected' : ''}>${n}</option>`).join('')
            }</select></span></div>`;
      })())

    // Context window. What it gives each person is the line below (tradeLine), which
    // follows an edit — a static sum here contradicted it mid-edit. Hidden under an
    // external server: its window is whatever that server was launched with.
    + (be.engine === 'external' ? '' : isV ? vllmCtxRow(v) + vllmKvRow(v) : `<div class="row"><span></span><span><div class="mname">Context window</div>`
    + `<div class="meta">how much text the model reads at once — bigger fits whole documents, costs VRAM</div></span>`
    + `<span class="badges"><select id="ctx-sel" data-orig="${esc(String((be.engine === 'llama.cpp' ? lc.contextLength : (s.ollama && s.ollama.contextLength)) ?? 'auto'))}">${be.engine === 'llama.cpp'
        ? ctxOptions(lc.contextLength, lc.contextResolved || be.contextLength, s.fit, s.fit && s.fit.nativeMax)
        : ctxOptions((s.ollama && s.ollama.contextLength) ?? be.contextLength, be.contextLength, null, s.ollama && s.ollama.nativeMax)}</select></span></div>`)

    // What the settings above give each person, and what the clients do with it,
    // updated as the operator edits (tradeLine). Under an external server: the declared values.
    + `<div id="trade">${isV ? vllmTrade(s) : tradeLine(s)}</div>`
    + (be.engine === 'external' ? '' : '<div class="hint">They apply with <b>Apply changes</b>, at the end of Access below.</div>')
    + `</div>`;

  // --- Access: what every engine shares -------------------------------------------
  // The name users see, the seat hold and the farm password, then the ONE Apply.
  const accessCard = `<div class="card" id="access"><h2>Access</h2>`
    // The advertised name — llama.cpp and vLLM: it IS that engine's one served alias.
    // On the Ollama engine names live on the model rows (per-model Rename); a
    // global field here silently fought them (owner report 2026-08-31).
    + (be.engine === 'llama.cpp' || isV
      ? `<div class="row"><span></span><span><div class="mname">Name users see</div>`
        + `<div class="meta">${isV ? 'what appears in the model picker. Renaming takes a few seconds; vLLM keeps running.' : 'what appears in the model picker — not the checkpoint\'s technical name'}</div></span>`
        + `<span class="badges"><input id="name-in" type="text" maxlength="48" spellcheck="false" value="${esc(be.alias || '')}" data-orig="${esc(be.alias || '')}" /></span></div>`
      : be.engine === 'ollama'
      ? '<div class="row"><span></span><span><div class="mname">Name users see</div><div class="meta">on Ollama each model has its own: <b>Rename</b> on its row, in the Ollama section above</div></span><span></span></div>'
      : '')

    // The seat hold (proxy.seatIdleSec, owner 2026-10-04): short for a class, back to
    // 15 min after. Minutes here, seconds in the file. Only while the seat gate is on
    // (seatIdleSec is null otherwise); the gate is the farm's own, so any engine.
    + (cap.seatIdleSec == null ? '' : (() => {
        const opts = [60, 120, 180, 300, 600, 900, 1800, 3600];
        if (!opts.includes(cap.seatIdleSec)) opts.push(cap.seatIdleSec);
        opts.sort((a, b) => a - b);
        return `<div class="row"><span></span><span><div class="mname">Free an idle seat after</div>`
          + `<div class="meta">a seat nobody generates on goes to the next person — 2 min suits a workshop, 15 min is the default · applies at once</div></span>`
          + `<span class="badges"><select id="idle-sel" data-orig="${cap.seatIdleSec}">${
              opts.map((n) => `<option value="${n}"${n === cap.seatIdleSec ? ' selected' : ''}>${+(n / 60).toFixed(1)} min</option>`).join('')
            }</select></span></div>`;
      })())

    // The shared farm password (ComfyQ-style). One string for everyone; clients
    // prompt for it when the beacon says requiresKey. Setting/clearing bounces
    // the proxy for a few seconds.
    + `<div class="row"><span></span><span><div class="mname">Farm password</div>
    <div class="meta">${s.requiresKey
        ? '<b>Set.</b> Protects chat (everything on /v1), document reading, document search, Classify, speech to text and the message bus. Web search, voice and discovery stay open on the LAN. When the password is set or changed, a device that could already use document reading, document search, Classify or speech to text keeps them until the farm restarts. Use <b>Remove</b> to take it off.'
        : 'Not set — anyone on the network can use this farm. Type one to require it (protects chat, document reading, document search, Classify, speech to text and the message bus; web search, voice and discovery stay open).'}</div></span>
    <span class="badges"><input id="sec-in" type="password" placeholder="${s.requiresKey ? '••••••••' : 'choose a password'}" maxlength="128" spellcheck="false" autocomplete="new-password" data-orig="" />${
      s.requiresKey ? `<button id="sec-clear" class="stop"${jobRunning ? ' disabled' : ''}>Remove</button>` : ''}</span></div>`

    // ONE Apply for everything above (owner ask 2026-08-31): each setting used to
    // carry its own button, and each press restarted the server — four restarts to
    // change four things. Edits are collected and applied together in one restart:
    // these rows and the serving engine's people and context, in its section above.
    // On vLLM some changes restart it and some do not: the row says which, and Apply
    // asks the farm first (a dry run) and confirms only a restart.
    + `<div class="row"><span></span><span><div class="meta">${isV
        ? 'Changes above apply together. A new context, memory or model restarts vLLM: about 2 minutes during which nobody can chat. The name, the password and people at once apply in a few seconds, up to a point for people: many more can restart vLLM too, and Apply asks first when it would.'
        : 'Changes above apply together — one restart for all of them.'}</div></span>`
    + `<span class="badges"><button id="settings-apply"${jobRunning ? ' disabled' : ''}>Apply changes</button></span></div>`
    + `</div>`;

  // --- performance ---------------------------------------------------------------
  // What the engine is actually doing: measured tok/s while generating (from its
  // own counters — wall-clock averages would understate), load, and the warnings
  // that would have named the live incident: VRAM full at idle. Read from
  // llama-server, or from an external server that is a vLLM (perf.engine 'vllm').
  // The llama.cpp warnings stay llama.cpp's: a vLLM fills VRAM on purpose, and
  // its own context is set where it was launched.
  const perf = s.perf || null;
  const hist = s.perfHistory || [];
  const hmax = Math.max(1, ...hist.map((x) => x.gen || 0));
  const spark = hist.length
    ? `<div class="spark" title="generation speed, last ${hist.length} samples">${hist.map((x) =>
        `<i${x.gen ? '' : ' class="z"'} style="height:${Math.max(6, Math.round(((x.gen || 0) / hmax) * 100))}%"></i>`).join('')}</div>`
    : '';
  const g = (s.health && s.health.gpu) || {};
  const vramFrac = (g.vramUsedGb != null && g.vramTotalGb) ? g.vramUsedGb / g.vramTotalGb : null;
  const idle = g.gpuUtil != null && g.gpuUtil < 10;
  const loadedOll = (s.models || []).filter((m) => m.loaded).map((m) => m.id);
  const perfWarns = [];
  if (be.engine === 'llama.cpp' && vramFrac != null && vramFrac > 0.94 && idle)
    perfWarns.push('GPU memory is nearly full while idle — the context window is probably larger than this card holds. Lower it above.');
  if (be.engine === 'llama.cpp' && perf && perf.lastGenTokSec != null && perf.lastGenTokSec < 15)
    perfWarns.push(`Generating at ${perf.lastGenTokSec} tok/s — far below what this hardware should do. GPU memory is likely overcommitted (context too large, another model loaded, or another app on the GPU).`);
  // Decision (audit 2026-08-26): auto-context deliberately fills the card, and the
  // OCR vision model (~7.6 GB) cannot ALSO fit on a 12/16 GB GPU — reserving room
  // for it would collapse chat context to nothing, which is the wrong trade. So the
  // contention is surfaced instead of hidden, and the pressure-evict cleans up.
  if (be.engine === 'llama.cpp' && s.ocrModel && s.fit && s.fit.vramGb && s.fit.needGb + 6 > s.fit.vramGb)
    perfWarns.push(`Document reading shares this GPU and its vision model cannot fit next to the chat model — extractions will run slowly and be unloaded afterwards. For heavy document use: a bigger card, or OCR off on this box.`);
  // Any engine but Ollama: the farm frees these the same way beside either.
  if (be.engine !== 'ollama' && loadedOll.length)
    perfWarns.push(`Also in GPU memory: ${loadedOll.join(', ')} (document reading — freed automatically when the GPU is idle and full).`);
  // A vLLM's real KV pool against the declared seats x window (worded by the farm).
  if (s.poolWarning) perfWarns.push(s.poolWarning);
  // Document reading drives Ollama beside vLLM, in the memory kept for it (§1.4, §7.6).
  if (be.engine === 'vllm' && s.ocrFits === false && s.ocrModel) {
    const gemma = /^gemma4:12b$/.test(String(s.ocrModel));
    perfWarns.push(`Document reading uses ${s.ocrModel} (${s.ocrGb} GB), which does not fit the ${(s.vllm && s.vllm.ocrReserveGib) || 0} GB kept for it beside vLLM: documents will read slowly.`
      + (gemma ? '' : ' Download gemma4:12b in the Ollama section above; the farm then uses it.'));
  }
  const perfBits = [
    // A vLLM counts requests, not seats: one person can run several, up to its --max-num-seqs
    // (measured: "128/48" on a 48-seat farm), so it gets no seat denominator.
    perf && perf.busySlots != null ? (perf.engine === 'vllm'
      ? `Generating now <b>${perf.busySlots}</b> request${perf.busySlots === 1 ? '' : 's'}`
      : `Generating now <b>${perf.busySlots}/${perf.totalSlots}</b>`) : '',
    perf && perf.queued ? `Waiting <b>${perf.queued}</b>` : '',
    // Reading speed (prefill) — was measured all along, never shown.
    perf && perf.lastPromptTokSec != null ? `Reading <b>${perf.lastPromptTokSec} tok/s</b>` : '',
    // Cache effectiveness: of the prompt tokens in the last active window, how
    // many came from the KV cache instead of being re-read. High = follow-up
    // turns cost only their new text; low on long chats = every turn re-reads
    // the whole history.
    perf && perf.lastCacheHitRatio != null ? `Context cache hits <b>${Math.round(perf.lastCacheHitRatio * 100)}%</b>` : '',
    perf && perf.kvUsed != null ? `Context memory used <b>${Math.round(perf.kvUsed * 100)}%</b>` : '',
    // vLLM only (llama.cpp's perf has none of these): the KV pool it allocated,
    // everyone's tokens together, and how many speculative draft tokens it kept.
    perf && perf.kvPoolTokens != null ? `Context memory <b>${perf.kvPoolTokens.toLocaleString('en-US')} tokens</b>` : '',
    perf && perf.lastThroughputTokSec != null ? `All together <b>${perf.lastThroughputTokSec} tok/s</b>` : '',
    perf && perf.lastDraftAcceptRatio != null ? `Draft tokens accepted <b>${Math.round(perf.lastDraftAcceptRatio * 100)}%</b>` : '',
    (g.vramUsedGb != null && g.vramTotalGb != null) ? `VRAM <b>${g.vramUsedGb}/${g.vramTotalGb} GB</b>` : '',
    g.gpuUtil != null ? `GPU <b>${g.gpuUtil}%</b>` : '',
  ].filter(Boolean).map((x) => `<span>${x}</span>`).join('');   // one item each: a label stays with its value
  // In the section of the engine that serves. An external server shows it only once it has proven to be a vLLM; the
  // farm's own vLLM always does.
  const perfBlock = be.engine === 'llama.cpp' || be.engine === 'vllm' || (be.engine === 'external' && perf)
    ? `<div class="subsec"><h2>Performance</h2>`
      + `<div class="perfnum">${perf && perf.lastGenTokSec != null ? perf.lastGenTokSec : '—'} <small>tok/s while generating${perf && perf.lastActiveTs ? '' : ' · no traffic measured yet'}</small></div>`
      + `<div class="health">${perfBits}</div>`
      + spark
      + perfWarns.map((w) => `<div class="warnline">⚠ ${esc(w)}</div>`).join('')
      + `</div>`
    : '';

  // --- Ollama catalog ------------------------------------------------------------
  // STANDBY whenever Ollama is not the engine: llama.cpp OR an external server.
  // Keyed on "not ollama" (it used to be "=== llama.cpp"), which under an external
  // server offered Offer / Make default buttons that load models into the GPU the
  // external server is using.
  const standby = be.engine !== 'ollama';
  const models = (s.models || []).slice().sort((a, b) => Number(b.served) - Number(a.served) || a.id.localeCompare(b.id));
  const rows = models.length ? models.map((m) => {
    const dotCls = 'dot' + (m.served ? ' served' : '') + (m.loaded ? ' loaded' : '');
    const meta = [gb(m.size), m.paramSize].filter(Boolean).join(' · ');
    const isOcr = s.ocrModel && m.id.replace(/:latest$/, '') === String(s.ocrModel).replace(/:latest$/, '');
    const badges = [
      m.isDefault && !standby ? '<span class="badge star">★ default</span>' : '',
      isOcr ? '<span class="badge">document reading</span>' : '',
      m.loaded ? '<span class="badge on">in VRAM</span>' : '',
      standby ? '' : (m.served ? '<span class="badge on">offered</span>' : '<span class="badge">idle</span>'),
    ].filter(Boolean).join('');
    // Promoting to default is meaningless while another engine owns the name clients
    // auto-select — so the button is hidden there rather than lying about its effect.
    const defBtn = m.served && !m.isDefault && !standby
      ? `<button data-dact="default" data-id="${esc(m.id)}" title="Every client auto-selects this model">Make default</button>` : '';
    // Offer/Stop change what OLLAMA serves — meaningless while another engine
    // serves (nothing here is routed), so they are hidden rather than left lying.
    const btn = standby ? '' : (m.served
      ? `<button class="stop" data-act="stop" data-id="${esc(m.id)}">Stop</button>`
      : `<button class="start" data-act="start" data-id="${esc(m.id)}">Offer</button>`);
    const del = isOcr ? '' : `<button class="stop" data-olrm="${esc(m.id)}" title="Delete the weights from this box"${jobRunning ? ' disabled' : ''}>Delete</button>`;
    // Each served model can carry its own advertised name (checkpoint id by
    // default, admin-overridable — setModelAlias). Renamed rows lead with the
    // name users see; the checkpoint id moves into the meta line.
    const renamed = m.servedAs && m.servedAs !== m.id;
    // Not on the default row while llama.cpp or vLLM serves: a switch back gives the
    // default that engine's name (so bound chats survive), so it is renamed in Access.
    const rnBtn = m.served && !((be.engine === 'llama.cpp' || be.engine === 'vllm') && m.isDefault)
      ? `<button data-rn="${esc(m.id)}" data-cur="${esc(m.servedAs || m.id)}" title="The name users see for this model"${jobRunning ? ' disabled' : ''}>Rename</button>` : '';
    const metaLine = [renamed ? `checkpoint ${m.id}` : '', meta].filter(Boolean).join(' · ');
    return `<div class="row"><span class="${dotCls}"></span>`
      + `<span><div class="mname">${esc(renamed ? m.servedAs : m.id)}</div>${metaLine ? `<div class="meta">${esc(metaLine)}</div>` : ''}</span>`
      + `<span class="badges">${badges}${defBtn}${rnBtn}${btn}${del}</span></div>`;
  }).join('') : '<div class="empty">No models installed on any reachable host.</div>';

  const ollamaBody = `<div class="hint">Several models to choose from, for a few people at once. ${standby
        ? `<b>Not served right now</b> — one engine at a time, and ${esc(engineName)} is serving. These stay installed for an engine switch, and document reading uses its model from here.`
        : 'These are what this farm serves. The ★ one is what clients auto-select.'}</div>`
    + ollamaStorageRows(s, jobRunning)
    + rows
    + `<div class="row"><span></span><span><div class="mname">Download a model</div>`
    + `<div class="meta">an Ollama model name, e.g. <b>gemma4:12b</b> or <b>qwen3.8:14b</b> — downloaded to this box and offered to clients while Ollama is the engine</div></span>`
    + `<span class="badges"><input id="ol-id" type="text" placeholder="gemma4:12b" spellcheck="false" />`
    + `<button id="ol-pull"${jobRunning ? ' disabled' : ''}>Download</button></span></div>`
    + (standby ? serveRow(s, 'ollama', jobRunning) : capacity);

  // --- the engine sections, in a fixed order ----------------------------------------
  // Each holds everything about its engine; the serving one adds its people and context
  // and its Performance, every other one ends with its Serve with button.
  const sections = section(s, 'ollama', ollamaBody)
    + section(s, 'llamacpp', llamacppSection(s, jobRunning, capacity, perfBlock))
    + section(s, 'vllm', vllmSection(s, jobRunning, capacity, perfBlock))
    // Only while a developer configured one (D2): the panel never offers it otherwise.
    + (s.externalConfigured || be.engine === 'external'
      ? section(s, 'external', '<div class="hint">A server this farm does not run, set up by a developer.</div>'
        + (be.engine === 'external' ? capacity + perfBlock : serveRow(s, 'external', jobRunning)))
      : '');

  // --- farm health --------------------------------------------------------------
  const healthBits = [
    `Hosts <b>${h.hostsUp ?? '?'}/${h.hostsTotal ?? '?'}</b>`,
    `Proxy <b>${h.proxyUp ? 'up' : 'down'}</b>`,
    host.gpu ? `GPU <b>${esc(host.gpu)}</b>` : '',
    gpu.gpuUtil != null ? `Util <b>${gpu.gpuUtil}%</b>` : '',
    (gpu.vramUsedGb != null && gpu.vramTotalGb != null) ? `VRAM <b>${gpu.vramUsedGb}/${gpu.vramTotalGb} GB</b>` : '',
  ].filter(Boolean).map((x) => `<span>${x}</span>`).join('');   // one item each: a label stays with its value

  // Farm plugins — live enable/disable toggles.
  const plugins = s.plugins || {};
  // What a person should know before turning one on or off (owner, 2026-10-08: Document search).
  const PLUGIN_NOTES = {
    embed: 'Laptops send the text of their documents here to make them searchable, in many languages, and keep what comes back. Nothing is kept on this farm. Uses about 1.2 GB of GPU memory. Turned off, laptops that use it cannot add documents until it is back.',
  };
  const pluginRows = Object.keys(plugins).map((k) => {
    const p = plugins[k] || {};
    const on = !!p.enabled;
    const dotCls = 'dot' + (on && p.healthy ? ' served' : '');
    const state = !on ? 'off' : (p.healthy ? 'on' : 'starting…');
    const btn = on
      ? `<button class="stop" data-pact="disable" data-id="${esc(k)}">Disable</button>`
      : `<button class="start" data-pact="enable" data-id="${esc(k)}">Enable</button>`;
    return `<div class="row"><span class="${dotCls}"></span>`
      + `<span><div class="mname">${esc(p.label || k)} <span class="badge">farm</span></div>`
      + `<div class="meta">runs on this box · ${state}</div>${PLUGIN_NOTES[k] ? `<div class="meta">${PLUGIN_NOTES[k]}</div>` : ''}</span>`
      + `<span class="badges">${btn}</span></div>`;
  }).join('');
  // Client-side plugin (Blender) — the farm can only RECOMMEND it to the fleet.
  const recommended = new Set(s.recommendedClientPlugins || []);
  const blenderOn = recommended.has('blender');
  const blenderRow = `<div class="row"><span class="dot${blenderOn ? ' served' : ''}"></span>`
    + `<span><div class="mname">Blender tools <span class="badge">client</span></div>`
    + `<div class="meta">runs on each user's machine · ${blenderOn ? 'recommended to the fleet' : 'not recommended'}</div></span>`
    + `<span class="badges"><button class="${blenderOn ? 'stop' : 'start'}" data-ract="${blenderOn ? 'off' : 'on'}" data-id="blender">${blenderOn ? 'Un-recommend' : 'Recommend'}</button></span></div>`;

  // Connected desktop clients (heartbeat-driven; gone ≈30 s after a client closes).
  // "active" = input within the last minute on that machine, else how long it's idle.
  const clients = s.clients || [];
  const clientRows = clients.length ? clients.map((c) => {
    const active = c.idleSec != null && c.idleSec < 60;
    const meta = [c.ip, c.platform, c.version ? 'v' + c.version : '']
      .filter(Boolean).map(esc).join(' · ');
    const state = c.idleSec == null ? 'connected' : (active ? 'active now' : 'idle ' + dur(c.idleSec));
    return `<div class="row"><span class="dot${active ? ' served' : ''}"></span>`
      + `<span><div class="mname">${esc(c.name || c.ip || c.id)}</div>`
      + `<div class="meta">${meta}</div></span>`
      + `<span class="badges"><span class="badge${active ? ' on' : ''}">${esc(state)}</span></span></div>`;
  }).join('') : '<div class="empty">No clients connected right now (clients need app ≥ 0.1.23 to report presence).</div>';

  // Seats = the ENFORCED side (the gate in front of the proxy): who may
  // generate right now. Clients below stay the heartbeat view (who has the
  // app open). Old farms / gate off → cap.seats is null and the label falls
  // back to the advisory slot count.
  const met = cap.metrics;
  const capLabel = (Array.isArray(cap.seats)
    ? ` — ${cap.seats.length} of ${cap.slots} seat${cap.slots > 1 ? 's' : ''} in use`
    : (cap.slots != null ? ` — ${cap.clients} of ${cap.slots} slot${cap.slots > 1 ? 's' : ''} in use` : ''))
    + (met && met.lastHour.refused ? ` · ${met.lastHour.refused} generation${met.lastHour.refused === 1 ? '' : 's'} turned away in the last hour` : '');
  // Ollama started by somebody else = our concurrency/KV env never applied, so
  // the slot (and therefore seat) count is a wish, not a measurement. Say so
  // where the number is shown, with the exact line that makes it true. Ollama
  // only: an external server's seats are declared, which the Serving card says.
  const unverifiedRow = (cap.slotsVerified === false && be.engine === 'ollama')
    ? `<div class="row"><span class="dot"></span><span><div class="mname">Capacity is unverified</div>`
      + `<div class="meta">Ollama on ${esc((cap.unmanagedHosts || []).join(', ') || 'this box')} was already running when the farm started, `
      + `so the farm's concurrency and KV settings never reached it — the ${cap.slots} seat${cap.slots > 1 ? 's' : ''} above `
      + `${cap.slots > 1 ? 'are' : 'is'} what this farm is set to, not what the engine does. `
      + `Set <b>${esc(cap.ollamaEnvAdvice || '')}</b> on the Ollama service and restart it, or let the farm start Ollama itself.</div></span></div>`
    : '';
  const seatRows = Array.isArray(cap.seats)
    ? `<div class="meta" style="margin:4px 0 8px">${cap.seats.length
        ? 'Generation seats: ' + cap.seats.map((x) => esc(`${x.ip}${x.inFlight ? ' (generating)' : (x.idleSec != null ? ' (idle ' + dur(x.idleSec) + ')' : '')}`)).join(', ') + ' — '
        : 'No generation seats in use. '}A seat frees after ${Math.round((cap.seatIdleSec || 900) / 60)} min without generating; reading old chats never takes one.</div>`
    : '';
  // What people met at the gate: counts only, kept in the farm's memory, reset at restart.
  // The first-word times are bins, so "within" is the honest word.
  const secs = (ms) => (ms >= 120000 ? Math.round(ms / 60000) + ' min' : +(ms / 1000).toPrecision(2) + ' s');
  const when = (t) => new Date(t).toLocaleString([], Date.now() - t < 20 * 3600e3
    ? { hour: '2-digit', minute: '2-digit' } : { weekday: 'short', hour: '2-digit', minute: '2-digit' });
  const metParts = (x) => [
    `${x.admitted} generation${x.admitted === 1 ? '' : 's'} let in`,
    `${x.refused} turned away (all seats in use)`,
    x.unauthorized ? `${x.unauthorized} with a wrong password` : '',
    x.cancelled ? `${x.cancelled} stopped before the end (${x.cancelledBeforeFirstByte} before the first word)` : '',
    x.peakAt != null ? `fullest: ${x.peakSeats} of ${x.peakOf} seats at ${when(x.peakAt)}` : '',
    x.ttfbP50Ms != null ? `first word within ${secs(x.ttfbP50Ms)} for half, ${secs(x.ttfbP95Ms)} for 95%` : '',
  ].filter(Boolean).map(esc).join(' · ');
  const metricsRow = met
    ? `<div class="meta" style="margin:4px 0 8px"><b>Last hour:</b> ${metParts(met.lastHour)}.<br>`
      + `<b>Since the farm started (${esc(when(met.startedAt))}):</b> ${metParts(met.sinceStart)}.<br>`
      + `Counts only, kept in the farm's memory and never per person; they reset when the farm restarts.</div>`
    : '';

  // The 5 s rebuild replaces every element: what had the keyboard's focus (a section's summary, a button) gets it back.
  const refocus = focusKeyOf(document.activeElement);
  app.innerHTML =
    `<header class="top"><h1>lol <span class="lol">${esc(s.name || 'farm')}</span></h1>`
    + `<a class="plan" href="/lol/capacity" target="_blank" rel="noopener" title="Which hardware and model serve how many people, with ready-made scenarios and this farm marked">Plan capacity ↗</a></header>`
    + `<p class="sub">Changes apply to the running farm and are kept for the next start, except the Blender recommendation (this session only) and Ollama's people served at once (after a farm restart).</p>`
    + jobBar
    + presetsCard(s, jobRunning)
    + heroCard
    + sections
    + accessCard
    + storageCard(s, jobRunning)
    + `<div class="card"><h2>Plugins</h2>${pluginRows}${blenderRow}</div>`
    + `<div class="card"><details id="clients-d"${clientsOpen ? ' open' : ''}><summary><h2>Clients (${clients.length})${capLabel}</h2></summary>${seatRows}${metricsRow}${unverifiedRow}${clientRows}</details></div>`
    + `<div class="card"><h2>This box</h2><div class="health">${healthBits}</div></div>`;
  if (refocus) { const el = app.querySelector(refocus); if (el) el.focus({ preventScroll: true }); }

  app.querySelectorAll('button[data-act]').forEach((b) => { b.onclick = () => act(b.dataset.act, b.dataset.id, b); });
  app.querySelectorAll('button[data-dact]').forEach((b) => { b.onclick = () => defaultAct(b.dataset.id, b); });
  app.querySelectorAll('button[data-pact]').forEach((b) => { b.onclick = () => pluginAct(b.dataset.pact, b.dataset.id, b); });
  app.querySelectorAll('button[data-ract]').forEach((b) => { b.onclick = () => recommendAct(b.dataset.ract, b.dataset.id, b); });
  app.querySelectorAll('button[data-serve]').forEach((b) => { b.onclick = () => engineClick(s, b.dataset.serve, b); });
  wirePresets(s);
  // A person's click on a section's summary (a toggle the render itself caused matches data-open and is not one).
  app.querySelectorAll('details[data-eng]').forEach((d) => d.addEventListener('toggle', () => {
    if (d.open === (d.dataset.open === '1')) return;
    d.dataset.open = d.open ? '1' : '0';
    sectionToggled(d.dataset.eng, d.open);
  }));
  // Stop on either bar (the job, the download).
  app.querySelectorAll('button[data-cancel]').forEach((b) => { b.onclick = () => post('/lol/admin/job/cancel', { slot: b.dataset.cancel }, b, 'Stopping…'); });
  wireVllm(s);
  wireStorage(s);
  const lcServing = be.engine === 'llama.cpp';
  app.querySelectorAll('button[data-lcuse]').forEach((b) => { b.onclick = () => post('/lol/admin/llamacpp/model', { id: b.dataset.lcuse }, b, lcServing ? 'Loading the model…' : 'Downloading…'); });
  app.querySelectorAll('button[data-lcdel]').forEach((b) => { b.onclick = () => post('/lol/admin/llamacpp/library/remove', { id: b.dataset.lcdel }, b, 'Removed'); });
  // Inline rename editor. window.prompt() is NOT supported inside Electron (the
  // Farm app's window) — it throws, which read as "the button does nothing"
  // (owner report 2026-08-31). The name cell becomes an input with Save/Cancel.
  app.querySelectorAll('button[data-rn]').forEach((b) => {
    b.onclick = () => {
      const row = b.closest('.row');
      const cell = row && row.querySelector('.mname');

// Context presets. 262144 is the native max of the models we serve AND the farm's own
// server-side cap; the small end matters on a 12 GB card, where too large a window is
// how a farm ends up offloading to CPU and crawling.
// `fit` (when the farm can compute it) disables the sizes this GPU cannot hold —
// the alternative was learned the hard way: a 256k option picked on a 12 GB card
// "worked", overcommitted into system RAM, and served a few tokens a second.
// `cfg` is what the config SAYS (a number, or 'auto'); `resolved` is what actually
// serves right now. Automatic is the default and the recommended state: the farm
// re-computes the largest context that fits — min(model native max, VRAM budget) —
// at every model load, so a 12 GB box and a 96 GB box each get their own maximum.
// `fit` disables the numeric sizes this GPU cannot hold — learned the hard way:
// a 256k option picked on a 12 GB card "worked", overcommitted into system RAM,
// and served a few tokens a second.
function ctxOptions(cfg, resolved, fit, nativeMax) {
  // The list ADAPTS to the serving model (owner ask 2026-08-31): a 1M-native
  // model extends past the base presets by doubling and always offers its own
  // max as the top option; a 32k-native model stops at 32k instead of offering
  // windows it cannot read. No native known (probe pending) → the base list.
  const BASE = [4096, 8192, 16384, 32768, 65536, 131072, 262144];
  const top = nativeMax || 262144;
  const opts = BASE.filter((v) => v <= top);
  let dbl = 262144;
  while (dbl * 2 < top) { dbl *= 2; if (!opts.includes(dbl)) opts.push(dbl); }
  if (!opts.includes(top)) opts.push(top);
  const now = typeof cfg === 'number' ? cfg : null;
  const list = (now && !opts.includes(now)) ? [now, ...opts].sort((a, b) => a - b) : opts;
  const max = fit && fit.maxContext != null ? fit.maxContext : null;
  // Both engines size automatically now: llama.cpp from the GGUF's own geometry
  // (fit), Ollama by probing the real load once and caching the verdict — so
  // Automatic is always on the menu. fit === null (Ollama serving) just means the
  // numeric options can't be pre-disabled; the probe/pin protects the choice.
  const auto = `<option value="auto"${cfg === 'auto' ? ' selected' : ''}>Automatic — the most this ${fit == null ? 'box' : 'GPU'} holds${resolved ? ` (now ${fmtK(resolved)})` : ''}</option>`;
  // Oversized options are ADVERTISED as too much but stay selectable (owner call
  // 2026-08-28): the admin may deliberately trade speed for window. The apply
  // handler confirms before sending one of these.
  return auto + list.map((v) => {
    const over = max != null && v > max;
    const label = fmtK(v) + ' tokens'
      + (nativeMax && v === nativeMax ? ' — everything this model can read' : '')
      + (over ? ` — more than the ${fit.vramGb} GB free on this GPU holds (slows to a crawl)` : '');
    return `<option value="${v}"${v === now ? ' selected' : ''}${over ? ' data-over="1"' : ''}>${label}</option>`;
  }).join('');
}
function fmtK(n) {
  if (!n) return '—';
  if (n % 1048576 === 0) return (n / 1048576) + 'M';
  return n % 1024 === 0 ? (n / 1024) + 'k' : String(n);
}

// Slots against context (plan §13b): more people at once can mean less context each,
// and the clients change how they work below some sizes. The operator used to learn
// that after the restart; the line under the controls says it while they edit.
// The context each person gets, as snapshot.js backendInfo advertises it in
// backend.contextPerSlot (a farm test holds the two together): llama.cpp divides its
// window by its slots (with the shared pool, what a person keeps when every slot is
// busy); Ollama and an external server give every request the whole window.
function perPerson(engine, ctx, slots) {
  return engine === 'llama.cpp' ? Math.floor(ctx / Math.max(1, slots)) : ctx;
}
// What the clients do with that number, mirrored from the shell (a farm test reads its
// sources): configBridge.ts FULL_CONTEXT_MIN_CTX and RAG_TOP_K — Open WebUI reads whole
// documents at or above it and the best passages below, and each Open WebUI restarts
// when its farm crosses it. studio.ts agentWindow and agentMaxTokens — the coding agent
// plans for 256k at most, and "Keep going until done" asks for 16k replies but shrinks
// them to 3/4 of the window less 4k of headroom, never below a plain reply (8k for most
// coding models in projects/models.mjs), so the agent can still summarise its history.
const CLIENT = { fullDocs: 24576, topK: 8, agentMax: 262144, goalReply: 16384, headroom: 4096, plainReply: 8192 };
// `slots` and `ctx` (a number or 'auto') are the controls' values; left out = as configured.
function tradeLine(s, slots, ctx) {
  const be = s.backend || {}, lc = s.llamacpp || {}, ol = s.ollama || {};
  const isLc = be.engine === 'llama.cpp', ext = be.engine === 'external';
  const slots0 = be.engine === 'ollama' ? (ol.numParallel || be.slots) : be.slots;
  const ctx0 = ext ? be.contextLength : ((isLc ? lc.contextLength : ol.contextLength) ?? 'auto');
  if (slots == null) slots = slots0;
  if (ctx == null) ctx = ctx0;
  const edited = slots !== slots0 || ctx !== ctx0;
  // A number is exact. Automatic is sized when the engine starts, so the panel can
  // only quote what was measured last, and says so.
  let win = ctx === 'auto' ? null : ctx, note = '';
  if (ctx === 'auto' && isLc) {
    // The most the model reads or the GPU's free memory holds: the slots do not enter it.
    win = ctx0 === 'auto' ? lc.contextResolved : ((s.fit && s.fit.maxContext) || null);
    if (win == null) note = ' Automatic is sized at the restart, from the model and the GPU\'s free memory.';
    else if (edited) note = ' Automatic reads the GPU\'s free memory again at the restart, so this can come out a little different.';
  } else if (ctx === 'auto') {
    // Ollama keeps one verdict per number of people at once, measured on a daemon that runs
    // that many (up.js resolveOllamaContext), so a new number is sized at the farm restart.
    // Ollama holds people × window: more people can make the window smaller, fewer larger.
    const again = slots === slots0 ? '' : ` sized again for ${slots} at once when the farm restarts`;
    if (ctx0 !== 'auto') note = ` Automatic is measured when you apply, by loading the model a few times${again ? `, and${again}` : ''}.`;
    else {
      win = ol.contextResolved;
      if (again) note = ` Automatic is${again}, and can come out ${slots > slots0 ? 'smaller' : 'larger'}.`;
    }
  }
  if (win == null) {
    return `<div class="hint">How much context each person gets is not known yet.${note} `
      + `Below <b>${fmtK(CLIENT.fullDocs)}</b> each, Open WebUI reads the ${CLIENT.topK} most relevant passages of an attached document instead of all of it, `
      + `and every connected Open WebUI restarts once when that changes.</div>`;
  }
  const each = perPerson(be.engine, win, slots);
  const lead = `${edited ? 'After Apply, each' : 'Each'} person gets ${isLc && slots > 1 && be.kvUnified ? 'at least ' : ''}<b>${fmtK(each)}</b> of context`;
  const how = ext ? ', as that server was set up.'
    : !isLc ? ': Ollama gives every request the whole window.'
    : slots > 1 ? (be.kvUnified ? `: ${fmtK(win)} shared by ${slots}, all of it for a person alone.` : `: ${fmtK(win)} split across ${slots}.`)
    : '.';
  const { whole, docs, agent } = clientSay(each);
  // The clients' rule: a farm that does not say keeps whole documents.
  const wholeNow = be.contextPerSlot == null || be.contextPerSlot >= CLIENT.fullDocs;
  return `<div class="hint">${lead}${how}${note}<br>${docs}${agent}</div>`
    + (edited && whole !== wholeNow ? '<div class="warnline">Every connected Open WebUI restarts once to make that switch.</div>' : '');
}

// What the clients do with `each` tokens of context a person: Open WebUI's documents, the coding agent's replies.
function clientSay(each) {
  const whole = each >= CLIENT.fullDocs;
  const docs = whole ? 'Open WebUI reads attached documents whole.'
    : `Open WebUI reads the ${CLIENT.topK} most relevant passages of an attached document, not all of it (that needs ${fmtK(CLIENT.fullDocs)} each).`;
  // The coding agent: dsh is told min(each, 256k); "Keep going" replies as agentMaxTokens sizes them.
  // Both came after v0.2.7, and a farm meets older clients: v0.2.7 tells dsh the whole window and
  // asks 16k replies under Keep going on any window, so dsh's compaction trigger
  // min(0.8·W, W − reply − headroom) is never above 0 at 16k + 4k = 20k each or less.
  const w = Math.min(each, CLIENT.agentMax);
  const loop = Math.min(CLIENT.goalReply, Math.floor(w * 3 / 4) - CLIENT.headroom);
  const left = w - CLIENT.plainReply - CLIENT.headroom;   // what a plain reply leaves for the conversation
  const newer = 'In the coding agent (clients newer than v0.2.7), Keep going until done writes';
  const oldMin = CLIENT.goalReply + CLIENT.headroom;
  const old = each <= oldMin ? ` v0.2.7 and older still ask for ${fmtK(CLIENT.goalReply)} replies under Keep going, and at ${fmtK(oldMin)} each or less that leaves no room to summarise.` : '';
  const agent = each > CLIENT.agentMax ? ` The coding agent (clients newer than v0.2.7) uses ${fmtK(CLIENT.agentMax)} of it at most.`
    : loop >= CLIENT.goalReply ? ''
    : loop >= CLIENT.plainReply ? ` ${newer} replies of up to ${fmtK(loop)}, not ${fmtK(CLIENT.goalReply)}, so it can still summarise its history.${old}`
    : left > 0 ? ` ${newer} plain replies (${fmtK(CLIENT.plainReply)} for most models), which leave ${fmtK(left)} for the conversation before the agent has to summarise it.${old}`
    : ` The coding agent has no room to summarise its history (a reply, ${fmtK(CLIENT.plainReply)} for most models, and ${fmtK(CLIENT.headroom)} kept free fill the window), so a long task stops when the window is full.`;
  return { whole, docs, agent };
}

function presetReviewBlock(p, jobRunning) {

// ---- vLLM, run by the farm (docs/VLLM_MANAGED_PLAN.md §7) -------------------------------------------------------
const ENGINE_LABEL ={ ollama: 'Ollama', 'llama.cpp': 'llama.cpp', llamacpp: 'llama.cpp', vllm: 'vLLM', external: 'External server' };
const GIB = 2 ** 30;

// One bar: the job (slot 'job') or the download (slot 'download'). The numbers line under it says how far, how
// fast and how much longer; Stop when the farm can stop it halfway. A percentage alone left the operator asking
// "is this moving at all?" through a 30 GB pull (owner report 2026-09-10).
function barOf(x, slot) {
  if (!x) return '';
  const running = !x.done;
  const bits = [];
  if (running) {
    if (x.bytes != null && x.total) bits.push(`<b>${esc(sizeOf(x.bytes))}</b> of ${esc(sizeOf(x.total))}`);
    else if (x.bytes != null) bits.push(`<b>${esc(sizeOf(x.bytes))}</b> so far`);
    if (x.bytesPerSec) bits.push(esc(rateOf(x.bytesPerSec)));
    if (x.etaSec != null) bits.push(esc(etaOf(x.etaSec)));
    // Elapsed is the honest fallback while a phase reports no bytes at all (installing vLLM's libraries, reading
    // the model index, verifying) - it still proves time is passing. A vLLM download always shows it: its bytes are
    // the folder on disk, which Hugging Face's downloader fills in large pieces, late, so they can sit still for
    // minutes and then jump (the live test, 2026-10-08).
    if ((!bits.length || slot === 'download') && x.startedAt) bits.push('running for ' + esc(dur(Math.round((Date.now() - x.startedAt) / 1000))));
  }
  return `<div class="jobbar${x.done ? (x.ok ? ' done' : ' failed') : ''}">`
    + `<div class="jobtop"><b>${esc(x.label)}</b><span>${esc(x.done ? (x.ok ? (x.message || 'done') : (x.error || 'failed')) : x.message)}${running && x.percent != null ? ' · ' + x.percent + '%' : ''}`
    + `${x.cancellable ? ` <button class="stop" data-cancel="${slot}" style="min-width:0;margin-left:8px">Stop</button>` : ''}</span></div>`
    + (running
      ? `<div class="bar"><i style="width:${x.percent == null ? 100 : x.percent}%"${x.percent == null ? ' class="indet"' : ''}></i></div>`
        + (bits.length ? `<div class="jobmeta">${bits.join(' · ')}</div>` : '')
      : '')
    + '</div>';
}
