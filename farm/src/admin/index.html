// Open: what the person chose, else while its engine serves, or (vLLM) while it has something to say: the take-over
// offered or done, a start that failed while Ollama serves, an install or a download of its own running.
function secOpen(s, id) {
  if (typeof engOpen[id] === 'boolean') return engOpen[id];
  const be = s.backend || {}; const v = s.vllm || {}; const dl = s.download;
  if (SECTION_OF[be.engine] === id) return true;
  return id === 'vllm' && !!(v.takeOver || v.takenOver || (v.bootError && be.engine === 'ollama') || (dl && !dl.done && dl.kind !== 'move'));
}
// The engine that serves changed (a switch, a fallback): its section opens, whatever was chosen for it before.
function noteServing(id) {
  if (id === servingSeen) return;
  servingSeen = id;
  delete engOpen[id];
  saveOpen();
}
// A person opened or closed a section (its summary): kept across the 5 s rebuild and the next visit. Opening vLLM's
// checks this computer once per page (§7.1): what the vLLM button did before the sections.
function sectionToggled(id, open) {
  engOpen[id] = open;
  saveOpen();
  const v = (lastState && lastState.vllm) || {};
  if (id === 'vllm' && open && !vllmAutoChecked && v.supported !== false && !v.probe) { vllmAutoChecked = true; vllmCheck(); }
}
// Opened from the page itself (a look in a folder found models for it), brought into view.
function openSection(s, id) {
  engOpen[id] = true;
  saveOpen();
  render(s);
  const el = document.getElementById('eng-' + id);
  if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
}
// One section: its summary says the state and the one fact that matters without opening it (a real button for the
// keyboard and screen readers: <summary>), the body holds everything about the engine.
function section(s, id, body) {
  const sum = SUMMARY[id](s, SECTION_OF[(s.backend || {}).engine] === id);
  const open = secOpen(s, id);
  return `<div class="card"><details class="eng" id="eng-${id}" data-eng="${id}" data-open="${open ? '1' : '0'}"${open ? ' open' : ''}>`
    + `<summary><h2 class="ename">${ENGINE_LABEL[id]}</h2><span class="estate"><span class="dot${sum.tone ? ' ' + sum.tone : ''}" aria-hidden="true"></span>${esc(sum.state)}${sum.fact ? ` · ${esc(sum.fact)}` : ''}</span></summary>`
    + `<div class="ebody">${body}</div></details></div>`;
}
// "Serve with …", at the end of every section but the serving one's: the switch, with the question it always asked.
// The line says what it costs (the question without its "Switch to …?"), or why it cannot go ahead.
function serveRow(s, id, jobRunning) {
  const v = s.vllm || {};
  let why = '';
  if (id === 'llamacpp') {
    if (s.llamacppAvailable === false) why = 'Not available on this computer: there is no ready-made llama.cpp for it.';
    else if (!lcChosen(s)) why = 'Choose a model above first.';
  }
  if (id === 'vllm') {
    if (v.takeOver) return '';   // the offer above is the way: the farm runs the vLLM already here, nothing restarted
    if (v.supported === false) why = 'Not available on this computer: vLLM needs an NVIDIA GPU on Linux, or Windows with WSL.';
    else if (!vllmUsable(v)) why = v.probe ? 'Not set up on this computer yet: the list above says what is missing.' : 'This computer is checked first: the list above says what it has.';
  }
  const cost = switchConfirm(s, id).replace(/^Switch to [^?]*\? /, '');
  return `<div class="row"><span></span><span><div class="mname">Serve with ${ENGINE_LABEL[id]}</div><div class="meta">${esc(why || cost)}</div></span>`
    + `<span class="badges"><button class="start" data-serve="${id}"${jobRunning || why ? ' disabled' : ''}>Serve with ${ENGINE_LABEL[id]}</button></span></div>`;
}
// The summaries: { state, tone (the dot: served = green, busy = amber, bad = red, none = grey), fact }.
const VLLM_STATE = { ready: 'serving', starting: 'starting', restarting: 'starting', stopping: 'stopping', stopped: 'stopped', guard: 'stopped', down: 'not answering' };
const SUMMARY = {
  ollama(s, serving) {
    const models = s.models || [];
    const def = models.find((m) => m.isDefault);
    return { state: serving ? 'serving' : 'standby', tone: serving ? 'served' : '',
      fact: models.length ? `${models.length} model${models.length === 1 ? '' : 's'}${def ? ` · ${def.id} default` : ''}` : 'no models on this computer' };
  },
  llamacpp(s, serving) {
    const c = lcChosen(s);
    if (serving) return { state: 'serving', tone: 'served', fact: c ? c.label : (s.backend || {}).model };
    if (s.llamacppAvailable === false) return { state: 'cannot run on this computer', tone: '', fact: '' };
    if (s.llamacppBootError) return { state: 'could not start', tone: 'bad', fact: 'the farm serves with Ollama for now' };
    return { state: 'standby', tone: '', fact: c ? `${c.label} chosen${c.downloaded ? '' : ', to download'}` : 'no model chosen' };
  },
  vllm(s, serving) {
    const v = s.vllm || {}; const be = s.backend || {};
    const chosen = (v.library || []).find((e) => e.active);
    if (serving) {
      const state = VLLM_STATE[v.phase] || 'serving';
      return { state, tone: state === 'serving' ? 'served' : ['starting', 'stopping'].includes(state) ? 'busy' : 'bad',
        fact: `${chosen ? chosen.label : be.model || ''} · ${be.slots} at ${fmtK(be.contextLength)}` };
    }
    if (v.supported === false) return { state: 'cannot run on this computer', tone: '', fact: 'it needs an NVIDIA GPU on Linux, or Windows with WSL' };
    if (v.takeOver) return { state: 'already running on this computer', tone: '', fact: 'the farm can run it, as it runs now' };
    // A GPU no model of the list fits (an RTX 4070 or 4080), said before any check: never an offer to set it up.
    const fit = v.hostFit;
    if ((v.probe && v.probe.gpuTooSmall) || (fit && !fit.fits)) {
      return { state: 'not for this GPU', tone: '', fact: `${fit && !fit.fits ? `${fit.gb} GB; vLLM's models need about ${fit.needGb} GB: ` : ''}llama.cpp or Ollama is the engine for it` };
    }
    if (!v.probe && v.noNvidia) return { state: 'no NVIDIA GPU found', tone: '', fact: 'open to check this computer' };
    // A start that failed, or a vLLM that stopped working while it served (twice in 5 minutes): each says its own.
    if (v.bootError && be.engine === 'ollama') return { state: /^vLLM stopped working/.test(v.bootError) ? 'stopped working' : 'could not start', tone: 'bad', fact: 'the farm serves with Ollama for now' };
    if (!v.probe) return { state: 'standby', tone: '', fact: 'open to check this computer' };
    if (v.probe.problems.length) return { state: v.installed ? 'not set up yet' : 'not installed', tone: '', fact: chosen ? `${chosen.label} chosen` : '' };
    return { state: 'standby', tone: '', fact: chosen ? `${chosen.label} chosen · about 2 minutes to start` : 'about 2 minutes to start' };
  },
  external(s, serving) {
    const be = s.backend || {};
    return { state: serving ? 'serving' : 'standby', tone: serving ? 'served' : '', fact: serving ? `at ${be.baseUrl || ''}` : 'a server this farm does not run' };
  },
};
// What has the keyboard's focus, as a selector that finds it again after the rebuild (null: nothing to give back).
function focusKeyOf(a) {
  if (!a || typeof app.contains !== 'function' || !app.contains(a)) return null;
  if (a.id) return '#' + CSS.escape(a.id);
  if (a.tagName === 'SUMMARY' && a.parentElement && a.parentElement.id) return '#' + CSS.escape(a.parentElement.id) + ' > summary';
  const data = a.tagName === 'BUTTON' && [...a.attributes].find((x) => x.name.startsWith('data-'));
  return data ? `button[${data.name}="${CSS.escape(data.value)}"]` : null;
}

const isLoopback = (url) => /^https?:\/\/(127\.|localhost[:/]|\[::1\])/i.test(String(url || ''));
// What a switch costs, said before it happens (§7.1).
function switchConfirm(s, to) {
  const be = s.backend || {}; const name = ENGINE_LABEL[to] || to;
  if (be.engine === 'vllm') return `Switch to ${name}? vLLM stops and ${name} loads its model: about a minute, and anyone connected waits.`;
  const lc = to === 'llamacpp' ? lcChosen(s) : null;
  const cost = to === 'vllm' ? 'Chat stops for about 2 minutes while vLLM loads the model (longer the very first time, while it prepares the GPU).'
    : lc ? `llama.cpp loads ${lc.label}${lc.downloaded ? ': about a minute' : `, which it downloads first${lc.sizeGb ? ` (${lc.sizeGb} GB)` : ''}: longer than a minute`}, and anyone connected waits.`
    : `${name} loads its model: about a minute, and anyone connected waits.`;
  // A server on this computer the farm does not run keeps its share of the GPU after the switch (§1.2); when it is a
  // vLLM the farm can run as it is, the way to keep it serving is said too.
  if (be.engine === 'external' && isLoopback(be.baseUrl)) {
    const g = (s.health && s.health.gpu) || {};
    const free = g.vramTotalGb != null && g.vramUsedGb != null ? Math.round((g.vramTotalGb - g.vramUsedGb) * 10) / 10 : null;
    return `Switch to ${name}? ${cost} The server at ${be.baseUrl} keeps running and keeps its share of the GPU: ${name} gets only what is left${free != null ? ` (${free} GB free now)` : ''}.`
      + (s.vllm && s.vllm.takeOver ? ' To keep it serving as this farm\'s own vLLM instead, press Let the farm run vLLM.' : '');
  }
  return `Switch to ${name}? ${cost}`;
}
// A press on Serve with … (§7.1).
function engineClick(s, to, b) {
  // The vLLM the farm routes to runs on this computer and can be kept as the farm's own (§9): that is what vLLM
  // means then, with nothing restarted, not a stop and a 2-minute start of the same thing.
  if (to === 'vllm' && s.vllm && s.vllm.takeOver) {
    if (confirm(takeOverConfirm(s.vllm.takeOver))) post('/lol/admin/vllm/take-over', {}, b, 'The farm runs vLLM now.');
    return;
  }
  // vLLM not set up here yet: its section, which checks this computer, never a switch (§7.1).
  if (to === 'vllm' && !vllmUsable(s.vllm)) { openSection(s, 'vllm'); return; }
  // A switch stops one engine and loads another: downtime for everyone connected, said first.
  if (!confirm(switchConfirm(s, to))) return;
  post('/lol/admin/backend', { engine: to }, b, 'Switching…');
}
// "Let the farm run vLLM" (§9.2), from its section or from Serve with vLLM: what it does, before it does it.
function takeOverConfirm(t) {
  return (t.running
    ? 'Let the farm run the vLLM already on this computer? It keeps the same model, name and settings and keeps running: nobody is interrupted.'
    : 'Let the farm run the vLLM on this computer? It keeps the same model, name and settings and starts it now: about 2 minutes, during which nobody can chat.')
    + (t.platform === 'linux' ? ` ${LINUX_BOOT}` : '');
}
// Linux (a DGX Spark): the service that started vLLM at boot starts nothing after a take-over, and the Farm app starts
// at a desktop log-in only. A box that starts with no one logging in to its desktop must hear it before the click.
const LINUX_BOOT = 'From then on vLLM starts when the farm starts, not by itself at boot: with the Farm app, that is when someone logs in to the desktop of this computer (Launch at login, in its settings).';

// The line under the Serving title: where vLLM is in its life (§1.5, §7.1).
function vllmStatusLine(s) {
  const v = s.vllm || {}; const be = s.backend || {};
  if (be.engine !== 'vllm') {
    if (!v.bootError || be.engine !== 'ollama') return '';
    // A start that failed, or a vLLM that stopped working while it served (twice in 5 minutes): each says its own.
    const why = String(v.bootError).replace(/^vLLM could not start:\s*/, '').replace(/[.\s]+$/, '');
    const what = /^vLLM stopped working/.test(why) ? why : `vLLM could not start: ${why}`;
    // Its log says more only when vLLM ran; a start that stopped at the check (or a boot) has the checklist's words.
    const more = v.bootErrorRan ? " (vLLM's log below says more)" : (v.probe && (v.probe.problems || []).length ? ' (the checklist in the vLLM section below says what is missing)' : '');
    return `<div class="warnline">${esc(what)}. The farm serves with Ollama for now. Fix the cause${more}, then switch back to vLLM.</div>`;
  }
  const hint = (t) => `<div class="hint">${t}</div>`;
  const warn = (t) => `<div class="warnline">${t}</div>`;
  // What clients show while the farm says it is busy: the job's own label (a start, a switch, an Apply).
  const job = s.job && !s.job.done && s.job.label ? s.job.label : 'Starting vLLM';
  switch (v.phase) {
    case 'starting':
      return hint(`vLLM is starting: ${esc(v.phaseText || 'starting vLLM')}. About 2 minutes, longer the first time. Until it is ready, people connected see “${esc(job)}”, and a message sent meanwhile is answered that the model is starting, to try again in about 2 minutes.`);
    case 'restarting':
      return warn(`vLLM stopped unexpectedly and is starting again: ${esc(v.phaseText || 'starting vLLM')}. About 2 minutes. Until it is ready nobody can chat here: people connected see a problem on this farm and may move to another one, and a message sent meanwhile is answered to try again later.`);
    case 'stopping': return hint('vLLM is stopping.');
    case 'stopped': return warn(esc(v.phaseText || 'vLLM is stopped, so nobody can chat. Press Start vLLM below, or switch to another engine.'));
    case 'guard': return warn(esc(v.phaseText || 'vLLM was stopped because this computer was running out of memory. Close what is using the memory, then press Start vLLM.'));
    case 'down': return warn('vLLM is not answering. The farm is checking it.');
    case 'ready': return v.adopted ? hint('vLLM was already running with these settings, so the farm kept it running.') : '';
    default: return '';
  }
}

// People at once (§7.1): Automatic says where its number comes from.
function vllmSlotsRow(v) {
  const cur = v.parallel;
  const opts = [1, 2, 4, 8, 12, 16, 24, 32, 48, 64, 96, 128];
  if (typeof cur === 'number' && !opts.includes(cur)) { opts.push(cur); opts.sort((a, b) => a - b); }
  const a = v.seatsAuto;
  const auto = !a ? 'Automatic'
    : a.source === 'measured' ? `Automatic — ${a.seats}, measured on this card`
    : a.source === 'memory' ? `Automatic — ${a.seats}, what the memory holds`
    : 'Automatic — 4 to start with';
  return `<div class="row"><span></span><span><div class="mname">People served at once</div>`
    + `<div class="meta">people who can write to the model at the same time. They share the GPU, so each reply slows as more write at once; past this number a new message waits for a free seat.</div></span>`
    + `<span class="badges"><select id="slots-sel" data-orig="${esc(String(cur))}">`
    + `<option value="auto"${cur === 'auto' ? ' selected' : ''}>${esc(auto)}</option>`
    + opts.map((n) => `<option value="${n}"${n === cur ? ' selected' : ''}>${n}</option>`).join('')
    + `</select></span></div>`;
}

// Context per person: 8k to 256k, and the model's own maximum, never past what it reads.
function vllmCtxRow(v) {
  const native = (v.facts && v.facts.nativeCtx) || null;
  const list = [8192, 16384, 32768, 65536, 131072, 262144].filter((n) => !native || n <= native);
  if (native && !list.includes(native)) list.push(native);
  if (v.contextLength && !list.includes(v.contextLength)) list.push(v.contextLength);
  list.sort((a, b) => a - b);
  return `<div class="row"><span></span><span><div class="mname">Context per person</div>`
    + `<div class="meta">the longest conversation or document one person can use. A longer context means fewer people fit in the GPU's memory.</div></span>`
    + `<span class="badges"><select id="ctx-sel" data-orig="${esc(String(v.contextLength))}">`
    + list.map((n) => `<option value="${n}"${n === v.contextLength ? ' selected' : ''}>${fmtK(n)} tokens${native && n === native ? ' — everything this model can read' : ''}</option>`).join('')
    + `</select></span></div>`;
}

// GPU memory for conversations: Automatic says what it is made of, and how much that is now.
function vllmKvRow(v) {
  const cur = v.kvCacheGib;
  const opts = [16, 24, 32, 40, 50, 60, 70, 80].filter((g) => !v.cardGib || g < v.cardGib);
  if (typeof cur === 'number' && !opts.includes(cur)) { opts.push(cur); opts.sort((a, b) => a - b); }
  const auto = `Automatic — ${v.unified ? 'from what the computer has free' : 'what the GPU has free'}, less the model`
    + `${v.ocrReserveGib ? `, ${v.ocrReserveGib} GB for document reading` : ''}${v.embedReserveGib ? `, ${v.embedReserveGib} GB for document search` : ''} and a safety margin`
    + `${v.unified && v.minFreeGb ? `, keeping ${v.minFreeGb} GB so it cannot run out` : ''}`
    + `${v.autoKvGib != null ? ` (now ${v.autoKvGib} GB)` : ''}`;
  return `<div class="row"><span></span><span><div class="mname">GPU memory for conversations</div>`
    + `<div class="meta">memory vLLM keeps for everyone's conversations. Automatic is worked out again at each start.</div></span>`
    + `<span class="badges"><select id="kv-sel" data-orig="${esc(String(cur))}">`
    + `<option value="auto"${cur === 'auto' ? ' selected' : ''}>${esc(auto)}</option>`
    + opts.map((g) => `<option value="${g}"${g === cur ? ' selected' : ''}>${g} GB</option>`).join('')
    + `</select></span></div>`;
}

// What was measured on this card with this model, at the context asked or the nearest measured one above it.
function measuredAt(m, ctx) {
  if (!m || !m.at) return null;
  const key = Object.keys(m.at).map(Number).sort((a, b) => a - b).find((c) => c >= ctx);
  return key && m.at[key] && m.at[key].every ? { ctx: key, every: m.at[key].every, steady: m.at[key].steady } : null;
}
// A measured label as a number of people: "48" → 48, "≥ 64" → 64, "< 8" → 4 (as vllm.js reads it).
function labelSeats(label) {
  const m = /^(≥|<)?\s*(\d+)$/.exec(String(label == null ? '' : label).trim());
  if (!m) return null;
  return m[1] === '<' ? Math.max(1, Math.floor(Number(m[2]) / 2)) : Math.max(1, Number(m[2]));
}

// The trade line on vLLM (§7.1): the context each person gets, how many whole conversations the memory holds,
// what was measured on this card, then what the clients do with it. `slots`, `ctx`, `kv` = the controls' values
// (left out = as configured).
function vllmTrade(s, slots, ctx, kv) {
  const v = s.vllm || {}; const be = s.backend || {};
  if (slots == null) slots = v.parallel;
  if (ctx == null) ctx = v.contextLength;
  if (kv == null) kv = v.kvCacheGib;
  const edited = slots !== v.parallel || ctx !== v.contextLength || kv !== v.kvCacheGib;
  // The memory: a set amount, else what vLLM runs with (Automatic is not worked out again while it runs), else
  // what the last check of this computer worked out.
  const pool = kv === 'auto' ? (v.phase === 'ready' && v.kvResolvedGib != null ? v.kvResolvedGib : v.autoKvGib) : kv;
  const f = v.facts || {};
  const person = f.kvBytesPerToken ? ctx * f.kvBytesPerToken + (f.stateBytes || 0) : null;
  // vLLM's own figure once it runs as configured; otherwise worked out from the model's memory per person.
  const fit = !edited && v.peopleFit != null ? v.peopleFit : (person && pool != null ? Math.floor(pool * GIB / person) : null);
  const meas = measuredAt(v.measured, ctx);
  const plan = '<a class="plan" href="/lol/capacity" target="_blank" rel="noopener">Plan capacity ↗</a>';
  const { whole, docs, agent } = clientSay(ctx);
  const lines = [
    `${edited ? 'After Apply, each' : 'Each'} person gets <b>${fmtK(ctx)}</b> of context.`,
    fit != null ? ` The memory for conversations holds <b>${fit}</b> people at that size.` : '',
    meas ? ` Measured on this card with this model: ${esc(meas.every)} at ${fmtK(meas.ctx)} when everyone writes at once${meas.steady ? `, ${esc(meas.steady)} in normal use` : ''}.`
      : ` Not measured on this card with this model: start with fewer people and watch Performance, below. ${plan} estimates it.`,
  ].join('');
  // Automatic never goes past what was measured or what the memory holds; a set number can.
  const n = slots === 'auto' ? null : slots;
  const warns = [];
  const measN = meas ? labelSeats(meas.every) : null;
  if (n != null && measN != null && n > measN) warns.push('More people than measured on this card: when everyone writes at once, replies may slow below a comfortable reading speed.');
  if (n != null && fit != null && n > fit) warns.push(`The memory holds only ${fit} people at ${fmtK(ctx)}: past that, vLLM makes people wait. Lower the people or the context, or give it more memory.`);
  const wholeNow = be.contextPerSlot == null || be.contextPerSlot >= CLIENT.fullDocs;
  if (edited && whole !== wholeNow) warns.push('Every connected Open WebUI restarts once to make that switch.');
  return `<div class="hint">${lines}<br>${docs}${agent}</div>` + warns.map((w) => `<div class="warnline">${w}</div>`).join('');
}

// The model a switch to llama.cpp serves: the library entry of llamacpp.model, else one made from its link.
function lcChosen(s) {
  const lc = s.llamacpp || {};
  if (!lc.model) return null;
  return (lc.library || []).find((e) => (e.url || e.path) === lc.model) || { label: String(lc.model).split(/[\\/]/).pop(), url: lc.model, downloaded: false };
}

// The llama.cpp section: the library, Add, and, while llama.cpp serves, its people and context and Performance. Before a
// switch, Use this CHOOSES the model the switch will serve (and downloads it now, as the job); the engine that serves
// keeps serving until Serve with llama.cpp (owner, 2026-10-09).
function llamacppSection(s, jobRunning, capacity, perfBlock) {
  const lc = s.llamacpp || {}; const be = s.backend || {};
  const serving = be.engine === 'llama.cpp';
  const now = ENGINE_LABEL[be.engine] || 'Ollama';
  const off = jobRunning ? ' disabled' : '';
  const out = ['<div class="hint">One model, fastest. Quantised KV cache; speculative decoding (MTP) on quants that keep their MTP head.'
    + (serving || s.llamacppAvailable === false ? ''
      : ` Choose here the model it will serve: <b>Use this</b> downloads it now, and ${esc(now)} keeps serving meanwhile. Nothing changes for the people connected until you press <b>Serve with llama.cpp</b>.`)
    + '</div>'];
  if (s.llamacppAvailable === false) out.push('<div class="warnline">Not available on this computer: there is no ready-made llama.cpp for it.</div>');
  out.push((lc.library || []).map((e) => {
    const active = (e.url || e.path) === lc.model;   // a link, or a file used where it is
    const meta = [e.sizeGb ? e.sizeGb + ' GB' : '', e.mtp ? 'has MTP head' : '', e.note].filter(Boolean).join(' · ');
    const badges = (active ? `<span class="badge on">${serving ? 'serving' : 'chosen'}</span>` : '')
      + (!serving && e.downloaded ? '<span class="badge">downloaded</span>' : '');
    // Before a switch, the chosen model not on this computer yet gets Download (the same request downloads it). A file
    // used where it is (by path) has nothing to download: when it is gone, the line says so.
    const use = !active ? `<button class="start" data-lcuse="${esc(e.id)}"${off}>Use this</button>`
      : !serving && !e.downloaded && e.url ? `<button class="start" data-lcuse="${esc(e.id)}"${off}>Download</button>` : '';
    const gone = e.path && !e.downloaded ? `<div class="warnline">Not found at ${esc(e.path)}: was the file moved or its drive unplugged?</div>` : '';
    return `<div class="row"><span class="dot${active && serving ? ' served' : ''}"></span>`
      + `<span><div class="mname">${esc(e.label)}</div>`
      + `<div class="meta">${esc(meta)}</div>${gone}</span>`
      + `<span class="badges">${badges}${use}`
      + (active ? '' : `<button class="stop" data-lcdel="${esc(e.id)}"${off}>Remove</button>`)
      + '</span></div>';
  }).join('') || '<div class="empty">No models in the library.</div>');
  out.push(scanRows('gguf', s, jobRunning));
  out.push('<div class="row"><span></span><span><div class="mname">Add a model</div>'
    + '<div class="meta">paste the link to a .gguf file — on HuggingFace, the file\'s <b>download</b> link (…/resolve/main/….gguf). Split models (…-00001-of-00003.gguf) work too: paste any part, all parts are fetched. Or the whole path of a .gguf already on this computer (F:\\models\\….gguf): it is used where it is, nothing is copied.</div></span>'
    + '<span class="badges"><input id="lc-url" type="text" placeholder="https://huggingface.co/…/model.gguf" spellcheck="false" />'

    ? '<div class="hint">Adding only remembers it. Press <b>Use this</b> to download and serve it — that can take a while on a first use.</div>'
    : '<div class="hint">Adding only remembers it. Press <b>Use this</b> to download it and make it the one llama.cpp will serve.</div>');

}

// The vLLM section (§7.2): the take-over offer, what this computer has and lacks, Install, the model list, while vLLM
// serves its people, context and memory and its own controls (Stop, Start), WSL's disk, the log, and Performance.
function vllmSection(s, jobRunning, capacity, perfBlock) {
  const v = s.vllm || {}; const be = s.backend || {};
  const dl = s.download && !s.download.done ? s.download : null;
  const isV = be.engine === 'vllm';
  const off = (blocked) => (blocked ? ' disabled' : '');
  const out = [takeOverBlock(s, jobRunning),
    `<div class="hint">vLLM is an engine made for serving many people at once on a big NVIDIA GPU. On Windows it runs inside WSL, the Linux that comes with Windows. The farm installs it, starts it and stops it.</div>`];
  // The checklist: what is in place (muted), what blocks it (✗), what is said without blocking (⚠).
  if (v.supported === false) out.push(`<div class="warnline">✗ Not available on this computer: vLLM needs an NVIDIA GPU on Linux, or Windows with WSL.</div>`);
  else if (!v.probe) out.push(`<div class="meta">Checking this computer… (up to a minute while WSL wakes up)</div>`);
  else {
    for (const t of v.probe.oks || []) out.push(`<div class="meta">✓ ${esc(t)}</div>`);
    for (const t of v.probe.problems || []) {
      const stop = /started earlier is still running/.test(t) ? ` <button class="stop" data-cancel="download" style="min-width:0"${off(!!dl)}>Stop it</button>` : '';
      out.push(`<div class="warnline">✗ ${esc(t)}${stop}</div>`);
    }
    for (const t of v.probe.warnings || []) {
      const upd = /this farm was tested with|cannot read sound yet/.test(t) && v.installed ? ` <button class="start" data-vinstall style="min-width:0"${off(!!dl)}>Update vLLM</button>` : '';
      out.push(`<div class="warnline">⚠ ${esc(t)}${upd}</div>`);
    }
  }
  if (v.supported !== false) {
    out.push(`<div class="row"><span></span><span><div class="meta">${v.probe ? `Checked at ${esc(new Date(v.probe.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }))}.` : ''}</div></span>`
      + `<span class="badges"><button data-vcheck${off(vllmChecking)}>Check again</button></span></div>`);
  }
  // Install: once the check sees a GPU vLLM can use, and vLLM is not there yet.
  const chosen = (v.library || []).find((e) => e.active) || null;
  if (v.installable && !v.installed && !v.venvLink) {
    const where = `into ${esc(v.distro || v.root || 'this computer')}${v.distro && v.root ? `, in ${esc(v.root)}` : ''}`;
    const model = chosen && chosen.repo && !chosen.downloaded ? ` and ${esc(chosen.label)}${chosen.sizeGb ? ` (${chosen.sizeGb} GB)` : ''}` : '';
    out.push(`<div class="row"><span></span><span><div class="mname">Install vLLM</div>`
      + `<div class="meta">Downloads vLLM ${esc(v.pinned || '')} (about 8 GB)${model} ${where}. About 45 minutes on a typical connection. The farm keeps serving while it downloads; a stopped download keeps the files it finished.</div></span>`
      + `<span class="badges"><button class="start" data-vinstall${off(!!dl)}>Install vLLM</button></span></div>`);
  }
  // The model list.
  for (const e of v.library || []) {
    const downloading = !!(dl && dl.about === e.id);
    const badges = [
      e.active ? `<span class="badge on">${isV ? 'serving' : 'chosen'}</span>` : '',
      downloading ? '<span class="badge">downloading</span>' : e.downloaded ? '<span class="badge">downloaded</span>' : e.partial ? '<span class="badge">partly downloaded</span>' : '',
    ].join('');
    const size = e.sizeGb || e.gbOnDisk;
    const meta = [size ? `${size} GB` : '', e.note].filter(Boolean).join(' · ');
    // A folder used where it is (by path) is the operator's own: Remove never offers to delete it.
    const files = !e.path && (e.downloaded || e.partial) ? (e.gbOnDisk || e.sizeGb || 0) : 0;
    const btns = [
      // A download uses vLLM's own tools: only once vLLM is installed (Install downloads the chosen model with it).
      !e.downloaded && e.repo && !downloading && v.installed ? `<button class="start" data-vdl="${esc(e.id)}"${off(!!dl)}>Download</button>` : '',
      e.downloaded && !e.active ? `<button class="start" data-vuse="${esc(e.id)}" data-label="${esc(e.label)}"${off(jobRunning)}>Use this</button>` : '',
      !e.active && !downloading ? `<button class="stop" data-vrm="${esc(e.id)}" data-label="${esc(e.label)}" data-files="${files}"${off(jobRunning)}>Remove</button>` : '',
    ].join('');
    out.push(`<div class="row"><span class="dot${e.active && isV ? ' served' : ''}"></span>`
      + `<span><div class="mname">${esc(e.label)}</div>${meta ? `<div class="meta">${esc(meta)}</div>` : ''}`
      + (e.generic ? `<div class="meta">Not one of the measured models: answers work, but tools and thinking may not show until a developer adds its settings.</div>` : '')
      + `</span><span class="badges">${badges}${btns}</span></div>`);
  }
  for (const f of v.foundFolders || []) {
    out.push(`<div class="row"><span></span><span><div class="meta">Also on this computer: ${esc(f.folder)}${f.gb != null ? ` (${f.gb} GB)` : ''}</div></span>`
      + `<span class="badges"><button data-vfolder="${esc(f.folder)}">Add to the list</button></span></div>`);
  }
  out.push(scanRows('vllm', s, jobRunning));
  out.push(`<div class="row"><span></span><span><div class="mname">Add a model</div>`
    + `<div class="meta">the name of a model on Hugging Face (owner/name), made for vLLM. Adding only remembers it: press Download, then Use this.</div></span>`
    + `<span class="badges"><input id="vllm-repo" type="text" placeholder="nvidia/Qwen3.6-35B-A3B-NVFP4" spellcheck="false" /><button id="vllm-add">Add</button></span></div>`);
  // While it is the engine: its people, context and memory, then its own controls, Stop and Start (a start in progress
  // stops from its bar).
  if (isV) {
    out.push(capacity);
    const canStop = ['ready', 'down'].includes(v.phase);
    const canStart = !['ready', 'down', 'starting', 'restarting', 'stopping'].includes(v.phase);
    out.push(`<div class="row"><span class="dot${v.phase === 'ready' ? ' served' : ''}"></span><span><div class="mname">Run vLLM</div>`
      + `<div class="meta">${canStop ? `Running, from ${esc(v.root || 'its folder')}.` : canStart ? 'Not running.' : 'Busy: the bar at the top of the page shows how far it is.'}</div></span>`
      + `<span class="badges">`
      + (canStop ? `<button class="stop" data-vstop${off(jobRunning)}>Stop vLLM</button>` : '')
      + (canStart ? `<button class="start" data-vstart${off(jobRunning)}>Start vLLM</button>` : '')
      + `</span></div>`);
  }
  out.push(wslDiskRow(v, jobRunning, !!dl));
  out.push(`<div class="row"><span></span><span><div class="mname">vLLM's log</div>`
    + `<div class="meta">vLLM's own log, for when something goes wrong. It does not record conversations, but an error line can quote a few words of a reply.</div></span>`
    + `<span class="badges">`
    + `<button data-vlog>${vllmLogLines ? 'Refresh' : 'Show the log'}</button>`
    + (vllmLogLines ? '<button data-vloghide>Hide</button>' : '')
    + `</span></div>`);
  if (vllmLogLines) {
    out.push(`<pre style="max-height:320px;overflow:auto;font-size:11.5px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;white-space:pre-wrap">${esc(vllmLogLines.join('\n') || '(empty)')}</pre>`);
  }
  out.push(isV ? perfBlock : serveRow(s, 'vllm', jobRunning));
  return out.join('');
}

// ---- Model storage (owner, 2026-10-12: "point to a folder and say everything goes here, or look in this folder to

const STORE_BY = { farm: 'run by the farm', other: 'run by the Ollama app or a service' };

  } else if (mv) {

    out.push(mv.switched
      ? `<div class="warnline">The farm runs from ${esc(mv.to)}. Old copies are still to delete: ${esc(left || 'none')}.${mv.ollamaStep ? ' Ollama first needs its folder changed (below).' : ''}</div>`

    if (step) out.push(`<div class="hint">${esc(ollamaStep(st.platform, step))}${st.platform === 'linux' ? '' : ' Or press Finish: when the farm can, it sets that itself (it quits the Ollama app and opens it again).'}</div>`);
    out.push(`<div class="row"><span></span><span></span><span class="badges">`
      + (mv.switched ? `<button class="start" data-stfinish${off(dlBusy)}>Finish</button>`
        : `<button class="start" data-stmove${off(dlBusy || jobRunning)}>Move here</button>`)
      + `<button data-stforget${off(dlBusy)}>Forget it</button>`
      + '</span></div>');

    + `<div class="meta">Move here copies what is in the folders above into this folder, checks every copy, switches, and only then deletes the old copies. The farm keeps serving while it copies; at the switch, what uses the files stops for about a minute.</div></span>`
    + `<span class="badges"><input id="st-dir" type="text" spellcheck="false" placeholder="${st.platform === 'win32' ? 'F:\\LlmOnLan models' : '/data/llmonlan'}" value="${esc(dir)}" />${browseBtn('st-dir')}`
    + `<button class="start" data-stmove${off(dlBusy || !!(mv && mv.switched))}>Move here</button></span></div>`);
  if (st.dir && st.slow) out.push(`<div class="warnline">⚠ ${esc(st.slow)}</div>`);
  if (st.dir && st.freeBytes != null) out.push(`<div class="meta">${esc(gbText(st.freeBytes / 1e9))} free on that drive.</div>`);
  out.push(`<div class="row"><span></span><span><div class="mname">Use the models in this folder</div>`
    + `<div class="meta">Looks for .gguf files (llama.cpp), Hugging Face model folders (vLLM) and an Ollama model folder. You pick what to add; it is used where it is, nothing is copied.${st.platform === 'win32' ? ' A folder of WSL\'s Linux starts with / (like /home/me/models).' : ''}</div></span>`
    + `<span class="badges"><input id="st-scan" type="text" spellcheck="false" placeholder="${st.platform === 'win32' ? 'D:\\models' : '/data/models'}" value="${esc(stScanDir)}" />${browseBtn('st-scan')}<button data-stscan>Look</button></span></div>`);
  if (scanResult) {
    const f = scanResult.found || {};
    const parts = [
      f.gguf && f.gguf.length ? `${f.gguf.length} .gguf model${f.gguf.length === 1 ? '' : 's'} (in the llama.cpp section)` : '',
      f.vllm && f.vllm.length ? `${f.vllm.length} model folder${f.vllm.length === 1 ? '' : 's'} for vLLM (in the vLLM section)` : '',
      f.ollama && f.ollama.length ? `${f.ollama.length === 1 ? 'an Ollama model folder' : `${f.ollama.length} Ollama model folders`} (in the Ollama section)` : '',
    ].filter(Boolean);
    out.push(`<div class="hint">${parts.length ? `In ${esc(scanResult.dir)}: ${esc(parts.join(', '))}.` : `No models found in ${esc(scanResult.dir)}.`}${scanResult.truncated ? ' It holds very many files: the look stopped early; choose a folder closer to the models.' : ''} <button data-stscanclose style="min-width:0">Clear</button></div>`);
  }

  return out.join('');
}
function ollamaStep(platform, x) {
  return (platform === 'linux'

// What a look in a folder found for one engine ('gguf' in the llama.cpp section, 'vllm' in the vLLM section), with ticks.
// What is already in the list is read from the farm's own state, never from the page's memory.
const samePath = (a, b) => (/^[A-Za-z]:/.test(String(a || ''))   // Windows: a name in either case is the same
  ? String(a).toLowerCase() === String(b || '').toLowerCase() : !!a && a === b);

      : [x.gb ? gbText(x.gb) : '', x.vision ? 'sees images' : '', x.slow ? 'on a Windows drive: it loads slower through WSL than from WSL\'s own disk' : ''].filter(Boolean).join(' · ');
    const why = lib.some((e) => e.path && samePath(e.path, x.path)) ? 'already in the list' : kind === 'gguf' && !x.complete ? 'a part of it is missing' : kind === 'vllm' && !x.usable ? 'not reachable from WSL' : '';
    return `<div class="row"><span></span><span><div class="mname"><label><input type="checkbox" data-stpick="${esc(key)}"${scanPicked.has(key) ? ' checked' : ''}${why ? ' disabled' : ''} /> ${esc(x.label)}</label></div>`

    + `<div class="row"><span></span><span></span><span class="badges">${kind === 'gguf' && scanResult.into ? `<button data-stmovein${jobRunning ? ' disabled' : ''}>Move the ticked ones into the farm's folder</button>` : ''}<button class="start" data-stuse="${kind}"${jobRunning ? ' disabled' : ''}>Add the ticked ones</button></span></div>`;

// The Ollama section: the folder its models are in, and an Ollama model folder found by a look (Use this folder).

// The vLLM section, on Windows: WSL's Linux disk (vLLM and its models are in it) and its Move.

// What Move here does, said before it starts (its dry run).

function wireStorage(s) {

    const id = b.dataset.stbrowse;
    if (id === 'st-dir') stDir = p; else if (id === 'st-scan') stScanDir = p; else wslDest = p;
    const el = $('#' + id); if (el) el.value = p;
  });
  on('button[data-stmove]', async (b) => {
    const st = s.storage || {};
    const dir = (st.move && !st.move.switched ? st.move.to : (stDir == null ? (st.dir || '') : stDir)).trim();
    if (!dir) { toast('Type a folder, or press Browse.'); return; }
    let d;
    try { d = await api('/lol/admin/storage/move', { method: 'POST', body: JSON.stringify({ dir, dryRun: true }) }); }
    catch (e) { if (e.unauthorized) { logout('Session expired — re-enter the token.'); return; } toast('Error: ' + (e.message || e)); return; }
    if (d && d.ok === false) { toast(d.error || 'Action failed'); return; }
    if (!confirm(moveConfirm(d))) return;
    stDir = null;
    post('/lol/admin/storage/move', { dir }, b, 'Moving the models…');
  });
  on('button[data-stfinish]', (b) => post('/lol/admin/storage/finish', {}, b, 'Finishing…'));
  on('button[data-stforget]', (b) => { if (confirm('Forget this move? Nothing is deleted: what was not switched stays where it is, and what was already copied stays in the new folder.')) post('/lol/admin/storage/forget', {}, b, 'Forgotten.'); });
  on('button[data-stscan]', async (b) => {
    const dir = stScanDir.trim();
    if (!dir) { toast('Type a folder, or press Browse.'); return; }
    b.disabled = true; b.textContent = '…';
    try {
      const r = await api('/lol/admin/storage/scan', { method: 'POST', body: JSON.stringify({ dir }) });
      if (r && r.ok === false) { toast(r.error || 'Could not look there.'); return; }
      scanResult = r; scanPicked.clear();
      // Each engine's section lists its part: those sections open.
      for (const [kind, id] of [['ollama', 'ollama'], ['gguf', 'llamacpp'], ['vllm', 'vllm']]) if ((r.found[kind] || []).length) engOpen[id] = true;
      saveOpen();
    } catch (e) { if (e.unauthorized) { logout('Session expired — re-enter the token.'); return; } toast('Error: ' + (e.message || e)); return; }
    finally { b.disabled = false; b.textContent = 'Look'; }
    refresh(true);
  });
  on('button[data-stscanclose]', () => { scanResult = null; scanPicked.clear(); render(s); });
  app.querySelectorAll('input[data-stpick]').forEach((c) => { c.onchange = () => { if (c.checked) scanPicked.add(c.dataset.stpick); else scanPicked.delete(c.dataset.stpick); }; });
  on('button[data-stuse]', async (b) => {
    const kind = b.dataset.stuse;
    const paths = [...scanPicked].filter((k) => k.startsWith(kind + ':')).map((k) => ({ path: k.slice(kind.length + 1) }));
    if (!paths.length) { toast('Tick at least one first.'); return; }
    await post('/lol/admin/storage/use', { [kind]: paths }, b, 'Added.');
    for (const k of [...scanPicked]) if (k.startsWith(kind + ':')) scanPicked.delete(k);
  });
  on('button[data-stmovein]', (b) => {
    const paths = [...scanPicked].filter((k) => k.startsWith('gguf:')).map((k) => ({ path: k.slice(5) }));
    if (!paths.length) { toast('Tick at least one first.'); return; }
    if (!confirm(`Move ${paths.length} model${paths.length === 1 ? '' : 's'} into ${scanResult.into}? Each is copied there and checked, then DELETED from where it is now (another program that reads it there will not find it any more). The farm lists them from its folder.`)) return;
    post('/lol/admin/storage/move-in', { gguf: paths }, b, 'Moving into the farm\'s folder…');
    for (const k of [...scanPicked]) if (k.startsWith('gguf:')) scanPicked.delete(k);
  });
  on('button[data-stollamain]', async (b) => {
    const st = s.storage || {};
    let d;
    try { d = await api('/lol/admin/storage/move', { method: 'POST', body: JSON.stringify({ dir: st.dir, moveLent: true, dryRun: true }) }); }
    catch (e) { if (e.unauthorized) { logout('Session expired — re-enter the token.'); return; } toast('Error: ' + (e.message || e)); return; }
    if (d && d.ok === false) { toast(d.error || 'Action failed'); return; }
    if (!confirm(moveConfirm(d))) return;
    post('/lol/admin/storage/move', { dir: st.dir, moveLent: true }, b, 'Moving the models…');
  });
  on('button[data-stollama]', (b) => {
    if (!confirm(`Let Ollama read its models from ${b.dataset.stollama}? The models of its folder now are not deleted, but Ollama will not list them any more.`)) return;
    post('/lol/admin/storage/use', { ollama: b.dataset.stollama }, b, 'Saved.');
  });
  on('button[data-wslmove]', async (b) => {
    const el = $('#wsl-dest');
    const dest = (wslDest || (el ? el.value : '')).trim();
    if (!dest) { toast('Type an empty folder on the other drive, or press Browse.'); return; }
    let d;
    try { d = await api('/lol/admin/vllm/wsl-move', { method: 'POST', body: JSON.stringify({ folder: dest, dryRun: true }) }); }
    catch (e) { if (e.unauthorized) { logout('Session expired — re-enter the token.'); return; } toast('Error: ' + (e.message || e)); return; }
    if (d && d.ok === false) { toast(d.error || 'Action failed'); return; }
    if (d && d.already) { toast(d.message); return; }
    if (!confirm(wslConfirm(d, dest))) return;
    post('/lol/admin/vllm/wsl-move', { folder: dest, stopAll: !!d.stopAll, distro: d.distro, others: d.others || [] }, b, 'Moving the Linux disk…');
  });
  // The folders are measured when the page opens (then at most once a minute, in the background).
  if (!storageChecked && s.storage && s.storage.stores == null) { storageChecked = true; api('/lol/admin/storage/check', { method: 'POST', body: '{}' }).then(() => refresh(true)).catch(() => {}); }
}

// "Let the farm run vLLM" (§9.2): a vLLM on this computer that the farm routes to without running it. The farm
// offers it; a person clicks it (the owner's question (a)). Once done, the block says so until the farm restarts,
// with Undo while vLLM still runs as it was taken over and no setting changed since (§9.4). At the top of the vLLM
// section, which opens by itself while it has one of them.
function takeOverBlock(s, jobRunning) {
  const t = s.vllm && s.vllm.takeOver;
  const d = s.vllm && s.vllm.takenOver;
  if (!t && d) {
    const tail = d.platform === 'win32'
      ? 'If this computer started vLLM at log on before, that now only opens the Farm app.'
      : 'If a service started it at boot before (lol-vllm), that service starts nothing now: to remove it, run  sudo systemctl disable lol-vllm .';
    return `<div class="subsec"><h2>vLLM on this computer</h2>`
      + `<div class="hint">The farm now runs vLLM, from ${esc(d.root)}: you change its model, people and context here, and it starts and stops with the farm. ${tail}</div>`
      + (d.undo ? `<div class="row"><span class="meta">Undo puts it back as it was: the farm routes to this vLLM without running it, and vLLM keeps running. Possible until a setting changes or the farm restarts.</span><span></span>`
        + `<span class="badges"><button data-vundo${jobRunning ? ' disabled' : ''}>Undo</button></span></div>` : '')
      + '</div>';
  }
  if (!t) return '';
  const tail = t.running
    ? 'It keeps the same model, name and settings and keeps running: nobody is interrupted.'
    : 'It keeps the same model, name and settings and starts it now: about 2 minutes, during which nobody can chat.';
  return `<div class="subsec"><h2>vLLM on this computer</h2>`
    + `<div class="hint">The vLLM this farm routes to runs on this computer, from ${esc(t.root)}. The farm can run it itself: then you change its model, people and context here, and it starts and stops with the farm. ${tail}${t.platform === 'linux' ? ` ${LINUX_BOOT}` : ''}</div>`
    + `<div class="row"><span></span><span></span><span class="badges"><button class="start" data-vtake${jobRunning ? ' disabled' : ''}>Let the farm run vLLM</button></span></div></div>`;
}

async function vllmCheck() {
  if (vllmChecking) return;
  vllmChecking = true;
  try { await post('/lol/admin/vllm/check', {}, null, 'Checked this computer.'); } finally { vllmChecking = false; }
}
async function showVllmLog() {
  try {
    const r = await api('/lol/admin/vllm/log?lines=200');
    vllmLogLines = (r && r.lines) || [];
  } catch (e) {
    if (e.unauthorized) { logout('Session expired — re-enter the token.'); return; }
    toast('Error: ' + (e.message || e));
  }
  if (lastState) render(lastState);
}

function wireVllm(s) {
  const v = s.vllm || {};
  const on = (sel, fn) => app.querySelectorAll(sel).forEach((b) => { b.onclick = () => fn(b); });
  on('button[data-vcheck]', () => vllmCheck());
  on('button[data-vinstall]', (b) => post('/lol/admin/vllm/install', {}, b, 'Installing vLLM…'));
  on('button[data-vdl]', (b) => post('/lol/admin/vllm/download', { id: b.dataset.vdl }, b, 'Downloading…'));
  on('button[data-vuse]', (b) => {
    // While vLLM serves, Use this restarts it with the other model (an Apply with `model`, §5.6).
    if ((s.backend || {}).engine === 'vllm' && !confirm(`Serve ${b.dataset.label}? vLLM restarts with it: about 2 minutes during which nobody can chat.`)) return;
    post('/lol/admin/apply', { model: b.dataset.vuse }, b, 'Applying…');
  });
  on('button[data-vrm]', (b) => {
    if (!confirm(`Remove ${b.dataset.label} from the list?`)) return;
    const gbs = Number(b.dataset.files) || 0;
    const where = v.distro ? ` The space goes back to ${v.distro}; drive ${v.hostDrive || 'C'}: does not shrink.` : '';
    const deleteFiles = gbs > 0 && confirm(`Also delete its files from this computer (${gbs} GB)?${where}`);
    post('/lol/admin/vllm/library/remove', { id: b.dataset.vrm, deleteFiles }, b, 'Removed.');
  });
  on('button[data-vfolder]', (b) => post('/lol/admin/vllm/library/add', { folder: b.dataset.vfolder }, b, 'Added to the list.'));
  on('button[data-vstop]', (b) => { if (confirm('Stop vLLM? Nobody can chat until you start it again or switch engine.')) post('/lol/admin/vllm/stop', {}, b, 'Stopping vLLM…'); });
  on('button[data-vstart]', (b) => post('/lol/admin/vllm/start', {}, b, 'Starting vLLM…'));
  on('button[data-vlog]', () => showVllmLog());
  on('button[data-vloghide]', () => { vllmLogLines = null; render(s); });
  on('button[data-vtake]', (b) => post('/lol/admin/vllm/take-over', {}, b, 'The farm runs vLLM now and is starting it.'));
  on('button[data-vundo]', (b) => post('/lol/admin/vllm/take-over/undo', {}, b, 'Back as before.'));
  bindApply('#vllm-add', '#vllm-repo', (val) => post('/lol/admin/vllm/library/add', { repo: val }, $('#vllm-add'), 'Added to the list.'));
  // The section's first open checks this computer once per page (never per poll, and not again when the farm could
  // not answer it: Check again is there for that). Opened by a person (sectionToggled checks at the click) or by the
  // page, or vLLM serving; not when it opened by itself for a download or a failed start.
  if (!vllmAutoChecked && (engOpen.vllm === true || (s.backend || {}).engine === 'vllm') && v.supported !== false && !v.probe) { vllmAutoChecked = true; vllmCheck(); }
}

// Wire an Apply button + its text field: Enter submits, an empty value is a no-op.
function bindApply(btnSel, inputSel, run) {
  const btn = $(btnSel); const input = $(inputSel);
  if (!btn || !input) return;
  const go = () => { const v = input.value.trim(); if (v) run(v); };
  btn.onclick = go;
  input.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
}

// One POST helper for every control that returns { ok, error, message, job }. Jobs
// report through /lol/admin/state, so a started job just needs an immediate refresh
// to put its progress bar on screen.
async function post(path, body, btn, okMsg) {
  if (busy) return;
  busy = true;
  if (btn) { btn.disabled = true; btn.dataset.was = btn.textContent; btn.textContent = '…'; }
  try {
    const r = await api(path, { method: 'POST', body: JSON.stringify(body) });
    if (r && r.ok === false) toast(r.error || 'Action failed');
    else if (r && r.started) toast(okMsg || 'Started');
    else toast((r && r.message) || okMsg || 'Done');
    if (r && r.warning) setTimeout(() => toast(r.warning), 2800);   // after the result toast, not over it
  } catch (e) {
    if (e.unauthorized) { logout('Session expired — re-enter the token.'); return; }
    toast('Error: ' + (e.message || e));
  } finally { busy = false; await refresh(true); }
}
// Promote a served model to the fleet default (clients' OWUI auto-selects it).
async function defaultAct(id, btn) {
  if (busy) return;
  busy = true; btn.disabled = true; btn.textContent = '…';
  try {
    const r = await api('/lol/admin/model/default', { method: 'POST', body: JSON.stringify({ id }) });
    if (!r.ok) toast(r.error || 'Action failed');
    else toast(id + ' is now the default model');
  } catch (e) {
    if (e.unauthorized) { logout('Session expired — re-enter the token.'); return; }
    toast('Error: ' + (e.message || e));
  } finally { busy = false; await refresh(); }
}

// Apply a new context window (bounces the proxy — a few seconds).
async function contextAct(tokens, btn) {
  if (busy || !tokens) return;
  busy = true; btn.disabled = true; btn.textContent = '…';
  try {
    const r = await api('/lol/admin/context', { method: 'POST', body: JSON.stringify({ tokens }) });
    if (!r.ok) toast(r.error || 'Action failed');
    else toast(r.already ? 'Context unchanged' : 'Context window set to ' + r.contextLength + ' tokens');
  } catch (e) {
    if (e.unauthorized) { logout('Session expired — re-enter the token.'); return; }
    toast('Error: ' + (e.message || e));
  } finally { busy = false; await refresh(); }
}

// Toggle a farm plugin on/off (spawns/kills the service — can take a few seconds).
async function pluginAct(kind, id, btn) {
  if (busy) return;
  busy = true; btn.disabled = true; btn.textContent = '…';
  try {
    const r = await api('/lol/admin/plugin/' + encodeURIComponent(id) + '/' + kind, { method: 'POST' });
    if (!r.ok) toast(r.error || 'Action failed');
    else toast((kind === 'enable' ? 'Enabled ' : 'Disabled ') + id);
  } catch (e) {
    if (e.unauthorized) { logout('Session expired — re-enter the token.'); return; }
    toast('Error: ' + (e.message || e));
  } finally { busy = false; await refresh(); }
}

// Recommend / un-recommend a client-side plugin (Blender) to the fleet (fast — just advertises).
async function recommendAct(kind, id, btn) {
  if (busy) return;
  busy = true; btn.disabled = true; btn.textContent = '…';
  try {
    await api('/lol/admin/plugin/recommend', { method: 'POST', body: JSON.stringify({ id, on: kind === 'on' }) });
    toast(kind === 'on' ? 'Recommended ' + id + ' to the fleet' : 'Un-recommended ' + id);
  } catch (e) {
    if (e.unauthorized) { logout('Session expired — re-enter the token.'); return; }
    toast('Error: ' + (e.message || e));
  } finally { busy = false; await refresh(); }
}

async function act(kind, id, btn) {
  if (busy) return;
  busy = true; btn.disabled = true; btn.textContent = '…';
  try {
    const r = await api('/lol/admin/model/' + kind, { method: 'POST', body: JSON.stringify({ id }) });
    if (!r.ok) toast(r.error || 'Action failed');
    else toast((kind === 'start' ? 'Started ' : 'Stopped ') + id);
  } catch (e) {
    if (e.unauthorized) { logout('Session expired — re-enter the token.'); return; }
    toast('Error: ' + (e.message || e));
  } finally {
    busy = false;
    await refresh();
  }
}

function logout(msg) { localStorage.removeItem('lolAdminToken'); token = ''; tokenPanel(msg); }

// `force` = a real action just happened, so render even mid-typing. The poll
// rebuilds innerHTML wholesale, which would otherwise wipe a half-typed model URL
// out from under the operator every 5 seconds.
// Un-applied edits in the settings block. The poll must not re-render over them:
// with one Apply for the whole block, edits legitimately sit in the page across
// several poll ticks before the operator presses it.
function settingsDirty() {
  if ((($('#sec-in') || {}).value || '') !== '') return true;
  if ((($('#vllm-repo') || {}).value || '') !== '') return true;   // a model name half typed
  return ['#name-in', '#slots-sel', '#idle-sel', '#ctx-sel', '#kv-sel'].some((sel) => {
    const el = $(sel);
    return el && el.dataset.orig != null && el.value !== el.dataset.orig;
  });
}

async function refresh(force) {
  if (!token) { tokenPanel(); return; }
  // …or a SELECT: the context/slots dropdowns are exactly where an operator
  // lingers reading the "won't fit" labels, and the 5 s poll snapped them shut.
  const tag = !force && document.activeElement ? document.activeElement.tagName : null;
  if (tag === 'INPUT' || tag === 'SELECT') return;
  if (!force && settingsDirty()) return;
  try {
    const s = await api('/lol/admin/state');
    render(s);
  } catch (e) {
    if (e.unauthorized) { logout('Wrong token.'); return; }
    app.innerHTML = '<div class="empty">Could not reach the farm: it may be restarting or stopped. Wait a few seconds; if this stays, start the farm again (in the Farm app: Start the farm). ' + esc(e.message || '') + '</div>';
  }
}

// 5 s idle; 1 s while a job or a download runs so the progress bar actually moves.
let tick = 0;
setInterval(() => {
  if (busy || !token) return;
  const running = lastState && ((lastState.job && !lastState.job.done) || (lastState.download && !lastState.download.done));
  if (running || ++tick >= 5) { tick = 0; refresh(); }
}, 1000);
refresh();
</script>
</body>
