      downloading ? '<span class="badge">downloading</span>' : e.downloaded ? '<span class="badge">downloaded</span>' : e.partial ? '<span class="badge">partly downloaded</span>' : '',
    ].join('');
    const size = e.sizeGb || e.gbOnDisk;
    const meta = [size ? `${size} GB` : '', e.note].filter(Boolean).join(' · ');
    const files = e.downloaded || e.partial ? (e.gbOnDisk || e.sizeGb || 0) : 0;
    const btns = [
      // A download uses vLLM's own tools: only once vLLM is installed (Install downloads the chosen model with it).
      !e.downloaded && e.repo && !downloading && v.installed ? `<button class="start" data-vdl="${esc(e.id)}"${off(!!dl)}>Download</button>` : '',
      e.downloaded && !e.active ? `<button class="start" data-vuse="${esc(e.id)}" data-label="${esc(e.label)}"${off(jobRunning)}>Use this</button>` : '',
      !e.active && !downloading ? `<button class="stop" data-vrm="${esc(e.id)}" data-label="${esc(e.label)}" data-files="${files}"${off(jobRunning)}>Remove</button>` : '',
    ].join('');
    out.push(`<div class="row"><span class="dot${e.active && isV ? ' served' : ''}"></span>`
      + `<span><div class="mname">${esc(e.label)}</div>${meta ? `<div class="meta">${esc(meta)}</div>` : ''}`
      + (e.generic ? `<div class="meta">Not one of the measured models: answers work, but tools and thinking may not show until a developer adds its settings.</div>` : '')
      + `</span><span class="badges">${badges}${btns}</span></div>`);
  }
  for (const f of v.foundFolders || []) {
    out.push(`<div class="row"><span></span><span><div class="meta">Also on this computer: ${esc(f.folder)}${f.gb != null ? ` (${f.gb} GB)` : ''}</div></span>`
      + `<span class="badges"><button data-vfolder="${esc(f.folder)}">Add to the list</button></span></div>`);
  }
  out.push(`<div class="row"><span></span><span><div class="mname">Add a model</div>`
    + `<div class="meta">the name of a model on Hugging Face (owner/name), made for vLLM. Adding only remembers it: press Download, then Use this.</div></span>`
    + `<span class="badges"><input id="vllm-repo" type="text" placeholder="nvidia/Qwen3.6-35B-A3B-NVFP4" spellcheck="false" /><button id="vllm-add">Add</button></span></div>`);
  // The engine's own controls, while it is the engine: Stop and Start (a start in progress stops from its bar).
  if (isV) {
    const canStop = ['ready', 'down'].includes(v.phase);
    const canStart = !['ready', 'down', 'starting', 'restarting', 'stopping'].includes(v.phase);
    out.push(`<div class="row"><span class="dot${v.phase === 'ready' ? ' served' : ''}"></span><span><div class="mname">Run vLLM</div>`
      + `<div class="meta">${canStop ? `Running, from ${esc(v.root || 'its folder')}.` : canStart ? 'Not running.' : 'Busy: the bar at the top of the page shows how far it is.'}</div></span>`
      + `<span class="badges">`
      + (canStop ? `<button class="stop" data-vstop${off(jobRunning)}>Stop vLLM</button>` : '')
      + (canStart ? `<button class="start" data-vstart${off(jobRunning)}>Start vLLM</button>` : '')
      + `</span></div>`);
  }
  out.push(`<div class="row"><span></span><span><div class="mname">vLLM's log</div>`
    + `<div class="meta">vLLM's own log, for when something goes wrong. It does not record conversations, but an error line can quote a few words of a reply.</div></span>`
    + `<span class="badges">`
    + `<button data-vlog>${vllmLogLines ? 'Refresh' : 'Show the log'}</button>`
    + (vllmLogLines ? '<button data-vloghide>Hide</button>' : '')
    + `</span></div>`);
  if (vllmLogLines) {
    out.push(`<pre style="max-height:320px;overflow:auto;font-size:11.5px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;white-space:pre-wrap">${esc(vllmLogLines.join('\n') || '(empty)')}</pre>`);
  }
  out.push('</div>');
  return out.join('');
}

// "Let the farm run vLLM" (§9.2): a vLLM on this computer that the farm routes to without running it. The farm
// offers it; a person clicks it (the owner's question (a)). Once done, the card says so until the farm restarts,
// with Undo while vLLM still runs as it was taken over and no setting changed since (§9.4).
function takeOverCard(s, jobRunning) {
  const t = s.vllm && s.vllm.takeOver;
  const d = s.vllm && s.vllm.takenOver;
  if (!t && d) {
    const tail = d.platform === 'win32'
      ? 'If this computer started vLLM at log on before, that now only opens the Farm app.'
      : 'If a service started it at boot before (lol-vllm), that service starts nothing now: to remove it, run  sudo systemctl disable lol-vllm .';
    return `<div class="card"><h2>vLLM on this computer</h2>`
      + `<div class="hint">The farm now runs vLLM, from ${esc(d.root)}: you change its model, people and context here, and it starts and stops with the farm. ${tail}</div>`
      + (d.undo ? `<div class="row"><span class="meta">Undo puts it back as it was: the farm routes to this vLLM without running it, and vLLM keeps running. Possible until a setting changes or the farm restarts.</span><span></span>`
        + `<span class="badges"><button data-vundo${jobRunning ? ' disabled' : ''}>Undo</button></span></div>` : '')
      + '</div>';
  }
  if (!t) return '';
  const tail = t.running
    ? 'It keeps the same model, name and settings and keeps running: nobody is interrupted.'
    : 'It keeps the same model, name and settings and starts it now: about 2 minutes, during which nobody can chat.';
  return `<div class="card"><h2>vLLM on this computer</h2>`
    + `<div class="hint">The vLLM this farm routes to runs on this computer, from ${esc(t.root)}. The farm can run it itself: then you change its model, people and context here, and it starts and stops with the farm. ${tail}${t.platform === 'linux' ? ` ${LINUX_BOOT}` : ''}</div>`
    + `<div class="row"><span></span><span></span><span class="badges"><button class="start" data-vtake${jobRunning ? ' disabled' : ''}>Let the farm run vLLM</button></span></div></div>`;
}

function openVllmCard(s) {
  vllmOpen = true;
  try { localStorage.setItem('lolVllmOpen', '1'); } catch { /* private window */ }
  render(s);
  if (s.vllm && s.vllm.supported !== false && !s.vllm.probe) { vllmAutoChecked = true; vllmCheck(); }
}
async function vllmCheck() {
  if (vllmChecking) return;
  vllmChecking = true;
  try { await post('/lol/admin/vllm/check', {}, null, 'Checked this computer.'); } finally { vllmChecking = false; }
}
async function showVllmLog() {
  try {
    const r = await api('/lol/admin/vllm/log?lines=200');
    vllmLogLines = (r && r.lines) || [];
  } catch (e) {
    if (e.unauthorized) { logout('Session expired — re-enter the token.'); return; }
    toast('Error: ' + (e.message || e));
  }
  if (lastState) render(lastState);
}

function wireVllm(s) {
  const v = s.vllm || {};
  const on = (sel, fn) => app.querySelectorAll(sel).forEach((b) => { b.onclick = () => fn(b); });
  on('button[data-vcheck]', () => vllmCheck());
  // Close the card opened by a press on the vLLM button (it is remembered in this browser): a farm whose GPU is too
  // small would show its red list on every page otherwise.
  on('button[data-vclose]', () => {
    vllmOpen = false;
    try { localStorage.removeItem('lolVllmOpen'); } catch { /* private window */ }
    render(s);
  });
  on('button[data-vinstall]', (b) => post('/lol/admin/vllm/install', {}, b, 'Installing vLLM…'));
  on('button[data-vdl]', (b) => post('/lol/admin/vllm/download', { id: b.dataset.vdl }, b, 'Downloading…'));
  on('button[data-vuse]', (b) => {
    // While vLLM serves, Use this restarts it with the other model (an Apply with `model`, §5.6).
    if ((s.backend || {}).engine === 'vllm' && !confirm(`Serve ${b.dataset.label}? vLLM restarts with it: about 2 minutes during which nobody can chat.`)) return;
    post('/lol/admin/apply', { model: b.dataset.vuse }, b, 'Applying…');
  });
  on('button[data-vrm]', (b) => {
    if (!confirm(`Remove ${b.dataset.label} from the list?`)) return;
    const gbs = Number(b.dataset.files) || 0;
    const where = v.distro ? ` The space goes back to ${v.distro}; drive ${v.hostDrive || 'C'}: does not shrink.` : '';
    const deleteFiles = gbs > 0 && confirm(`Also delete its files from this computer (${gbs} GB)?${where}`);
    post('/lol/admin/vllm/library/remove', { id: b.dataset.vrm, deleteFiles }, b, 'Removed.');
  });
  on('button[data-vfolder]', (b) => post('/lol/admin/vllm/library/add', { folder: b.dataset.vfolder }, b, 'Added to the list.'));
  on('button[data-vstop]', (b) => { if (confirm('Stop vLLM? Nobody can chat until you start it again or switch engine.')) post('/lol/admin/vllm/stop', {}, b, 'Stopping vLLM…'); });
  on('button[data-vstart]', (b) => post('/lol/admin/vllm/start', {}, b, 'Starting vLLM…'));
  on('button[data-vlog]', () => showVllmLog());
  on('button[data-vloghide]', () => { vllmLogLines = null; render(s); });
  on('button[data-vtake]', (b) => post('/lol/admin/vllm/take-over', {}, b, 'The farm runs vLLM now and is starting it.'));
  on('button[data-vundo]', (b) => post('/lol/admin/vllm/take-over/undo', {}, b, 'Back as before.'));
  bindApply('#vllm-add', '#vllm-repo', (val) => post('/lol/admin/vllm/library/add', { repo: val }, $('#vllm-add'), 'Added to the list.'));
  // The card's first open checks this computer once per page (never per poll, and not again when the farm could
  // not answer it: Check again is there for that).
  if (!vllmAutoChecked && (vllmOpen || (s.backend || {}).engine === 'vllm') && v.supported !== false && !v.probe) { vllmAutoChecked = true; vllmCheck(); }
}

// Wire an Apply button + its text field: Enter submits, an empty value is a no-op.
function bindApply(btnSel, inputSel, run) {
  const btn = $(btnSel); const input = $(inputSel);
  if (!btn || !input) return;
  const go = () => { const v = input.value.trim(); if (v) run(v); };
  btn.onclick = go;
  input.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
}

// One POST helper for every control that returns { ok, error, message, job }. Jobs
// report through /lol/admin/state, so a started job just needs an immediate refresh
// to put its progress bar on screen.
async function post(path, body, btn, okMsg) {
  if (busy) return;
  busy = true;
  if (btn) { btn.disabled = true; btn.dataset.was = btn.textContent; btn.textContent = '…'; }
  try {
    const r = await api(path, { method: 'POST', body: JSON.stringify(body) });
    if (r && r.ok === false) toast(r.error || 'Action failed');
    else if (r && r.started) toast(okMsg || 'Started');
    else toast((r && r.message) || okMsg || 'Done');
    if (r && r.warning) setTimeout(() => toast(r.warning), 2800);   // after the result toast, not over it
  } catch (e) {
    if (e.unauthorized) { logout('Session expired — re-enter the token.'); return; }
    toast('Error: ' + (e.message || e));
  } finally { busy = false; await refresh(true); }
}
// Promote a served model to the fleet default (clients' OWUI auto-selects it).
async function defaultAct(id, btn) {
  if (busy) return;
  busy = true; btn.disabled = true; btn.textContent = '…';
  try {
    const r = await api('/lol/admin/model/default', { method: 'POST', body: JSON.stringify({ id }) });
    if (!r.ok) toast(r.error || 'Action failed');
    else toast(id + ' is now the default model');
  } catch (e) {
    if (e.unauthorized) { logout('Session expired — re-enter the token.'); return; }
    toast('Error: ' + (e.message || e));
  } finally { busy = false; await refresh(); }
}

// Apply a new context window (bounces the proxy — a few seconds).
async function contextAct(tokens, btn) {
  if (busy || !tokens) return;
  busy = true; btn.disabled = true; btn.textContent = '…';
  try {
    const r = await api('/lol/admin/context', { method: 'POST', body: JSON.stringify({ tokens }) });
    if (!r.ok) toast(r.error || 'Action failed');
    else toast(r.already ? 'Context unchanged' : 'Context window set to ' + r.contextLength + ' tokens');
  } catch (e) {
    if (e.unauthorized) { logout('Session expired — re-enter the token.'); return; }
    toast('Error: ' + (e.message || e));
  } finally { busy = false; await refresh(); }
}

// Toggle a farm plugin on/off (spawns/kills the service — can take a few seconds).
async function pluginAct(kind, id, btn) {
  if (busy) return;
  busy = true; btn.disabled = true; btn.textContent = '…';
  try {
    const r = await api('/lol/admin/plugin/' + encodeURIComponent(id) + '/' + kind, { method: 'POST' });
    if (!r.ok) toast(r.error || 'Action failed');
    else toast((kind === 'enable' ? 'Enabled ' : 'Disabled ') + id);
  } catch (e) {
    if (e.unauthorized) { logout('Session expired — re-enter the token.'); return; }
    toast('Error: ' + (e.message || e));
  } finally { busy = false; await refresh(); }
}

// Recommend / un-recommend a client-side plugin (Blender) to the fleet (fast — just advertises).
async function recommendAct(kind, id, btn) {
  if (busy) return;
  busy = true; btn.disabled = true; btn.textContent = '…';
  try {
    await api('/lol/admin/plugin/recommend', { method: 'POST', body: JSON.stringify({ id, on: kind === 'on' }) });
    toast(kind === 'on' ? 'Recommended ' + id + ' to the fleet' : 'Un-recommended ' + id);
  } catch (e) {
    if (e.unauthorized) { logout('Session expired — re-enter the token.'); return; }
    toast('Error: ' + (e.message || e));
  } finally { busy = false; await refresh(); }
}

async function act(kind, id, btn) {
  if (busy) return;
  busy = true; btn.disabled = true; btn.textContent = '…';
  try {
    const r = await api('/lol/admin/model/' + kind, { method: 'POST', body: JSON.stringify({ id }) });
    if (!r.ok) toast(r.error || 'Action failed');
    else toast((kind === 'start' ? 'Started ' : 'Stopped ') + id);
  } catch (e) {
    if (e.unauthorized) { logout('Session expired — re-enter the token.'); return; }
    toast('Error: ' + (e.message || e));
  } finally {
    busy = false;
    await refresh();
  }
}

function logout(msg) { localStorage.removeItem('lolAdminToken'); token = ''; tokenPanel(msg); }

// `force` = a real action just happened, so render even mid-typing. The poll
// rebuilds innerHTML wholesale, which would otherwise wipe a half-typed model URL
// out from under the operator every 5 seconds.
// Un-applied edits in the settings block. The poll must not re-render over them:
// with one Apply for the whole block, edits legitimately sit in the page across
// several poll ticks before the operator presses it.
function settingsDirty() {
  if ((($('#sec-in') || {}).value || '') !== '') return true;
  if ((($('#vllm-repo') || {}).value || '') !== '') return true;   // a model name half typed
  return ['#name-in', '#slots-sel', '#idle-sel', '#ctx-sel', '#kv-sel'].some((sel) => {
    const el = $(sel);
    return el && el.dataset.orig != null && el.value !== el.dataset.orig;
  });
}

async function refresh(force) {
  if (!token) { tokenPanel(); return; }
  // …or a SELECT: the context/slots dropdowns are exactly where an operator
  // lingers reading the "won't fit" labels, and the 5 s poll snapped them shut.
  const tag = !force && document.activeElement ? document.activeElement.tagName : null;
  if (tag === 'INPUT' || tag === 'SELECT') return;
  if (!force && settingsDirty()) return;
  try {
    const s = await api('/lol/admin/state');
    render(s);
  } catch (e) {
    if (e.unauthorized) { logout('Wrong token.'); return; }
    app.innerHTML = '<div class="empty">Could not reach the farm: it may be restarting or stopped. Wait a few seconds; if this stays, start the farm again (in the Farm app: Start the farm). ' + esc(e.message || '') + '</div>';
  }
}

// 5 s idle; 1 s while a job or a download runs so the progress bar actually moves.
let tick = 0;
setInterval(() => {
  if (busy || !token) return;
  const running = lastState && ((lastState.job && !lastState.job.done) || (lastState.download && !lastState.download.done));
  if (running || ++tick >= 5) { tick = 0; refresh(); }
}, 1000);
refresh();
</script>
