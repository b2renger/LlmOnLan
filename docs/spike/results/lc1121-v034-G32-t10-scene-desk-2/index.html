<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; overflow: hidden; background: #2a2a3e; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="three.min.js"></script>
<script>
(function() {
  const W = 1024, H = 640;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2a2a3e);

  const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 100);
  camera.position.set(-4.5, 5.5, 5.5);
  camera.lookAt(0, 0.5, 0);

  // ---- Lights ----
  const ambient = new THREE.AmbientLight(0x404060, 0.6);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0x606080, 0.4);
  dirLight.position.set(3, 8, 4);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  dirLight.shadow.camera.left = -5;
  dirLight.shadow.camera.right = 5;
  dirLight.shadow.camera.top = 5;
  dirLight.shadow.camera.bottom = -5;
  scene.add(dirLight);

  // Lamp light (warm, from above)
  const lampLight = new THREE.PointLight(0xffaa44, 1.2, 10, 2);
  lampLight.position.set(0.8, 2.2, -0.2);
  lampLight.castShadow = true;
  lampLight.shadow.mapSize.set(512, 512);
  scene.add(lampLight);

  // Subtle fill from below
  const fillLight = new THREE.DirectionalLight(0x303050, 0.2);
  fillLight.position.set(-2, -1, 3);
  scene.add(fillLight);

  // ---- Materials ----
  const tableTopMat = new THREE.MeshStandardMaterial({
    color: 0x8B5A2B, roughness: 0.55, metalness: 0.05
  });
  const tableLegMat = new THREE.MeshStandardMaterial({
    color: 0x6B3A1A, roughness: 0.7, metalness: 0.02
  });
  const cupMat = new THREE.MeshStandardMaterial({
    color: 0xd0d0c8, roughness: 0.4, metalness: 0.05
  });
  const poleMat = new THREE.MeshStandardMaterial({
    color: 0x2a2a2a, roughness: 0.6, metalness: 0.3
  });
  const shadeMat = new THREE.MeshStandardMaterial({
    color: 0x6B5A3A, roughness: 0.7, metalness: 0.0, side: THREE.DoubleSide
  });

  // ---- Table ----
  const TABLE_W = 3.0;  // x
  const TABLE_D = 1.6;  // z
  const TABLE_TOP_H = 0.12;
  const TABLE_TOP_Y = 1.2;
  const LEG_W = 0.15;
  const LEG_D = 0.15;
  const LEG_H = TABLE_TOP_Y - TABLE_TOP_H / 2;

  // Table top
  const topGeo = new THREE.BoxGeometry(TABLE_W, TABLE_TOP_H, TABLE_D);
  const top = new THREE.Mesh(topGeo, tableTopMat);
  top.position.set(0, TABLE_TOP_Y, 0);
  top.castShadow = true;
  top.receiveShadow = true;
  scene.add(top);

  // Legs
  const legGeo = new THREE.BoxGeometry(LEG_W, LEG_H, LEG_D);
  const legPositions = [
    [-(TABLE_W/2 - 0.15), TABLE_TOP_Y - TABLE_TOP_H/2 - LEG_H/2, -(TABLE_D/2 - 0.15)],
    [ (TABLE_W/2 - 0.15), TABLE_TOP_Y - TABLE_TOP_H/2 - LEG_H/2, -(TABLE_D/2 - 0.15)],
    [-(TABLE_W/2 - 0.15), TABLE_TOP_Y - TABLE_TOP_H/2 - LEG_H/2,  (TABLE_D/2 - 0.15)],
    [ (TABLE_W/2 - 0.15), TABLE_TOP_Y - TABLE_TOP_H/2 - LEG_H/2,  (TABLE_D/2 - 0.15)],
  ];
  legPositions.forEach(function(pos) {
    const leg = new THREE.Mesh(legGeo, tableLegMat);
    leg.position.set(pos[0], pos[1], pos[2]);
    leg.castShadow = true;
    leg.receiveShadow = true;
    scene.add(leg);
  });

  // ---- Cup ----
  const cupGeo = new THREE.CylinderGeometry(0.12, 0.11, 0.22, 24);
  const cup = new THREE.Mesh(cupGeo, cupMat);
  cup.position.set(-0.5, TABLE_TOP_Y + TABLE_TOP_H/2 + 0.11, -0.15);
  cup.castShadow = true;
  cup.receiveShadow = true;
  scene.add(cup);

  // ---- Lamp ----
  const LAMP_X = 0.8;
  const LAMP_Z = -0.2;
  const LAMP_BASE_Y = TABLE_TOP_Y + TABLE_TOP_H / 2;

  // Pole
  const poleH = 1.0;
  const poleGeo = new THREE.CylinderGeometry(0.03, 0.03, poleH, 12);
  const pole = new THREE.Mesh(poleGeo, poleMat);
  pole.position.set(LAMP_X, LAMP_BASE_Y + poleH / 2, LAMP_Z);
  pole.castShadow = true;
  scene.add(pole);

  // Shade (cone)
  const shadeGeo = new THREE.ConeGeometry(0.3, 0.35, 24, 1, true);
  const shade = new THREE.Mesh(shadeGeo, shadeMat);
  shade.position.set(LAMP_X, LAMP_BASE_Y + poleH + 0.175, LAMP_Z);
  shade.castShadow = true;
  scene.add(shade);

  // Small cap on top of shade
  const capGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.04, 8);
  const cap = new THREE.Mesh(capGeo, poleMat);
  cap.position.set(LAMP_X, LAMP_BASE_Y + poleH + 0.35 + 0.02, LAMP_Z);
  scene.add(cap);

  // ---- Floor ----
  const floorGeo = new THREE.PlaneGeometry(20, 20);
  const floorMat = new THREE.MeshStandardMaterial({
    color: 0x3a3a4a, roughness: 0.9, metalness: 0.0
  });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0;
  floor.receiveShadow = true;
  scene.add(floor);

  // ---- Back wall (subtle) ----
  const wallGeo = new THREE.PlaneGeometry(20, 10);
  const wallMat = new THREE.MeshStandardMaterial({
    color: 0x2a2a3e, roughness: 1.0, metalness: 0.0
  });
  const wall = new THREE.Mesh(wallGeo, wallMat);
  wall.position.set(0, 5, -6);
  scene.add(wall);

  // ---- Render once ----
  renderer.render(scene, camera);
  window.__rendered = true;
})();
</script>
</body>
</html>
