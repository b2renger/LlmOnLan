<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Booking</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f2ed;
            color: #2c3e50;
            line-height: 1.5;
        }

        header {
            background-color: #0f4c5c;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        nav a:hover {
            opacity: 1;
        }

        nav a.active {
            opacity: 1;
            border-bottom: 2px solid #e67e22;
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 1.5rem;
            font-size: 1.25rem;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.25rem;
            font-size: 0.875rem;
            color: #666;
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #c5d0d8;
            border-radius: 6px;
            font-size: 1rem;
            background: white;
        }

        button {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 6px;
            font-size: 1.125rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #d35400;
        }

        .upcoming-list {
            list-style: none;
        }

        .upcoming-list li {
            padding: 0.75rem 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
        }

        .upcoming-list li:last-child {
            border-bottom: none;
        }

        .footer {
            text-align: center;
            padding: 2rem;
            color: #95a5a6;
            font-size: 0.875rem;
            grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
            }
            
            header {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Room booking</div>
        <nav>
            <a href="#" class="active">Book</a>
            <a href="#">My bookings</a>
            <a href="#">Help</a>
        </nav>
    </header>

    <main>
        <section class="card">
            <h2>Book a room</h2>
            <form>
                <div class="form-group">
                    <label for="name">Your name</label>
                    <input type="text" id="name" value="Alex Martin">
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" value="2026-12-03">
                </div>
                <div class="form-group">
                    <label for="room">Room</label>
                    <select id="room">
                        <option value="science-lab-b12" selected>Science lab B12</option>
                        <option value="art-studio">Art studio</option>
                        <option value="library-room-2">Library room 2</option>
                    </select>
                </div>
                <button type="submit">Book</button>
            </form>
        </section>

        <section class="card">
            <h2>Upcoming</h2>
            <ul class="upcoming-list">
                <li>
                    <span>Art studio</span>
                    <span>Mon 9:00</span>
                </li>
                <li>
                    <span>Library room 2</span>
                    <span>Tue 14:00</span>
                </li>
                <li>
                    <span>Science lab B12</span>
                    <span>Thu 10:30</span>
                </li>
            </ul>
        </section>

        <div class="footer">
            School rooms · 3 bookings this week
        </div>
    </main>
</body>
</html>
