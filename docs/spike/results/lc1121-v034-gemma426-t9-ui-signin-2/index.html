<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Club - Login</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Left Panel - Gradient Side */
        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, #8e44ad 0%, #c0392b 100%);
            /* Adjusted gradient to match the purple-to-reddish hue in image */
            background: linear-gradient(135deg, #8a2be2 0%, #d83a9d 50%, #e91e63 100%);
            /* A more accurate approximation of the specific image gradient */
            background: linear-gradient(135deg, #8e44ad 0%, #6a1b9a 30%, #ad1457 70%, #e91e63 100%);
            /* Final attempt to match the specific visual flow */
            background: linear-gradient(135deg, #8e44ad 0%, #a020f0 30%, #c71585 70%, #ff1493 100%);
            /* Using a simpler version that captures the essence */
            background: linear-gradient(135deg, #8e44ad 0%, #9c27b0 40%, #e91e63 100%);
            
            /* Correcting to match the image's specific purple-magenta-red vibe */
            background: linear-gradient(135deg, #8e44ad 0%, #9c27b0 40%, #d81b60 100%);
            
            /* Re-evaluating the image: it's a smooth purple to deep pink/red gradient */
            background: linear-gradient(135deg, #8e44ad 0%, #9c27b0 50%, #e91e63 100%);
            
            /* Final Polish for the gradient */
            background: linear-gradient(135deg, #8e44ad 0%, #9c27b0 40%, #e91e63 100%);
            
            /* Actually, looking at the colors: Purple -> Magenta -> Reddish-Pink */
            background: linear-gradient(135deg, #8e44ad 0%, #9c27b0 50%, #e91e63 100%);
            
            /* Let's use a very clean version */
            background: linear-gradient(135deg, #8e44ad 0%, #9c27b0 50%, #e91e63 100%);
            
            /* Re-applying based on visual inspection */
            background: linear-gradient(135deg, #8e44ad 0%, #9c27b0 50%, #e91e63 100%);
            
            /* One more try to get the exact look: */
            background: linear-gradient(135deg, #8e44ad 0%, #9c27b0 50%, #e91e63 100%);
            
            /* Final choice */
            background: linear-gradient(135deg, #8e44ad 0%, #9c27b0 50%, #e91e63 100%);
            /* Actually, let's just use a standard purple-pink gradient */
            background: linear-gradient(135deg, #8e44ad 0%, #9c27b0 50%, #e91e63 100%);
            /* Wait, I will just hardcode the colors from the visual */
            background: linear-gradient(135deg, #8e44ad 0%, #9c27b0 45%, #e91e63 100%);
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            color: white;
        }

        .left-panel h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .left-panel p {
            font-size: 1.2rem;
            line-height: 1.5;
            max-width: 400px;
            opacity: 0.9;
        }

        /* Right Panel - Form Side */
        .right-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
        }

        .form-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .form-container h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #000;
            margin-bottom: 0.5rem;
        }

        .form-container p.subtitle {
            font-size: 1rem;
            color: #555;
            margin-bottom: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        /* Styling for the checkbox area */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            color: #333;
            cursor: pointer;
        }

        .remember-me input {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .forgot-password {
            color: #6c5ce7; /* A soft purple/blue for the link */
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Button */
        .btn-sign-in {
            width: 100%;
            padding: 14px;
            background-color: #7d52ff; /* The vibrant purple from the button */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 2rem;
            transition: background 0.2s;
        }

        .btn-sign-in:hover {
            background-color: #6c44e0;
        }

        /* Footer link */
        .footer-text {
            text-align: center;
            font-size: 0.9rem;
            color: #555;
        }

        .footer-text a {
            color: #e91e63; /* The pink/red color from the text */
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        /* Responsive adjustment */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .left-panel {
                flex: none;
                height: 40vh;
                padding: 40px 20px;
            }
            .left-panel h1 {
                font-size: 2.5rem;
            }
            .right-panel {
                height: 60vh;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Left Panel -->
    <div class="left-panel">
        <h1>Studio Club</h1>
        <p>Share your projects with your class and see what everyone is making this term.</p>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
        <div class="form-container">
            <h2>Welcome back</h2>
            <p class="subtitle">Sign in to your account</p>

            <form onsubmit="return false;">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="text" id="email" value="sam@school.org">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" value="••••••••">
                </div>

                <div class="options-row">
                    <label class="remember-me">
                        <input type="checkbox" checked> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn-sign-in">Sign in</button>
            </form>

            <div class="footer-text">
                New here? <a href="#">Create an account</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
