<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSchool Dashboard</title>
    <style>
        :root {
            --primary-color: #4f5bd5;
            --sidebar-bg: #191940;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-main: #1a2b40;
            --text-muted: #6c757d;
            --text-light: #dcdde1;
            --success-color: #009688;
            --danger-color: #d32f2f;
            --border-color: #e0e0e0;
            --chart-color: #6366f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        aside {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            padding: 20px;
            flex-shrink: 0;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #fff;
            padding-left: 5px;
        }

        nav ul {
            list-style: none;
        }

        nav li {
            margin-bottom: 5px;
        }

        nav a {
            display: block;
            padding: 12px 15px;
            color: var(--text-light);
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
            transition: background 0.2s;
        }

        nav a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        nav a.active {
            background-color: var(--primary-color);
            color: #fff;
            font-weight: 500;
        }

        /* Main Content Styles */
        main {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 25px;
            color: var(--text-main);
        }

        /* Top Cards Grid */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-label {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 30px;
            font-weight: 700;
            color: var(--text-main);
        }

        .card-value.green { color: var(--success-color); }
        .card-value.red { color: var(--danger-color); }

        /* Bottom Section Grid */
        .bottom-section {
            display: grid;
            grid-template-columns: 2fr 1.2fr;
            gap: 20px;
        }

        /* Chart Section */
        .chart-container {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .chart-header {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .chart-area {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 200px;
            padding-top: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .bar-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            justify-content: flex-end;
        }

        .bar {
            width: 50px;
            background-color: var(--chart-color);
            border-radius: 4px 4px 0 0;
            position: relative;
            transition: height 0.3s ease;
        }
        
        /* Tooltip simulation on hover */
        .bar:hover {
            opacity: 0.9;
        }

        .bar-label {
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Table Section */
        .table-container {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 13px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        td {
            color: var(--text-main);
        }

        /* Responsive adjustments */
        @media (max-width: 900px) {
            .summary-cards {
                grid-template-columns: 1fr;
            }
            .bottom-section {
                grid-template-columns: 1fr;
            }
            aside {
                display: none; /* Simple hide for mobile, ideally hamburger menu */
            }
        }
    </style>
</head>
<body>

    <aside>
        <div class="logo">EcoSchool</div>
        <nav>
            <ul>
                <li><a href="#" class="active">Overview</a></li>
                <li><a href="#">Buildings</a></li>
                <li><a href="#">Reports</a></li>
                <li><a href="#">Settings</a></li>
            </ul>
        </nav>
    </aside>

    <main>
        <h1>Energy this week</h1>

        <div class="summary-cards">
            <div class="card">
                <div class="card-label">Electricity</div>
                <div class="card-value">1,240 kWh</div>
            </div>
            <div class="card">
                <div class="card-label">Solar produced</div>
                <div class="card-value green">386 kWh</div>
            </div>
            <div class="card">
                <div class="card-label">Heating</div>
                <div class="card-value red">+ 12 %</div>
            </div>
        </div>

        <div class="bottom-section">
            <!-- Chart Section -->
            <div class="chart-container">
                <div class="chart-header">Daily use</div>
                <div class="chart-area">
                    <div class="bar-group">
                        <div class="bar" style="height: 55%;"></div>
                        <div class="bar-label">Mon</div>
                    </div>
                    <div class="bar-group">
                        <div class="bar" style="height: 70%;"></div>
                        <div class="bar-label">Tue</div>
                    </div>
                    <div class="bar-group">
                        <div class="bar" style="height: 65%;"></div>
                        <div class="bar-label">Wed</div>
                    </div>
                    <div class="bar-group">
                        <div class="bar" style="height: 85%;"></div>
                        <div class="bar-label">Thu</div>
                    </div>
                    <div class="bar-group">
                        <div class="bar" style="height: 45%;"></div>
                        <div class="bar-label">Fri</div>
                    </div>
                </div>
            </div>

            <!-- Table Section -->
            <div class="table-container">
                <div class="chart-header">Buildings</div>
                <table>
                    <thead>
                        <tr>
                            <th>Building</th>
                            <th>kWh</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Main hall</td>
                            <td>520</td>
                        </tr>
                        <tr>
                            <td>Gym</td>
                            <td>310</td>
                        </tr>
                        <tr>
                            <td>Science wing</td>
                            <td>255</td>
                        </tr>
                        <tr>
                            <td>Library</td>
                            <td>155</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

</body>
</html>
