<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Three.js Scene</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Load three.js from the same folder -->
    <script src="three.min.js"></script>

    <script>
        // Setup basic scene, camera, and renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xadd8e6); // Sky blue background

        const camera = new THREE.PerspectiveCamera(45, 1024 / 640, 0.1, 1000);
        // Position camera to match the perspective in the image
        camera.position.set(0, 7, 16);

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(1024, 640);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Lighting setup
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 15, 10);
        dirLight.castShadow = true;
        // Configure shadow camera to cover the scene
        dirLight.shadow.camera.left = -15;
        dirLight.shadow.camera.right = 15;
        dirLight.shadow.camera.top = 15;
        dirLight.shadow.camera.bottom = -15;
        dirLight.shadow.bias = -0.0001;
        scene.add(dirLight);

        // Ground (Green Plane)
        const groundGeometry = new THREE.PlaneGeometry(100, 100);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x3b7a3b, roughness: 0.8, metalness: 0.1 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;
        ground.receiveShadow = true;
        scene.add(ground);

        // Objects
        // 1. Red Cube (Left)
        const cubeGeometry = new THREE.BoxGeometry(2.5, 2.5, 2.5);
        const cubeMaterial = new THREE.MeshStandardMaterial({ color: 0xa52a2a, roughness: 0.6 });
        const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cube.position.set(-4, 1.25, 0); // y = half height
        cube.castShadow = true;
        cube.receiveShadow = true;
        scene.add(cube);

        // 2. Yellow Cone (Center)
        const coneGeometry = new THREE.ConeGeometry(1.2, 3, 32);
        const coneMaterial = new THREE.MeshStandardMaterial({ color: 0xdaa520, roughness: 0.6 });
        const cone = new THREE.Mesh(coneGeometry, coneMaterial);
        cone.position.set(0, 1.5, 0); // y = half height
        cone.castShadow = true;
        cone.receiveShadow = true;
        scene.add(cone);

        // 3. Blue Sphere (Right)
        const sphereGeometry = new THREE.SphereGeometry(2, 32, 32);
        const sphereMaterial = new THREE.MeshStandardMaterial({ color: 0x1e3a8a, roughness: 0.4 });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.position.set(4.5, 2, 0); // y = radius
        sphere.castShadow = true;
        sphere.receiveShadow = true;
        scene.add(sphere);

        // Adjust camera to look at the center of the objects
        camera.lookAt(0, 1.5, 0);

        // Render the scene
        renderer.render(scene, camera);

        // Set flag indicating render is complete
        window.__rendered = true;
    </script>
</body>
</html>
