<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Scene Reconstruction</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script src="three.min.js"></script>
    <script>
        // Initialize scene, camera, and renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2d2d44);
        
        const camera = new THREE.PerspectiveCamera(45, 1024 / 640, 0.1, 1000);
        camera.position.set(0, 1.5, 3);
        camera.lookAt(0, 0.5, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(1024, 640);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // Create materials
        const tableMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x5a3520,
            roughness: 0.7,
            metalness: 0.1
        });
        
        const floorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x3a3a44,
            roughness: 0.8,
            metalness: 0.2
        });
        
        const cupMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x8a8a8a,
            roughness: 0.3,
            metalness: 0.7
        });
        
        const lampShadeMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x4a4a3a,
            roughness: 0.9,
            metalness: 0.1
        });
        
        const lampStandMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x2a2a2a,
            roughness: 0.4,
            metalness: 0.6
        });
        
        // Create floor
        const floorGeometry = new THREE.PlaneGeometry(10, 10);
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        floor.receiveShadow = true;
        scene.add(floor);
        
        // Create table
        const tableGroup = new THREE.Group();
        
        // Table top
        const tableTopGeometry = new THREE.BoxGeometry(1.2, 0.05, 0.6);
        const tableTop = new THREE.Mesh(tableTopGeometry, tableMaterial);
        tableTop.position.y = 0.8;
        tableTop.castShadow = true;
        tableTop.receiveShadow = true;
        tableGroup.add(tableTop);
        
        // Table legs
        const legGeometry = new THREE.BoxGeometry(0.04, 0.775, 0.04);
        const legPositions = [
            [-0.55, 0.3875, -0.25],
            [0.55, 0.3875, -0.25],
            [-0.55, 0.3875, 0.25],
            [0.55, 0.3875, 0.25]
        ];
        
        legPositions.forEach(pos => {
            const leg = new THREE.Mesh(legGeometry, tableMaterial);
            leg.position.set(...pos);
            leg.castShadow = true;
            leg.receiveShadow = true;
            tableGroup.add(leg);
        });
        
        scene.add(tableGroup);
        
        // Create cup
        const cupGeometry = new THREE.CylinderGeometry(0.06, 0.05, 0.12, 32);
        const cup = new THREE.Mesh(cupGeometry, cupMaterial);
        cup.position.set(-0.3, 0.885, 0.15);
        cup.castShadow = true;
        cup.receiveShadow = true;
        scene.add(cup);
        
        // Create lamp
        const lampGroup = new THREE.Group();
        
        // Lamp base
        const baseGeometry = new THREE.CylinderGeometry(0.08, 0.1, 0.02, 32);
        const base = new THREE.Mesh(baseGeometry, lampStandMaterial);
        base.position.y = 0.825;
        base.castShadow = true;
        base.receiveShadow = true;
        lampGroup.add(base);
        
        // Lamp stand
        const standGeometry = new THREE.CylinderGeometry(0.015, 0.015, 0.4, 8);
        const stand = new THREE.Mesh(standGeometry, lampStandMaterial);
        stand.position.y = 1.045;
        stand.castShadow = true;
        lampGroup.add(stand);
        
        // Lamp shade
        const shadeGeometry = new THREE.ConeGeometry(0.15, 0.2, 32, 1, true);
        const shade = new THREE.Mesh(shadeGeometry, lampShadeMaterial);
        shade.position.y = 1.25;
        shade.castShadow = true;
        shade.receiveShadow = true;
        lampGroup.add(shade);
        
        lampGroup.position.set(0.4, 0, -0.15);
        scene.add(lampGroup);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404060, 0.3);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(2, 3, 2);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);
        
        const pointLight = new THREE.PointLight(0xffa500, 0.5, 2);
        pointLight.position.set(0.4, 1.25, -0.15);
        pointLight.castShadow = true;
        scene.add(pointLight);
        
        // Render the scene
        renderer.render(scene, camera);
        window.__rendered = true;
    </script>
</body>
</html>
