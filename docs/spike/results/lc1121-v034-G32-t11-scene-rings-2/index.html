<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Three.js Scene</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="three.min.js"></script>
<script>
(function() {
  const W = 1024, H = 640;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a2a);

  const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 1000);
  camera.position.set(0, 2.5, 14);
  camera.lookAt(0, 1.5, 0);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 10, 10);
  scene.add(dirLight);

  const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
  dirLight2.position.set(-5, 5, 5);
  scene.add(dirLight2);

  // Red cylinder
  const redMat = new THREE.MeshPhongMaterial({ color: 0xb83030, shininess: 30 });
  const redCyl = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 1.2, 32), redMat);
  redCyl.position.set(-5.5, 0.6, 0);
  scene.add(redCyl);

  // Orange cylinder
  const orangeMat = new THREE.MeshPhongMaterial({ color: 0xcc7722, shininess: 30 });
  const orangeCyl = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 2.0, 32), orangeMat);
  orangeCyl.position.set(-3.3, 1.0, 0);
  scene.add(orangeCyl);

  // Yellow cylinder
  const yellowMat = new THREE.MeshPhongMaterial({ color: 0xbb9933, shininess: 30 });
  const yellowCyl = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 2.8, 32), yellowMat);
  yellowCyl.position.set(-1.1, 1.4, 0);
  scene.add(yellowCyl);

  // Green cylinder
  const greenMat = new THREE.MeshPhongMaterial({ color: 0x2a8866, shininess: 30 });
  const greenCyl = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 3.5, 32), greenMat);
  greenCyl.position.set(1.2, 1.75, 0);
  scene.add(greenCyl);

  // Blue cylinder
  const blueMat = new THREE.MeshPhongMaterial({ color: 0x3366cc, shininess: 30 });
  const blueCyl = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 4.2, 32), blueMat);
  blueCyl.position.set(3.5, 2.1, 0);
  scene.add(blueCyl);

  // Purple torus
  const purpleMat = new THREE.MeshPhongMaterial({ color: 0x8844aa, shininess: 30 });
  const torus = new THREE.Mesh(new THREE.TorusGeometry(1.3, 0.45, 32, 64), purpleMat);
  torus.position.set(-0.5, 4.5, 0);
  scene.add(torus);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  document.body.appendChild(renderer.domElement);

  renderer.render(scene, camera);
  window.__rendered = true;
})();
</script>
</body>
</html>
