<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="three.min.js"></script>
<script>
(function() {
  const W = 1024, H = 640;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0c0c2e);

  const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 100);
  camera.position.set(0, 2.5, 14);
  camera.lookAt(0, 1.5, 0);

  // Lights
  const ambient = new THREE.AmbientLight(0xffffff, 0.35);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 10, 8);
  scene.add(dirLight);

  const fillLight = new THREE.DirectionalLight(0xffffff, 0.25);
  fillLight.position.set(-5, 5, -3);
  scene.add(fillLight);

  // Helper to create a cylinder
  function makeCylinder(radius, height, color, x, y, z) {
    const geo = new THREE.CylinderGeometry(radius, radius, height, 48, 1);
    const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.7, metalness: 0.1 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    scene.add(mesh);
    return mesh;
  }

  // Red cylinder (shortest, leftmost)
  makeCylinder(0.5, 1.5, 0xc03030, -3.2, 0.75, 0);

  // Orange cylinder
  makeCylinder(0.5, 2.2, 0xd48510, -1.6, 1.1, 0);

  // Yellow cylinder
  makeCylinder(0.5, 2.8, 0xc4a020, 0, 1.4, 0);

  // Teal cylinder
  makeCylinder(0.5, 3.4, 0x2a7a72, 1.6, 1.7, 0);

  // Blue cylinder (tallest, rightmost)
  makeCylinder(0.5, 4.2, 0x3060b8, 3.2, 2.1, 0);

  // Purple torus (donut)
  const torusGeo = new THREE.TorusGeometry(1.0, 0.4, 24, 48);
  const torusMat = new THREE.MeshStandardMaterial({ color: 0x7a3a9a, roughness: 0.6, metalness: 0.15 });
  const torus = new THREE.Mesh(torusGeo, torusMat);
  torus.position.set(0, 4.8, 0);
  scene.add(torus);

  // Render
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  document.body.appendChild(renderer.domElement);

  renderer.render(scene, camera);
  window.__rendered = true;
})();
</script>
</body>
</html>
