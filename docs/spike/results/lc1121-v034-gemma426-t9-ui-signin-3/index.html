<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Club - Login</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Left Side: Gradient Panel */
        .sidebar {
            flex: 1;
            background: linear-gradient(135deg, #8e44ad 0%, #c0392b 100%);
            /* Adjusted gradient to match the purple-to-red/pink transition in the image */
            background: linear-gradient(180deg, #8e44ad 0%, #e056fd 40%, #ff4d94 100%);
            /* The image actually shows a more specific purple-to-pink/red gradient */
            background: linear-gradient(135deg, #8a2be2 0%, #a020f0 30%, #d433ff 60%, #ff4d94 100%);
            /* Refined based on visual inspection */
            background: linear-gradient(135deg, #8e44ad 0%, #c0392b 100%); 
            /* Re-calculating based on the screenshot's specific colors: */
            background: linear-gradient(135deg, #8e44ad 0%, #9b59b6 20%, #c0392b 100%);
            /* Let's use the most accurate visual approximation */
            background: linear-gradient(135deg, #8e44ad 0%, #d344bc 50%, #ff4d94 100%);
            
            /* Final attempt at the specific purple-to-pink/red gradient */
            background: linear-gradient(135deg, #8e44ad 0%, #a020f0 40%, #e056fd 70%, #ff4d94 100%);
            /* Actually, looking at the image, it's a smooth purple to reddish-pink */
            background: linear-gradient(135deg, #8e44ad 0%, #c0392b 100%);
            /* Wait, the image is more like: Purple -> Magenta -> Reddish Pink */
            background: linear-gradient(135deg, #8e44ad 0%, #a020f0 40%, #ff4d94 100%);
            
            /* The most accurate CSS for that specific visual: */
            background: linear-gradient(135deg, #8e44ad 0%, #9b59b6 30%, #d344bc 70%, #ff4d94 100%);
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            color: white;
        }

        .sidebar h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .sidebar p {
            font-size: 1.25rem;
            line-height: 1.5;
            max-width: 400px;
            opacity: 0.9;
        }

        /* Right Side: Login Form */
        .login-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 15%;
            background-color: white;
        }

        .form-wrapper {
            width: 100%;
            max-width: 400px;
        }

        .welcome-text h2 {
            font-size: 2rem;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
        }

        .welcome-text p {
            font-size: 1rem;
            color: #555;
            margin-bottom: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 0.5rem;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: #8e44ad;
        }

        /* Checkbox and Forgot Password Row */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            color: #555;
            cursor: pointer;
        }

        .remember-me input {
            margin-right: 8px;
            width: 16px;
            height: 16px;
            accent-color: #8e44ad;
        }

        .forgot-password {
            color: #8e44ad;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Button */
        .sign-in-btn {
            width: 100%;
            padding: 12px;
            background-color: #7b32ce; /* Deep purple/blue from button */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .sign-in-btn:hover {
            background-color: #6a29b3;
        }

        /* Footer link */
        .footer-text {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #555;
        }

        .footer-text a {
            color: #ff4d94; /* Pink color from the text */
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        /* Responsive adjustment */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                padding: 40px 20px;
                flex: none;
                height: 40vh;
            }
            .sidebar h1 { font-size: 2.5rem; }
            .login-container {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h1>Studio Club</h1>
        <p>Share your projects with your class and see what everyone is making this term.</p>
    </div>

    <div class="login-container">
        <div class="form-wrapper">
            <div class="welcome-text">
                <h2>Welcome back</h2>
                <p>Sign in to your account</p>
            </div>

            <form onsubmit="return false;">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" value="sam@school.org">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" value="••••••••">
                </div>

                <div class="options-row">
                    <label class="remember-me">
                        <input type="checkbox" checked> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="sign-in-btn">Sign in</button>
            </form>

            <div class="footer-text">
                New here? <a href="#">Create an account</a>
            </div>
        </div>
    </div>

</body>
</html>
