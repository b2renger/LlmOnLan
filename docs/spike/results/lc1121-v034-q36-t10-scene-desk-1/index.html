<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Table Scene</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #444;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <script src="three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2d2d44);
        
        // Camera setup - positioned to match the isometric view
        const camera = new THREE.PerspectiveCamera(45, 1024/640, 0.1, 1000);
        camera.position.set(8, 6, 8);
        camera.lookAt(0, 0, 0);
        
        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ 
            canvas: document.createElement('canvas'),
            antialias: true 
        });
        renderer.setSize(1024, 640);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        // Materials
        const tableMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x8B4513,
            shininess: 100
        });
        
        const legMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x3E2723,
            shininess: 30
        });
        
        const cupMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x808080,
            shininess: 50
        });
        
        const lampShadeMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x3E2723,
            shininess: 20
        });
        
        const lampBaseMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x2F4F4F,
            shininess: 80
        });
        
        // Floor
        const floorGeometry = new THREE.PlaneGeometry(20, 20);
        const floorMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x2C3E50,
            shininess: 10
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.5;
        floor.receiveShadow = true;
        scene.add(floor);
        
        // Table top
        const tableTopGeometry = new THREE.BoxGeometry(4, 0.2, 2);
        const tableTop = new THREE.Mesh(tableTopGeometry, tableMaterial);
        tableTop.position.y = 0.5;
        tableTop.castShadow = true;
        tableTop.receiveShadow = true;
        scene.add(tableTop);
        
        // Table legs
        const legGeometry = new THREE.BoxGeometry(0.15, 1.2, 0.15);
        const legPositions = [
            [-1.8, -0.1, -0.8],
            [1.8, -0.1, -0.8],
            [-1.8, -0.1, 0.8],
            [1.8, -0.1, 0.8]
        ];
        
        legPositions.forEach(pos => {
            const leg = new THREE.Mesh(legGeometry, legMaterial);
            leg.position.set(...pos);
            leg.castShadow = true;
            leg.receiveShadow = true;
            scene.add(leg);
        });
        
        // Cup on table
        const cupGeometry = new THREE.CylinderGeometry(0.25, 0.25, 0.4, 16);
        const cup = new THREE.Mesh(cupGeometry, cupMaterial);
        cup.position.set(-0.5, 0.8, 0);
        cup.castShadow = true;
        scene.add(cup);
        
        // Lamp
        const lampShadeGeometry = new THREE.ConeGeometry(0.8, 0.6, 32);
        const lampShade = new THREE.Mesh(lampShadeGeometry, lampShadeMaterial);
        lampShade.position.set(1.2, 1.1, 0);
        lampShade.castShadow = true;
        scene.add(lampShade);
        
        const lampBaseGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.7, 8);
        const lampBase = new THREE.Mesh(lampBaseGeometry, lampBaseMaterial);
        lampBase.position.set(1.2, 0.85, 0);
        lampBase.castShadow = true;
        scene.add(lampBase);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
        mainLight.position.set(5, 5, 5);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);
        
        const pointLight = new THREE.PointLight(0xff6600, 0.5, 5);
        pointLight.position.set(1.2, 1.3, 0);
        scene.add(pointLight);
        
        // Render the scene
        renderer.render(scene, camera);
        
        // Output the canvas
        const canvas = renderer.domElement;
        document.body.appendChild(canvas);
        
        // Set the global variable as requested
        window.__rendered = true;
    </script>
</body>
</html>
