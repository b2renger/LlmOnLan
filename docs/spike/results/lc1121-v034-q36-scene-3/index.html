<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Scene with Three.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #87CEEB;
        }
        canvas {
            display: block;
            width: 1024px;
            height: 640px;
        }
    </style>
</head>
<body>
    <script src="three.min.js"></script>
    <script>
        // Create a new scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Light blue background

        // Set up the camera
        const camera = new THREE.PerspectiveCamera(75, 1024 / 640, 0.1, 1000);
        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);

        // Set up the renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(1024, 640);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Create the ground plane
        const groundGeometry = new THREE.PlaneGeometry(10, 10);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Create the red cube
        const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
        const cubeMaterial = new THREE.MeshStandardMaterial({ color: 0xB22222 });
        const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cube.position.set(-2, 0.5, 0);
        cube.castShadow = true;
        scene.add(cube);

        // Create the yellow cone
        const coneGeometry = new THREE.ConeGeometry(0.5, 1, 32);
        const coneMaterial = new THREE.MeshStandardMaterial({ color: 0xDAA520 });
        const cone = new THREE.Mesh(coneGeometry, coneMaterial);
        cone.position.set(0, 0.5, 0);
        cone.castShadow = true;
        scene.add(cone);

        // Create the blue sphere
        const sphereGeometry = new THREE.SphereGeometry(0.75, 32, 32);
        const sphereMaterial = new THREE.MeshStandardMaterial({ color: 0x00008B });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.position.set(2, 0.75, 0);
        sphere.castShadow = true;
        scene.add(sphere);

        // Add directional light
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 5, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // Add ambient light
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);

        // Render the scene once
        renderer.render(scene, camera);
        window.__rendered = true;
    </script>
</body>
</html>
