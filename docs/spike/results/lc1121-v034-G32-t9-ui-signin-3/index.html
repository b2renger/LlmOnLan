<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Club Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            display: flex;
            min-height: 100vh;
        }

        .left-panel {
            width: 50%;
            background: linear-gradient(135deg, #6b21a8 0%, #7c3aed 30%, #a855f7 50%, #c026d3 70%, #ec4899 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 50px;
            color: white;
        }

        .left-panel h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .left-panel p {
            font-size: 17px;
            line-height: 1.6;
            opacity: 0.95;
            max-width: 340px;
        }

        .right-panel {
            width: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .login-form {
            width: 100%;
            max-width: 380px;
        }

        .login-form h2 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .login-form .subtitle {
            font-size: 15px;
            color: #6b7280;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-group input[type="email"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            color: #1a1a2e;
            background: #fff;
        }

        .form-group input[type="email"]:focus,
        .form-group input[type="password"]:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.1);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #3b82f6;
            cursor: pointer;
        }

        .remember-me label {
            font-size: 14px;
            color: #374151;
            cursor: pointer;
        }

        .forgot-password {
            font-size: 14px;
            color: #7c3aed;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .sign-in-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: #7c3aed;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .sign-in-btn:hover {
            background: #6d28d9;
        }

        .create-account {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #6b7280;
        }

        .create-account a {
            color: #dc2626;
            text-decoration: none;
            font-weight: 500;
        }

        .create-account a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="left-panel">
        <h1>Studio Club</h1>
        <p>Share your projects with your class and see what everyone is making this term.</p>
    </div>
    <div class="right-panel">
        <form class="login-form">
            <h2>Welcome back</h2>
            <p class="subtitle">Sign in to your account</p>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" value="sam@school.org">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" value="password">
            </div>

            <div class="form-options">
                <div class="remember-me">
                    <input type="checkbox" id="remember" checked>
                    <label for="remember">Remember me</label>
                </div>
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>

            <button type="submit" class="sign-in-btn">Sign in</button>

            <p class="create-account">New here? <a href="#">Create an account</a></p>
        </form>
    </div>
</body>
</html>
