<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Three.js Scene</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xcfe8f5);

        const camera = new THREE.PerspectiveCamera(45, 1024 / 640, 0.1, 1000);
        camera.position.set(5, 4, 12);
        camera.lookAt(0, 0.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(1024, 640);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Ground
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x3a7a3a });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Cube
        const cubeGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const cubeMat = new THREE.MeshLambertMaterial({ color: 0x992222 });
        const cube = new THREE.Mesh(cubeGeo, cubeMat);
        cube.position.set(-2.5, 0.75, 0);
        cube.rotation.y = -0.2;
        cube.castShadow = true;
        cube.receiveShadow = true;
        scene.add(cube);

        // Cone
        const coneGeo = new THREE.ConeGeometry(0.8, 2.0, 32);
        const coneMat = new THREE.MeshLambertMaterial({ color: 0xb89420 });
        const cone = new THREE.Mesh(coneGeo, coneMat);
        cone.position.set(0, 1.0, 0);
        cone.castShadow = true;
        cone.receiveShadow = true;
        scene.add(cone);

        // Sphere
        const sphereGeo = new THREE.SphereGeometry(1.2, 32, 32);
        const sphereMat = new THREE.MeshLambertMaterial({ color: 0x1a2a8a });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphere.position.set(2.8, 1.2, 0);
        sphere.castShadow = true;
        sphere.receiveShadow = true;
        scene.add(sphere);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;
        dirLight.shadow.camera.left = -10;
        dirLight.shadow.camera.right = 10;
        dirLight.shadow.camera.top = 10;
        dirLight.shadow.camera.bottom = -10;
        scene.add(dirLight);

        renderer.render(scene, camera);
        window.__rendered = true;
    </script>
</body>
</html>
