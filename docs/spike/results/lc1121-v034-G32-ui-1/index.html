<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Booking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0ece3;
            color: #333;
            min-height: 100vh;
        }

        /* Header */
        header {
            background-color: #1a3a4a;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        nav {
            display: flex;
            gap: 28px;
            align-items: center;
        }

        nav a {
            color: #c8d6dd;
            text-decoration: none;
            font-size: 15px;
            font-weight: 400;
            padding-bottom: 2px;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #ffffff;
        }

        nav a.active {
            color: #ffffff;
            font-weight: 500;
            border-bottom: 2px solid #d4820a;
        }

        /* Main Content */
        .container {
            max-width: 960px;
            margin: 32px auto;
            padding: 0 24px;
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        /* Cards */
        .card {
            background: #ffffff;
            border-radius: 10px;
            padding: 28px 32px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }

        .card-left {
            flex: 1;
        }

        .card-right {
            width: 260px;
            flex-shrink: 0;
        }

        .card h2 {
            font-size: 19px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 22px;
        }

        /* Form */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13.5px;
            color: #6b7b8a;
            margin-bottom: 6px;
            font-weight: 400;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #d5d5d5;
            border-radius: 6px;
            font-size: 15px;
            color: #222;
            background: #fff;
            outline: none;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #999;
        }

        .form-group select {
            appearance: auto;
            cursor: pointer;
        }

        .btn-book {
            display: inline-block;
            background-color: #d4820a;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: background-color 0.2s;
            font-family: inherit;
        }

        .btn-book:hover {
            background-color: #c07508;
        }

        /* Upcoming List */
        .upcoming-list {
            list-style: none;
        }

        .upcoming-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #e8e5dd;
        }

        .upcoming-list li:last-child {
            border-bottom: none;
        }

        .upcoming-list .room-name {
            font-size: 14.5px;
            color: #2a2a2a;
            font-weight: 400;
        }

        .upcoming-list .room-time {
            font-size: 14px;
            color: #7a8a99;
            font-weight: 400;
            white-space: nowrap;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 40px 0 32px;
            font-size: 13px;
            color: #a0a0a0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Room booking</h1>
        <nav>
            <a href="#" class="active">Book</a>
            <a href="#">My bookings</a>
            <a href="#">Help</a>
        </nav>
    </header>

    <div class="container">
        <div class="card card-left">
            <h2>Book a room</h2>
            <form>
                <div class="form-group">
                    <label for="name">Your name</label>
                    <input type="text" id="name" value="Alex Martin">
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="text" id="date" value="2026-12-03">
                </div>
                <div class="form-group">
                    <label for="room">Room</label>
                    <select id="room">
                        <option value="science-lab-b12" selected>Science lab B12</option>
                        <option value="art-studio">Art studio</option>
                        <option value="library-room-2">Library room 2</option>
                    </select>
                </div>
                <button type="button" class="btn-book">Book</button>
            </form>
        </div>

        <div class="card card-right">
            <h2>Upcoming</h2>
            <ul class="upcoming-list">
                <li>
                    <span class="room-name">Art studio</span>
                    <span class="room-time">Mon 9:00</span>
                </li>
                <li>
                    <span class="room-name">Library room 2</span>
                    <span class="room-time">Tue 14:00</span>
                </li>
                <li>
                    <span class="room-name">Science lab B12</span>
                    <span class="room-time">Thu 10:30</span>
                </li>
            </ul>
        </div>
    </div>

    <div class="footer">
        School rooms · 3 bookings this week
    </div>

</body>
</html>
