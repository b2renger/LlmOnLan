<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Three.js Scene Rebuild</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { width: 1024px; height: 640px; display: block; margin: 0 auto; }
    </style>
</head>
<body>
    <script src="three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xbbd9f0); // Light blue sky

        // Camera setup
        const camera = new THREE.PerspectiveCamera(45, 1024 / 640, 0.1, 1000);
        camera.position.set(0, 2, 7);
        camera.lookAt(0, 0.5, 0);

        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(1024, 640);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Floor (Green plane)
        const floorGeometry = new THREE.PlaneGeometry(20, 20);
        const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x3a8e3a });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Red Cube
        const cubeGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const cubeMat = new THREE.MeshLambertMaterial({ color: 0xb32424 });
        const cube = new THREE.Mesh(cubeGeo, cubeMat);
        cube.position.set(-2.5, 0.75, 0.5);
        cube.rotation.y = 0.2;
        cube.rotation.x = -0.1;
        cube.castShadow = true;
        cube.receiveShadow = true;
        scene.add(cube);

        // Yellow Cone
        const coneGeo = new THREE.ConeGeometry(0.7, 1.8, 32);
        const coneMat = new THREE.MeshLambertMaterial({ color: 0xcc9933 });
        const cone = new THREE.Mesh(coneGeo, coneMat);
        cone.position.set(0, 0.9, 0);
        cone.castShadow = true;
        cone.receiveShadow = true;
        scene.add(cone);

        // Blue Sphere
        const sphereGeo = new THREE.SphereGeometry(1, 32, 32);
        const sphereMat = new THREE.MeshLambertMaterial({ color: 0x1a33cc });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphere.position.set(2.5, 1, -0.5);
        sphere.castShadow = true;
        sphere.receiveShadow = true;
        scene.add(sphere);

        // Lighting
        // Ambient light for soft fill
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        // Directional light to create shadows
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        // Adjust shadow properties for better look
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.left = -10;
        dirLight.shadow.camera.right = 10;
        dirLight.shadow.camera.top = 10;
        dirLight.shadow.camera.bottom = -10;
        scene.add(dirLight);

        // Render
        renderer.render(scene, camera);

        // Signal completion
        window.__rendered = true;
    </script>
</body>
</html>
