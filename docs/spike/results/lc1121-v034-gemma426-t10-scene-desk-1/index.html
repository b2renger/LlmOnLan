<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Scene Rebuild</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { width: 1024px; height: 640px; display: block; margin: 0 auto; }
    </style>
</head>
<body>
    <script src="three.min.js"></script>
    <script>
        // Initialize Scene
        const width = 1024;
        const height = 640;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x242a44); // Dark blue background

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        document.body.appendChild(renderer.domElement);

        // Floor/Ground
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x3e4a59 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.5;
        scene.add(floor);

        // Table
        const tableGroup = new THREE.Group();
        const tableTopGeo = new THREE.BoxGeometry(4, 0.2, 2);
        const tableMat = new THREE.MeshStandardMaterial({ color: 0x7a421a });
        const tableTop = new THREE.Mesh(tableTopGeo, tableMat);
        tableTop.position.y = 0.5;
        tableGroup.add(tableTop);

        const legGeo = new THREE.BoxGeometry(0.2, 1, 0.2);
        const legPositions = [
            [-1.8, 0, 0.8], [1.8, 0, 0.8],
            [-1.8, 0, -0.8], [1.8, 0, -0.8]
        ];
        legPositions.forEach(pos => {
            const leg = new THREE.Mesh(legGeo, tableMat);
            leg.position.set(pos[0], 0, pos[2]);
            tableGroup.add(leg);
        });
        scene.add(tableGroup);

        // Cup (White cylinder)
        const cupGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.4, 32);
        const cupMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const cup = new THREE.Mesh(cupGeo, cupMat);
        cup.position.set(-0.5, 0.7, 0);
        scene.add(cup);

        // Lamp
        const lampGroup = new THREE.Group();
        const standGeo = new THREE.CylinderGeometry(0.05, 0.05, 1.5, 16);
        const standMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const stand = new THREE.Mesh(standGeo, standMat);
        stand.position.y = 0.75;
        lampGroup.add(stand);

        const shadeGeo = new THREE.ConeGeometry(0.4, 0.6, 3);
        const shadeMat = new THREE.MeshStandardMaterial({ color: 0x7a6a5a });
        const shade = new THREE.Mesh(shadeGeo, shadeMat);
        shade.position.y = 1.5;
        lampGroup.add(shade);

        lampGroup.position.set(0.8, 0.5, 0);
        scene.add(lampGroup);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        const spotLight = new THREE.SpotLight(0xffffff, 1.5);
        spotLight.position.set(2, 5, 2);
        spotLight.angle = Math.PI / 6;
        spotLight.penumbra = 0.3;
        scene.add(spotLight);

        // Camera Position (matching perspective)
        camera.position.set(0, 3, 6);
        camera.lookAt(0, 0, 0);

        // Render
        renderer.render(scene, camera);
        window.__rendered = true;
    </script>
</body>
</html>
