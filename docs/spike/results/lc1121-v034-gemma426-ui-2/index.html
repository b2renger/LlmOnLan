<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room booking</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            background-color: #f0eee9;
            color: #333;
            line-height: 1.5;
        }

        /* Header Styles */
        header {
            background-color: #004d56;
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 16px;
        }

        nav a.active {
            border-bottom: 3px solid #ff7f27;
            padding-bottom: 5px;
        }

        /* Layout Container */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            display: flex;
            gap: 20px;
            padding: 0 20px;
        }

        /* Card Styles */
        .card {
            background: white;
            border-radius: 8px;
            padding: 30px;
            flex: 1;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .upcoming-card {
            flex: 0.8;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: normal;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            background-color: white;
        }

        /* Button Style */
        .btn-book {
            background-color: #ff6611;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Upcoming List Styles */
        .upcoming-list {
            margin-top: 10px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .room-name {
            color: #333;
        }

        .time-info {
            color: #666;
            text-align: right;
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 40px;
            padding-bottom: 40px;
            font-size: 13px;
            color: #888;
        }

    </style>
</head>
<body>

    <header>
        <h1>Room booking</h1>
        <nav>
            <a href="#" class="active">Book</a>
            <a href="#">My bookings</a>
            <a href="#">Help</a>
        </nav>
    </header>

    <div class="container">
        <!-- Booking Form Card -->
        <div class="card">
            <h2>Book a room</h2>
            
            <div class="form-group">
                <label for="name">Your name</label>
                <input type="text" id="name" value="Alex Martin">
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="text" id="date" value="2026-12-03">
            </div>

            <div class="form-group">
                <label for="room">Room</label>
                <select id="room">
                    <option value="science-lab">Science lab B12</option>
                </select>
            </div>

            <button class="btn-book">Book</button>
        </div>

        <!-- Upcoming Card -->
        <div class="card upcoming-card">
            <h2>Upcoming</h2>
            <div class="upcoming-list">
                <div class="list-item">
                    <span class="room-name">Art studio</span>
                    <span class="time-info">Mon 9:00</span>
                </div>
                <div class="list-item">
                    <span class="room-name">Library room 2</span>
                    <span class="time-info">Tue 14:00</span>
                </div>
                <div class="list-item">
                    <span class="room-name">Science lab B12</span>
                    <span class="time-info">Thu 10:30</span>
                </div>
            </div>
        </div>
    </div>

    <footer>
        School rooms · 3 bookings this week
    </footer>

</body>
</html>
