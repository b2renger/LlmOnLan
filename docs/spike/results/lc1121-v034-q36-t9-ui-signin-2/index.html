<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Club - Login</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            background-color: #ffffff;
            color: #0f172a;
            overflow: hidden;
        }

        /* Layout */
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Left Panel - Branding */
        .brand-section {
            flex: 1;
            background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
            color: white;
        }

        .brand-section h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
        }

        .brand-section p {
            font-size: 1.25rem;
            line-height: 1.5;
            opacity: 0.9;
            max-width: 400px;
            font-weight: 400;
        }

        /* Right Panel - Form */
        .form-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background-color: white;
        }

        .form-container {
            width: 100%;
            max-width: 420px;
        }

        .form-header {
            margin-bottom: 2rem;
        }

        .form-header h2 {
            font-size: 1.875rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        .form-header p {
            color: #64748b;
            font-size: 1rem;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #334155;
            margin-bottom: 0.375rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            color: #0f172a;
            background-color: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 0.5rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .form-input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            cursor: pointer;
            accent-color: #2563eb; /* Fallback color, overridden by custom style if needed, but keeping it simple */
        }

        .checkbox-wrapper label {
            font-size: 0.875rem;
            color: #334155;
            cursor: pointer;
        }

        .forgot-link {
            font-size: 0.875rem;
            color: #7c3aed;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            padding: 0.75rem 1.5rem;
            background-color: #7c3aed;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: block;
        }

        .btn-primary:hover {
            background-color: #6d28d9;
        }

        .signup-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: #64748b;
        }

        .signup-link {
            color: #db2777;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .brand-section {
                display: none;
            }
            
            .form-section {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Side: Branding -->
        <div class="brand-section">
            <h1>Studio Club</h1>
            <p>Share your projects with your class and see what everyone is making this term.</p>
        </div>

        <!-- Right Side: Login Form -->
        <div class="form-section">
            <div class="form-container">
                <div class="form-header">
                    <h2>Welcome back</h2>
                    <p>Sign in to your account</p>
                </div>

                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-input" value="sam@school.org">
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-input" value="password123">
                    </div>

                    <div class="form-actions">
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="remember" checked>
                            <label for="remember">Remember me</label>
                        </div>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-primary">Sign in</button>
                </form>

                <div class="signup-text">
                    New here? <a href="#" class="signup-link">Create an account</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
