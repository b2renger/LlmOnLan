<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Club - Login</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
        }

        /* Layout Container */
        .container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* Left Panel (Purple Gradient) */
        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, #8e44ad 0%, #c0392b 100%);
            /* Adjusted gradient to match the visual flow of the image */
            background: linear-gradient(180deg, #8e44ad 0%, #e056fd 40%, #ff4d94 100%);
            /* The image shows a purple-to-pink/red gradient */
            background: linear-gradient(135deg, #8e44ad 0%, #6c5ce7 40%, #ff4d94 100%);
            /* Let's use a more accurate approximation of the image gradient */
            background: linear-gradient(135deg, #8e44ad 0%, #6b3fa0 50%, #d63384 100%);
            /* Re-evaluating the specific colors in the image */
            background: linear-gradient(135deg, #8e44ad 0%, #a259ff 50%, #e84393 100%);
            
            /* Final attempt at matching the specific visual blend */
            background: linear-gradient(135deg, #8e44ad 0%, #a259ff 50%, #ff4d94 100%);
            
            /* Actually, looking closely, it's a smooth transition from a deep purple to a bright pink/red */
            background: linear-gradient(135deg, #8e44ad 0%, #9b59b6 30%, #d63384 100%);
            /* Let's use the most direct CSS approximation */
            background: linear-gradient(135deg, #8e44ad 0%, #a55eea 50%, #ff4d94 100%);

            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 60px;
            color: white;
        }

        .left-panel h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .left-panel p {
            font-size: 20px;
            line-height: 1.4;
            max-width: 400px;
            opacity: 0.9;
        }

        /* Right Panel (Login Form) */
        .right-panel {
            flex: 1;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
        }

        .login-card h2 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #000;
        }

        .login-card p.subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #8e44ad;
        }

        /* Checkbox and Forgot Password Row */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            cursor: pointer;
            color: #333;
        }

        .checkbox-container input {
            margin-right: 8px;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot-password {
            color: #6c5ce7;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Sign In Button */
        .btn-sign-in {
            width: 100%;
            padding: 14px;
            background-color: #7d52ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-sign-in:hover {
            background-color: #6c4ad9;
        }

        /* Footer Text */
        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #666;
        }

        .footer-text a {
            color: #ff4d94;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        /* Responsive adjustment */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .left-panel {
                padding: 40px;
                flex: none;
                height: 40vh;
            }
            .right-panel {
                height: 60vh;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Left Side -->
    <div class="left-panel">
        <h1>Studio Club</h1>
        <p>Share your projects with your class and see what everyone is making this term.</p>
    </div>

    <!-- Right Side -->
    <div class="right-panel">
        <div class="login-card">
            <h2>Welcome back</h2>
            <p class="subtitle">Sign in to your account</p>

            <form action="#" onsubmit="return false;">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" value="sam@school.org">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" value="••••••••">
                </div>

                <div class="options-row">
                    <label class="checkbox-container">
                        <input type="checkbox" checked>
                        Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn-sign-in">Sign in</button>
            </form>

            <div class="footer-text">
                New here? <a href="#">Create an account</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
