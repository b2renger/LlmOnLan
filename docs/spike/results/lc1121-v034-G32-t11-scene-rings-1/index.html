<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Scene</title>
<style>
  body { margin: 0; overflow: hidden; background: #0a0a2e; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="three.min.js"></script>
<script>
(function() {
  const W = 1024, H = 640;

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  document.body.appendChild(renderer.domElement);

  // Scene
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a2e);

  // Camera
  const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);
  camera.position.set(0, 1.5, 12);
  camera.lookAt(0, 1, 0);

  // Lights
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
  fillLight.position.set(-5, 5, -5);
  scene.add(fillLight);

  // Material helper
  function makeMat(color) {
    return new THREE.MeshStandardMaterial({
      color: color,
      roughness: 0.5,
      metalness: 0.1
    });
  }

  // --- Cylinders (left to right) ---
  const cylRadius = 0.55;

  // 1. Red cylinder
  const redCyl = new THREE.Mesh(
    new THREE.CylinderGeometry(cylRadius, cylRadius, 1.2, 32),
    makeMat(0xb5343a)
  );
  redCyl.position.set(-3.8, 0.6, 0);
  scene.add(redCyl);

  // 2. Orange cylinder
  const orangeCyl = new THREE.Mesh(
    new THREE.CylinderGeometry(cylRadius, cylRadius, 1.8, 32),
    makeMat(0xc87420)
  );
  orangeCyl.position.set(-1.9, 0.9, 0);
  scene.add(orangeCyl);

  // 3. Gold/Yellow cylinder
  const goldCyl = new THREE.Mesh(
    new THREE.CylinderGeometry(cylRadius, cylRadius, 2.4, 32),
    makeMat(0xc49a30)
  );
  goldCyl.position.set(0, 1.2, 0);
  scene.add(goldCyl);

  // 4. Teal cylinder
  const tealCyl = new THREE.Mesh(
    new THREE.CylinderGeometry(cylRadius, cylRadius, 3.0, 32),
    makeMat(0x2a7a72)
  );
  tealCyl.position.set(1.9, 1.5, 0);
  scene.add(tealCyl);

  // 5. Blue cylinder
  const blueCyl = new THREE.Mesh(
    new THREE.CylinderGeometry(cylRadius, cylRadius, 3.6, 32),
    makeMat(0x3a6fc0)
  );
  blueCyl.position.set(3.8, 1.8, 0);
  scene.add(blueCyl);

  // --- Torus (purple, floating above center) ---
  const torus = new THREE.Mesh(
    new THREE.TorusGeometry(1.2, 0.35, 24, 48),
    makeMat(0x7a3a9a)
  );
  torus.position.set(0, 4.2, 0);
  torus.rotation.x = Math.PI / 2; // face the camera
  scene.add(torus);

  // Render
  renderer.render(scene, camera);

  // Signal completion
  window.__rendered = true;
})();
</script>
</body>
</html>
