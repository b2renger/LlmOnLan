<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Booking</title>
    <style>
        /* General Reset and Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f2ed;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            background-color: #0d4354;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
        }

        nav a.active {
            color: white;
            border-bottom: 2px solid #e07b28;
            padding-bottom: 4px;
        }

        nav a:hover {
            color: white;
        }

        /* Main Content */
        main {
            flex: 1;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
            width: 100%;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        /* Cards */
        .card {
            background-color: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-bottom: 1.5rem;
            color: #1c3340;
            font-size: 1.25rem;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #555;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cfd8dc;
            border-radius: 6px;
            font-size: 1rem;
            color: #333;
            background-color: #fff;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        select:focus {
            border-color: #0d4354;
        }

        .book-btn {
            background-color: #e07b28;
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 1rem;
            width: auto;
            display: inline-block;
        }

        .book-btn:hover {
            background-color: #c96a1e;
        }

        /* Upcoming List Styles */
        .upcoming-list {
            list-style: none;
        }

        .upcoming-item {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
            font-size: 0.95rem;
        }

        .upcoming-item:last-child {
            border-bottom: none;
        }

        .upcoming-time {
            color: #666;
            font-weight: 400;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            color: #888;
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
            }
            
            header {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Room booking</div>
        <nav>
            <ul>
                <li><a href="#" class="active">Book</a></li>
                <li><a href="#">My bookings</a></li>
                <li><a href="#">Help</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Booking Form Section -->
        <section class="card">
            <h2>Book a room</h2>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="name">Your name</label>
                    <input type="text" id="name" name="name" value="Alex Martin" required>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" value="2026-12-03" required>
                </div>

                <div class="form-group">
                    <label for="room">Room</label>
                    <select id="room" name="room" required>
                        <option value="science_lab_b12" selected>Science lab B12</option>
                        <option value="art_studio">Art studio</option>
                        <option value="library_room_2">Library room 2</option>
                        <option value="lecture_hall_a">Lecture Hall A</option>
                    </select>
                </div>

                <button type="submit" class="book-btn">Book</button>
            </form>
        </section>

        <!-- Upcoming Bookings Section -->
        <section class="card">
            <h2>Upcoming</h2>
            <ul class="upcoming-list">
                <li class="upcoming-item">
                    <span>Art studio</span>
                    <span class="upcoming-time">Mon 9:00</span>
                </li>
                <li class="upcoming-item">
                    <span>Library room 2</span>
                    <span class="upcoming-time">Tue 14:00</span>
                </li>
                <li class="upcoming-item">
                    <span>Science lab B12</span>
                    <span class="upcoming-time">Thu 10:30</span>
                </li>
            </ul>
        </section>
    </main>

    <footer>
        School rooms &middot; 3 bookings this week
    </footer>

</body>
</html>
