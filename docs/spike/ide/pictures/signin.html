<!doctype html>
<!-- PICTURE_TO_PAGE_PLAN step 1: a third interface (signin.png). The truth to compare with. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 640px; display: grid; grid-template-columns: 1fr 1fr; font-family: "Segoe UI", Arial, sans-serif; }
  .art { background: linear-gradient(160deg, #7c3aed, #db2777); color: #fff; padding: 60px 50px; }
  .art h1 { font-size: 34px; margin: 0 0 14px; }
  .art p { font-size: 17px; line-height: 1.5; opacity: .9; max-width: 320px; }
  .form { display: flex; align-items: center; justify-content: center; background: #fff; }
  form { width: 330px; }
  h2 { margin: 0 0 6px; font-size: 24px; color: #111827; }
  .sub { color: #6b7280; font-size: 14px; margin: 0 0 22px; }
  label { display: block; font-size: 13px; color: #374151; margin: 14px 0 5px; }
  input[type=email], input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }
  .line { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 13px; color: #374151; }
  .line a { color: #7c3aed; text-decoration: none; }
  button { width: 100%; margin-top: 20px; padding: 11px; border: 0; border-radius: 8px; background: #7c3aed; color: #fff; font-size: 16px; font-weight: 600; }
  .new { text-align: center; font-size: 13px; color: #6b7280; margin-top: 18px; }
  .new a { color: #db2777; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="art">
  <h1>Studio Club</h1>
  <p>Share your projects with your class and see what everyone is making this term.</p>
</div>
<div class="form">
  <form>
    <h2>Welcome back</h2>
    <p class="sub">Sign in to your account</p>
    <label for="em">Email</label><input id="em" type="email" value="sam@school.org">
    <label for="pw">Password</label><input id="pw" type="password" value="secret12">
    <div class="line"><span><input type="checkbox" checked> Remember me</span><a href="#">Forgot password?</a></div>
    <button>Sign in</button>
    <p class="new">New here? <a href="#">Create an account</a></p>
  </form>
</div>
</body>
</html>
