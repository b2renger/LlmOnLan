<!doctype html>
<!-- PICTURE_TO_PAGE_PLAN step 1: a second interface (dashboard.png). The truth to compare with. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>School energy</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f6f7fb; color: #1f2937; }
  aside { position: fixed; top: 0; left: 0; bottom: 0; width: 190px; background: #1e1b4b; color: #c7d2fe; padding: 22px 18px; }
  aside h1 { color: #fff; font-size: 19px; margin: 0 0 26px; }
  aside a { display: block; color: #c7d2fe; text-decoration: none; padding: 9px 10px; border-radius: 6px; font-size: 14px; margin-bottom: 4px; }
  aside a.on { background: #4338ca; color: #fff; }
  main { margin-left: 190px; padding: 24px 30px; }
  h2 { margin: 0 0 18px; font-size: 22px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
  .stat { background: #fff; border-radius: 10px; padding: 16px 18px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
  .stat small { color: #6b7280; font-size: 13px; }
  .stat b { display: block; font-size: 28px; margin-top: 6px; }
  .stat.up b { color: #059669; } .stat.down b { color: #dc2626; }
  .row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
  .card { background: #fff; border-radius: 10px; padding: 16px 18px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
  .card h3 { margin: 0 0 12px; font-size: 15px; }
  .bars { display: flex; align-items: flex-end; gap: 14px; height: 150px; border-bottom: 1px solid #e5e7eb; }
  .bars div { flex: 1; background: #6366f1; border-radius: 4px 4px 0 0; }
  .days { display: flex; gap: 14px; font-size: 12px; color: #6b7280; margin-top: 6px; }
  .days span { flex: 1; text-align: center; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: #6b7280; font-weight: 600; padding: 6px 0; border-bottom: 1px solid #e5e7eb; }
  td { padding: 7px 0; border-bottom: 1px solid #f1f2f6; }
</style>
</head>
<body>
<aside>
  <h1>EcoSchool</h1>
  <a class="on" href="#">Overview</a><a href="#">Buildings</a><a href="#">Reports</a><a href="#">Settings</a>
</aside>
<main>
  <h2>Energy this week</h2>
  <div class="stats">
    <div class="stat"><small>Electricity</small><b>1,240 kWh</b></div>
    <div class="stat up"><small>Solar produced</small><b>386 kWh</b></div>
    <div class="stat down"><small>Heating</small><b>+12 %</b></div>
  </div>
  <div class="row">
    <section class="card">
      <h3>Daily use</h3>
      <div class="bars"><div style="height:62%"></div><div style="height:80%"></div><div style="height:71%"></div><div style="height:93%"></div><div style="height:55%"></div></div>
      <div class="days"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span></div>
    </section>
    <section class="card">
      <h3>Buildings</h3>
      <table>
        <tr><th>Building</th><th>kWh</th></tr>
        <tr><td>Main hall</td><td>520</td></tr>
        <tr><td>Gym</td><td>310</td></tr>
        <tr><td>Science wing</td><td>255</td></tr>
        <tr><td>Library</td><td>155</td></tr>
      </table>
    </section>
  </div>
</main>
</body>
</html>
