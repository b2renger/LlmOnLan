<!doctype html>
<!-- PICTURE_TO_PAGE_PLAN step 1: a second scene (desk.png). The truth: a brown table (a box top on four box legs), a white
     mug (a cylinder) on it, a lamp (a grey cone shade on a thin cylinder) glowing yellow, a grey floor, a dark wall. -->
<html lang="en">
<head><meta charset="utf-8"><title>Desk</title><style>html,body{margin:0;overflow:hidden;background:#000}</style></head>
<body>
<script src="../../../../shell/renderer/chat/sandbox/lib/three.min.js"></script>
<script>
  const W = 1024, H = 640;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2b2d42);
  const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);
  camera.position.set(3.2, 3.4, 5.2);
  camera.lookAt(0, 1, 0);
  scene.add(new THREE.AmbientLight(0xffffff, 0.35));
  const lampLight = new THREE.PointLight(0xffd27a, 2.2, 12);
  lampLight.position.set(0.9, 2.3, -0.3);
  lampLight.castShadow = true;
  scene.add(lampLight);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x8d99ae }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);
  const wood = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
  const tabletop = new THREE.Mesh(new THREE.BoxGeometry(3, 0.15, 1.8), wood);
  tabletop.position.y = 1.2; tabletop.castShadow = true; tabletop.receiveShadow = true;
  scene.add(tabletop);
  for (const [x, z] of [[-1.35, -0.75], [1.35, -0.75], [-1.35, 0.75], [1.35, 0.75]]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.2, 0.15), wood);
    leg.position.set(x, 0.6, z); leg.castShadow = true;
    scene.add(leg);
  }
  const mug = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.38, 32), new THREE.MeshStandardMaterial({ color: 0xf8f9fa }));
  mug.position.set(-0.6, 1.47, 0.3); mug.castShadow = true;
  scene.add(mug);
  const grey = new THREE.MeshStandardMaterial({ color: 0x6c757d });
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.0, 16), grey);
  pole.position.set(0.9, 1.77, -0.3);
  scene.add(pole);
  const shade = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.4, 32, 1, true), new THREE.MeshStandardMaterial({ color: 0x6c757d, side: THREE.DoubleSide, emissive: 0x332200 }));
  shade.position.set(0.9, 2.35, -0.3);
  scene.add(shade);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffe08a }));
  bulb.position.set(0.9, 2.22, -0.3);
  scene.add(bulb);
  renderer.render(scene, camera);
  window.__rendered = true;
</script>
</body>
</html>
