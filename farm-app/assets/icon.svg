<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- LlmOnLan FARM: same mark as the client â€” an AI chat bubble (sparkle knocked
       out) radiating over the LAN â€” but emerald on the dark machine-room tile.
       Solid tile = the app you chat in; dark tile = the box that serves it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2c2c33"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="mark" x1="512" y1="297" x2="512" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <mask id="spark" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#ffffff"/>
      <path d="M512 398 Q533 481 616 502 Q533 523 512 606 Q491 523 408 502 Q491 481 512 398 Z" fill="#000000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="7" y="7" width="1010" height="1010" rx="223" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="14"/>
  <!-- chat bubble + tail, AI sparkle cut out -->
  <g fill="url(#mark)" mask="url(#spark)">
    <rect x="330" y="344" width="364" height="316" rx="96"/>
    <path d="M442 652 C422 700 404 718 386 730 C438 716 488 690 528 654 Z"/>
  </g>
  <!-- LAN signal arcs -->
  <g stroke="url(#mark)" stroke-width="84" stroke-linecap="round" fill="none">
    <path d="M 772 297 A 330 330 0 0 1 772 703"/>
    <path d="M 252 297 A 330 330 0 0 0 252 703"/>
  </g>
</svg>
