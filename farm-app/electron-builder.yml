# electron-builder — packages the LlmOnLan Farm app into a small installer per OS,
# published to GitHub Releases (no paid signing). Updates are manual: the app
# looks for a newer farm-v* release and opens its page (src/main/updater.ts). Unlike the
# client (shell/), this app DOES ship an extraResource: the pure-JS `lol` farm
# code (tiny). The heavy runtime (portable CPython + Ollama + the gemma4:12b model)
# is downloaded to userData on first run by the setup wizard — see
# src/main/runtimeManager.ts + installer.ts — so the installer stays ~100 MB.

appId: com.llmonlan.farm
productName: LlmOnLan Farm

# App sources (the app has no production dependencies; dev deps are pruned).
files:
  - build/**/*
  - renderer/**/*
  - assets/**/*
  - package.json

# The <webview> preload (seeds the admin token into localStorage) is loaded as a
# file:// URL; unpack it so it's a real on-disk file, not read from inside app.asar
# (webview preload resolution from asar is fragile across Electron versions).
asarUnpack:
  - renderer/webviewPreload.js

# Bundle the farm CLI into the app. It's pure-JS (js-yaml/zod/argparse — no native
# modules), so it rides along with no ABI rebuild. First-run copies resources/farm
# → userData/farm (writable) and runs it from there (the farm writes its venvs, models,
# runtime file and config backups INSIDE its own dir, which a read-only asar forbids).
# We EXCLUDE what a dev checkout's `lol up` wrote there (venvs, .models, the config and
# its backups, which hold the farm password and the admin token, the move journal,
# __pycache__) + the generated LiteLLM config, so it never ships in the installer. Keep
# it in step with FARM_COPY_SKIP in src/main/installer.ts (the app's own copy, which a
# dev run makes from ../farm): test/supervisor.test.js checks both against one list.
extraResources:
  - from: ../farm
    to: farm
    filter:
      - "**/*"
      - "!.venv/**"
      - "!.searxng/**"
      - "!.extract/**"
      - "!.kokoro/**"
      - "!.classify/**"
      - "!.stt/**"
      - "!.models/**"
      - "!.llamacpp/**"
      - "!**/__pycache__/**"
      - "!.lol-runtime.json"
      - "!.lol-id"
      - "!.lol-secret"
      - "!.lol-storage-move.json"
      - "!lol.config.json*"
      - "!litellm/config.generated.yaml"
  # electron-builder HARD-EXCLUDES any dir named node_modules encountered while
  # walking an extraResources `from` — so the farm's pure-JS deps (js-yaml/zod) never
  # shipped, and `lol` crashed with "Cannot find module 'js-yaml'". Copy node_modules
  # via its OWN entry (node_modules as the walk ROOT), which the exclusion doesn't hit.
  - from: ../farm/node_modules
    to: farm/node_modules

directories:
  output: dist
  buildResources: assets

# macOS only: ad-hoc codesign so Gatekeeper doesn't flag the app as "damaged".
afterPack: scripts/afterPack.cjs

# publish names the GitHub repo. CI publishes with gh (release-farm.yml); the farm*.yml
# files electron-builder writes for channel: farm are read by nothing (no
# electron-updater; see README "Updates (manual)").
publish:
  provider: github
  owner: b2renger
  repo: LlmOnLan
  channel: farm
  releaseType: release

# NSIS per-user (perMachine:false): installs with no UAC prompt. Space-free
# artifactName (GitHub turns spaces into dots on upload).
win:
  target: nsis
  icon: assets/icon.png
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  artifactName: LlmOnLan-Farm-Setup-${version}.${ext}

# arm64 ONLY (Apple Silicon, M1+). The runtime is downloaded per-arch at first run,
# so there's no arch-specific payload in the installer, but gemma4:12b wants ≥16 GB
# unified memory — the wizard warns below that. dmg + zip downloads. Ad-hoc signed
# (identity:null + afterPack).
mac:
  category: public.app-category.developer-tools
  icon: assets/icon.png
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  identity: null
  hardenedRuntime: false
  artifactName: LlmOnLan-Farm-${version}-${arch}.${ext}

# arm64 AppImage for the NVIDIA DGX Spark (linux arm64) — a natural always-on host.
# Built natively on a ubuntu-24.04-arm runner (no cross-compile). FUSE 2 is needed to
# run an AppImage (or --appimage-extract-and-run as the FUSE-free fallback).
linux:
  target:
    - target: AppImage
      arch: [arm64]
  icon: assets/icon.png
  category: Network
  artifactName: LlmOnLan-Farm-${version}-${arch}.${ext}
